  <style>

      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }
    .live-card-glow {

    }

      100% { transform: translateY(-140px) scale(1.4) rotate(25deg); opacity: 0; }

    }

      50% { transform: translateY(-4px) rotate(4deg); }
    }

    }

    @keyframes water-wave {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .water-pop {
      animation: water-wave 2s ease-in-out infinite;
    }
    /* 🌟 EXECUTIVE BROADCAST RUNNING TICKER */
@keyframes marqueeExecutiveScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.executive-ticker-track {
  display: flex;
  width: max-content;
  animation: marqueeExecutiveScroll 38s linear infinite;
}
.executive-ticker-track:hover {
  animation-play-state: paused;
}
    /* 🌸 ANIMASI PRINCESS AURORA GLOW (PINK ROSE & DREAMY LAVENDER BERPUTAR) */

    }
    @media (max-width: 640px) {
      body.cute-bg { background-attachment: scroll; }
      #root .rounded-3xl { border-radius: 1.15rem; }

      const sec = Math.max(0, Math.floor(totalSeconds));

      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (end === '23:59') {
        eh = 24;
        em = 0;
      }
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
        if (diff > 1440) diff = 120;
      }
      return Math.round((diff / 60) * 10) / 10;
    };

    const addDaysToDateStr = (dateStr, daysToAdd) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysToAdd);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    const playNotificationChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        const now = ctx.currentTime;
        playTone(587.33, now, 0.25);
        playTone(880.00, now + 0.2, 0.45);
      } catch (e) {
        console.log("Audio chime error:", e);
      }
    };

    const playWaterBubbleChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playDrop = (freqStart, freqEnd, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freqStart, startTime);
          osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + duration);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        const now = ctx.currentTime;
        playDrop(420, 880, now, 0.16);
        playDrop(540, 1120, now + 0.18, 0.22);
      } catch (e) {
        console.log("Water sound error:", e);
      }
    };

    const playMekelMeowSound = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(860, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(610, now + 0.38);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {
        console.log("Meow sound error:", e);
      }
    };

        if (!("Notification" in window)) {
          notify(`📢 ${autoDailyReminder.text}`);
          return;
        }

        let perm = Notification.permission;
        if (perm === "default") {
          perm = await Notification.requestPermission();
        }

        if (perm === "granted") {
          // Cek apakah Service Worker HP tersedia
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready;
            reg.showNotification(`${autoDailyReminder.icon} ${autoDailyReminder.tag}`, {
              body: autoDailyReminder.text,
              icon: "https://api.iconify.design/noto:cherry-blossom.svg",
              badge: "https://api.iconify.design/noto:cherry-blossom.svg",
              vibrate: [200, 100, 200],
              tag: "alisya-schedule-reminder",
              renotify: true
            });
          } else {
            new Notification(`${autoDailyReminder.icon} ${autoDailyReminder.tag}`, {
              body: autoDailyReminder.text
            });
          }
          notify("🔔 Pengingat berhasil dikirim ke layar HP kamu!");
        } else {
          notify("⚠️ Izin notifikasi belum diizinkan di setelan browser HP kamu.");
        }
      };

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {
          const sM = timeToMinutes(slot.start);
          const eM = timeToMinutes(slot.end);
          const isBusy = selectedDaySchedules.some(s => {
            const st = timeToMinutes(s.start_time);
            let en = timeToMinutes(s.end_time);
            if (en <= st) en = 24 * 60;
            return st < eM && en > sM;
          });
          return !isBusy;
        });
      }, [selectedDaySchedules]);

      const getDayScheduleDensity = (dateStr) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };

        const hasOff = dayShifts.some(s => s.status === 'OFF');
        if (hasOff) return { text: t.statusOff, badge: 'bg-rose-100 text-rose-800 border-rose-300' };

        let productiveHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') {
            productiveHours += calculateDurationHours(s.start_time, s.end_time);
          }
        });

        if (productiveHours >= 10) {
          return { text: t.statusFull, badge: 'bg-rose-500 text-white font-black shadow-sm' };
        }
        if (productiveHours >= 8) {
          return { text: t.statusMed, badge: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' };
        }
        if (productiveHours > 0) {
          return { text: t.statusLow, badge: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold' };
        }
        return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };
      };

      const filteredByStatPeriod = useMemo(() => {
        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);

          if (statPeriod === 'daily') {
            return s.date === customStatDate;
          } else if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const dayOfWeek = refDate.getDay();
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - dayOfWeek);
            startOfWeek.setHours(0,0,0,0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          } else if (statPeriod === 'monthly') {
            return sY === customStatYear && sM === (customStatMonth + 1);
          } else if (statPeriod === 'yearly') {
            return sY === customStatYear;
          }
          return true;
        });
      }, [schedules, statPeriod, customStatDate, customStatMonth, customStatYear]);

      const stats = useMemo(() => {
        let totalLive = 0, totalOff = 0, totalSick = 0, totalMeeting = 0, totalSleep = 0, totalMeTime = 0, totalKonten = 0;
        let totalLiveHours = 0, totalSleepHours = 0, totalKontenHours = 0, totalMeTimeHours = 0;

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);

          if (s.status === 'LIVE') {
            totalLive++;
            totalLiveHours += dur;
          } else if (s.status === 'OFF') {
            totalOff++;
          } else if (s.status === 'Sakit / Medis') {
            totalSick++;
          } else if (s.status === 'Meeting') {
            totalMeeting++;
          } else if (s.status === 'Tidur') {
            totalSleep++;
            totalSleepHours += (dur || 7);
          } else if (s.status === 'Konten' || s.brand_id === 'b_konten') {
            totalKonten++;
            totalKontenHours += dur;
          } else if (s.status === 'Me Time' || s.status === 'Lain-Lain' || s.brand_id === 'b_lainlain') {
            totalMeTime++;
            totalMeTimeHours += dur;
          }
        });

        if (statPeriod === 'daily') {
          totalLiveHours = Math.min(24, Math.round(totalLiveHours * 10) / 10);
          totalSleepHours = Math.min(24, Math.round(totalSleepHours * 10) / 10);
          totalKontenHours = Math.min(24, Math.round(totalKontenHours * 10) / 10);
        } else {
          totalLiveHours = Math.round(totalLiveHours * 10) / 10;
          totalSleepHours = Math.round(totalSleepHours * 10) / 10;
          totalKontenHours = Math.round(totalKontenHours * 10) / 10;
        }

        const perBrand = brands.map(b => {
          const list = filteredByStatPeriod.filter(s => s.brand_id === b.id);
          const liveCount = list.filter(s => s.status === 'LIVE').length;
          const offCount = list.filter(s => s.status === 'OFF').length;
          return { name: b.name, emoji: b.emoji, totalShift: list.length, liveCount, offCount, totalJam: liveCount * 2, color: b.color };
        });

        return { totalLive, totalOff, totalSick, totalMeeting, totalSleep, totalMeTime, totalKonten, totalLiveHours, totalSleepHours, totalKontenHours, totalMeTimeHours, perBrand };
      }, [filteredByStatPeriod, brands, statPeriod]);

      const balanceScoreData = useMemo(() => {
        const prodHours = stats.totalLiveHours + stats.totalKontenHours;
        if (statPeriod === 'daily' && prodHours >= 11) {
          return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        }
        if (prodHours > 85) {
          return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        }
        if (stats.totalSleepHours === 0 && prodHours > 8) {
          return { text: t.scoreWarning, color: 'text-amber-800 bg-amber-50 border-amber-200' };
        }
        return { text: t.scoreBalanced, color: 'text-emerald-800 bg-emerald-50 border-emerald-200' };
      }, [stats, statPeriod, t]);

      // 👑 SISTEM SKOR PRODUKTIVITAS & EVALUASI OTOMATIS
      const princessProductivity = useMemo(() => {
        const workHours = (stats.totalLiveHours || 0) + (stats.totalKontenHours || 0);
        const restHours = (stats.totalSleepHours || 0) + (stats.totalMeTimeHours || 0);
        
        let score = 85;
        let title = "Slay Mode On! ✨";
        let message = "Semua porsi kerja dan istirahatmu sangat seimbang dan luar biasa!";
        let badgeColor = "bg-pink-100 text-pink-900 border-pink-300";

        if (workHours > 12) {
          score = 70;
          title = "High Grind Alert 🔥";
          message = "Wah, kerja keras banget! Jangan lupa luangkan waktu buat istirahat ya.";
          badgeColor = "bg-amber-100 text-amber-900 border-amber-300";
        } else if (restHours < 6 && statPeriod === 'daily') {
          score = 60;
          title = "Need More Rest 🥺";
          message = "Waktu tidur atau me time-nya kurang nih. Yuk jaga kesehatan biar tetap glowing!";
          badgeColor = "bg-rose-100 text-rose-900 border-rose-300";
        } else if (workHours >= 4 && restHours >= 7) {
          score = 98;
          title = "Queen Balance 👑";
          message = "Produktivitas juara! Target tercapai dan tubuh tetap bugar. Proud of you!";
          badgeColor = "bg-purple-100 text-purple-900 border-purple-300";
        }

        return { score, title, message, badgeColor };
      }, [stats, statPeriod]);

      const periodLabel = useMemo(() => {
        if (statPeriod === 'daily') return `${getHariNama(customStatDate)}, ${customStatDate}`;
        if (statPeriod === 'weekly') {
          const [y, m, d] = customStatDate.split('-').map(Number);
          const ref = new Date(y, m - 1, d);
          const start = new Date(ref);
          start.setDate(ref.getDate() - ref.getDay());
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          return `${start.getDate()} - ${end.getDate()} ${new Intl.DateTimeFormat(t.locale, { month: 'short' }).format(end)} ${end.getFullYear()}`;
        }
        if (statPeriod === 'monthly') {
          const mLabel = new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(customStatYear, customStatMonth, 1));
          return `${mLabel} ${customStatYear}`;
        }
        if (statPeriod === 'yearly') return `${t.yearLabel} ${customStatYear}`;
        return '';
      }, [statPeriod, customStatDate, customStatMonth, customStatYear, t]);

      const filteredSchedules = useMemo(() => {
        return schedules.filter(s => {
          if (filterBrand !== 'ALL' && s.brand_id !== filterBrand) return false;
          if (filterStatus !== 'ALL' && s.status !== filterStatus) return false;
          if (filterDate && s.date !== filterDate) return false;
          if (filterHour !== 'ALL') {
            const startHour = parseInt(s.start_time.split(':')[0], 10);
            const targetHour = parseInt(filterHour, 10);
            if (startHour !== targetHour) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const bName = brands.find(b => b.id === s.brand_id)?.name.toLowerCase() || '';
            const matchTitle = s.title.toLowerCase().includes(q);
            const matchNotes = (s.notes || '').toLowerCase().includes(q);
            const matchBrand = bName.includes(q);
            const matchDate = s.date.includes(q);
            if (!matchTitle && !matchNotes && !matchBrand && !matchDate) return false;
          }
          return true;
        });
      }, [schedules, filterBrand, filterStatus, filterDate, filterHour, searchQuery, brands]);

      const handleResetFilter = () => {
        setSearchQuery('');
        setFilterBrand('ALL');
        setFilterStatus('ALL');
        setFilterDate('');

      const donutCanvas = useRef(null);
      const barCanvas = useRef(null);
      const donutInst = useRef(null);

      useEffect(() => {

      useEffect(() => {

        if (nextItem.startsInMin <= 15 && nextItem.startsInMin > 0) {

      const handleToggleChecklist = (e, itemId, stepKey) => {
        e.stopPropagation();
        if (!isAdmin) { setPinInputModal(true); return; }
        const updated = schedules.map(s => {
          if (s.id === itemId) {
            const currentCheck = s.checklist || { shoot: false, edit: false, upload: false };
            return {
              ...s,
              checklist: { ...currentCheck, [stepKey]: !currentCheck[stepKey] }
            };
          }
          return s;

        saveSchedulesToCloud(updated);
        triggerCuteSparkles();
        notify('🌸 Progres konten diperbarui!');
      };

      const handleCloneFullDay = (e) => {
        e.preventDefault();
        if (!isAdmin) { setPinInputModal(true); return; }
        if (selectedDaySchedules.length === 0) {
          notify('⚠️ Tidak ada jadwal di tanggal ini untuk disalin.');
          setCloneModalOpen(false);
          return;
        }
        const existingOnTarget = schedules.filter(s => s.date === cloneTargetDate);
        const nonConflicting = selectedDaySchedules.filter(item => {
          const sM = timeToMinutes(item.start_time);
          let eM = timeToMinutes(item.end_time);
          if (eM <= sM) eM = 24 * 60;
          return !existingOnTarget.some(ex => {
            const exS = timeToMinutes(ex.start_time);
            let exE = timeToMinutes(ex.end_time);
            if (exE <= exS) exE = 24 * 60;
            return sM < exE && eM > exS;
          });
        });

        if (nonConflicting.length === 0) {
          notify('⛔ Semua jam di tanggal tujuan sudah terisi! Tidak bisa menumpuk jadwal.');
          return;
        }

        const clonedList = nonConflicting.map((item, idx) => ({
          ...item,
          id: 'sch_' + Date.now() + '_clone_' + idx,
          date: cloneTargetDate
        }));
        saveSchedulesToCloud([...schedules, ...clonedList]);
        setCloneModalOpen(false);
        setSelectedDate(cloneTargetDate);
        triggerCuteSparkles();
        notify(`🎀 ${clonedList.length} sesi berhasil disalin ke tanggal ${cloneTargetDate}!`);

      const exportElementAsPNG = async (elementId, filenameLabel) => {

          return;

        notify('📸 Sedang memproses gambar...');
        try {

            scale: 2,
            useCORS: true,
            backgroundColor: darkMode ? '#0F172A' : '#FFF5F7'
          });
          const link = document.createElement('a');
          link.download = `Alisya_Schedule_${filenameLabel}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          notify('✨ Gambar (.PNG) berhasil diunduh!');

          notify('⚠️ Gagal mengunduh gambar.');
        }
      };

      const handleVerifyPin = (e) => {

        const targetDate = dateStr || selectedDate;

        setFormData({

          checklist: { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);

      const handleOpenEdit = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        setSelectedSchedule(sch);
        setRepeatDays(1);
        setFormData({
          ...sch,
          checklist: sch.checklist || { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);
      };

      const handleDuplicate = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const freeSlot = findFirstFreeSlotOnDate(sch.date, sch.start_time, sch.end_time);
        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({
          ...sch,
          id: 'sch_' + Date.now(),
          title: sch.title + ' (Copy)',
          start_time: freeSlot.start,
          end_time: freeSlot.end
        });

      const applyMomUungPreset = (shiftNum, start, end) => {

        if (conflict) {
          notify(`⛔ Jam ${start}-${end} sudah terisi oleh "${conflict.title}" (${conflict.start_time}-${conflict.end_time})!`);

        }));

      const applyAquaPressPreset = (shiftNum, start, end) => {

        if (conflict) {
          notify(`⛔ Jam ${start}-${end} sudah terisi oleh "${conflict.title}" (${conflict.start_time}-${conflict.end_time})!`);
          return;

        const aquaBrand = brands.find(b => b.id === 'b_aquapress') || { color: '#00FFFF' };
        setFormData(prev => ({

          title: `Shift ${shiftNum} AquaPress`,
          brand_id: 'b_aquapress',
          status: 'LIVE',
          color: aquaBrand.color,
          start_time: start,
          end_time: end
        }));

      const handleSave = (e) => {
        e.preventDefault();
        const sMin = timeToMinutes(formData.start_time);
        const eMin = timeToMinutes(formData.end_time);

        if (eMin <= sMin) {
          notify('⛔ Jam Selesai harus lebih besar dari Jam Mulai!');
          return;
        }

        const brandObj = brands.find(b => b.id === formData.brand_id);
        const basePayload = { ...formData, color: brandObj?.color || formData.color };

        if (selectedSchedule) {
          const conflict = getRangeConflictOnFormDate(basePayload.start_time, basePayload.end_time);
          if (conflict) {
            notify(`⛔ Tidak bisa disimpan! Bentrok dengan "${conflict.title}" (${conflict.start_time}-${conflict.end_time}).`);
            return;
          }
          saveSchedulesToCloud(schedules.map(s => s.id === selectedSchedule.id ? basePayload : s));
          notify('✨ Jadwal berhasil diperbarui!');
        } else {
          const newItems = [];
          const skippedDates = [];
          const count = Number(repeatDays) || 1;

          for (let i = 0; i < count; i++) {
            const targetDate = i === 0 ? basePayload.date : addDaysToDateStr(basePayload.date, i);
            const daySchedules = schedules.filter(s => s.date === targetDate);
            const hasConflict = daySchedules.some(ex => {
              const exS = timeToMinutes(ex.start_time);
              let exE = timeToMinutes(ex.end_time);
              if (exE <= exS) exE = 24 * 60;
              return sMin < exE && eMin > exS;
            });

            if (hasConflict) {
              skippedDates.push(targetDate);
            } else {
              newItems.push({
                ...basePayload,
                id: 'sch_' + Date.now() + '_' + i,
                date: targetDate
              });
            }
          }

          if (newItems.length === 0) {
            notify(`⛔ Gagal menyimpan! Jam ${basePayload.start_time}-${basePayload.end_time} sudah terisi di tanggal tersebut.`);
            return;

          saveSchedulesToCloud([...schedules, ...newItems]);
          if (skippedDates.length > 0) {

      const exportCSV = () => {

          `"${getHariNama(s.date)}"`,
          s.date,
          s.start_time,
          s.end_time,
          `"${s.title.replace(/"/g, '""')}"`,
          `"${(brands.find(b => b.id === s.brand_id)?.name || s.brand_id).replace(/"/g, '""')}"`,

        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);

      const shareToWhatsApp = () => {

        const hari = getHariNama(selectedDate);

      const shareSpreadsheetToWA = () => {

                  onClick={() => handleOpenCreate(selectedDate)}
                  className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-r from-maroon to-rose-600 text-white flex items-center justify-center text-3xl shadow-2xl z-40 active:scale-90 transition border-2 border-pink-200"
                >
                  +
                </button>
              )}
            </div>
          )}

          {/* ========================================================= */}
          {/* 🌟 3. MODAL POPUP PIN, CLONE DAY & FORM INPUT JADWAL      */}
          {/* ========================================================= */}
{/* MODAL PENGATURAN SLIDESHOW FOTO & VIDEO RADAR */}
          {radarMediaModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 space-y-4 border-2 border-pink-300 animate-in zoom-in duration-150">
                <div className="flex items-center justify-between">
                  <h3 className="font-black text-base text-[#6D2E46] flex items-center gap-2">
                    <span>🎬</span><span>Slideshow Foto & Video Radar</span>
                  </h3>
                  <button type="button" onClick={() => setRadarMediaModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Tempelkan link foto atau video (format <b>.mp4</b>) di sini (1 baris = 1 link). Media akan tampil transparan secara bergantian setiap <b>7 detik</b>! 🌸
                </p>
                <form onSubmit={handleSaveRadarMedia} className="space-y-3 text-xs">
                  <textarea
                    rows="6"
                    value={radarMediaInput}
                    onChange={e => setRadarMediaInput(e.target.value)}
                    placeholder={"https://drive.google.com/file/d/xxxx/view?usp=sharing\nhttps://example.com/video-aesthetic.mp4"}
                    className="w-full bg-pink-50/50 border border-pink-300 rounded-2xl p-3 font-mono text-[11px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                  ></textarea>
                  <div className="flex justify-between text-[10px] text-slate-500">
                    <span>Mendukung Foto & Video MP4 🎥</span>
                    <span>Berganti tiap 7 detik ✨</span>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button type="button" onClick={() => setRadarMediaModal(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold">
                      Batal
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black shadow">
                      💖 Simpan Media
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {/* MODAL SALIN 1 HARI PENUH (CLONE DAY) */}
          {cloneModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <h3 className="font-black text-base text-slate-800">{t.cloneModalTitle}</h3>
                <p className="text-xs text-slate-500">
                  {t.cloneModalDesc} <span className="font-black text-maroon">{selectedDate}</span> ({selectedDaySchedules.length} sesi):
                </p>
                <form onSubmit={handleCloneFullDay} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.cloneTargetLabel}</label>
                    <input
                      type="date"
                      required
                      value={cloneTargetDate}
                      onChange={e => setCloneTargetDate(e.target.value)}
                      className="w-full bg-pink-50/50 border border-pink-300 rounded-2xl px-3.5 py-2.5 text-xs font-bold"
                    />
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setCloneModalOpen(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.cloneConfirmBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL PIN ADMIN */}
          {pinInputModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 text-center space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <div className="w-12 h-12 rounded-2xl bg-pink-100 text-maroon flex items-center justify-center text-2xl mx-auto font-black shadow-inner">
                  🎀
                </div>
                <div>
                  <h3 className="font-black text-base text-slate-800">{t.adminAccessTitle}</h3>
                  <p className="text-xs text-slate-500 mt-1">{t.adminAccessDesc}</p>
                </div>
                <form onSubmit={handleVerifyPin} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    autoFocus
                    value={enteredPin}
                    onChange={e => { setEnteredPin(e.target.value); setPinError(false); }}
                    placeholder={t.pinPlaceholder}
                    className="w-full text-center text-xl tracking-widest font-mono font-black bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-maroon"
                  />
                  {pinError && <div className="text-rose-600 text-xs font-bold">{t.pinWrong}</div>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setPinInputModal(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.unlockBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FORM INPUT JADWAL DENGAN PROTEKSI JAM TERISI (ANTI-TUMPUK) */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
              <div className="bg-white rounded-t-3xl md:rounded-3xl shadow-2xl w-full max-w-md max-h-[92vh] overflow-y-auto border-2 border-pink-200 animate-in slide-in-from-bottom duration-200">
                <div className="bg-gradient-to-r from-maroon to-rose-800 text-white p-4 flex justify-between items-center sticky top-0 z-10">
                  <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                    <span>🎀</span>
                    <span>{selectedSchedule ? t.modalEditTitle : t.modalAddTitle}</span>
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>
                <form onSubmit={handleSave} className="p-5 space-y-3 text-xs">
                  
                  {/* 🍼 PRESET MOM UUNG DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-amber-950 flex items-center gap-1.5 text-[11px]">
                        <span>🍼</span><span>{t.presetMomUung}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-amber-200/70 text-amber-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "05:00", en: "13:00" },
                        { num: 2, st: "11:00", en: "19:00" },
                        { num: 3, st: "16:00", en: "23:59" },
                        { num: 4, st: "00:00", en: "07:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyMomUungPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-amber-300 hover:bg-amber-100 text-amber-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-emerald-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] bg-rose-100 text-rose-700 px-1.5 py-0.2 rounded font-sans font-black">{t.presetBlocked}</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 💧 PRESET AQUAPRESS DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-cyan-50 border border-cyan-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-cyan-950 flex items-center gap-1.5 text-[11px]">
                        <span>💧</span><span>{t.presetAquaPress}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-cyan-200/70 text-cyan-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-3 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "08:00", en: "12:00" },
                        { num: 2, st: "12:00", en: "16:00" },
                        { num: 3, st: "16:00", en: "20:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyAquaPressPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-cyan-300 hover:bg-cyan-100 text-cyan-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-cyan-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] text-rose-600">🔒</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 🔒 DAFTAR JAM YANG SUDAH TERISI DI TANGGAL INI */}
                  <div className="bg-pink-50/80 border border-pink-200 rounded-2xl p-2.5 space-y-1.5">
                    <div className="text-[10px] font-black text-maroon">{t.occupiedTimelineTitle}</div>
                    {existingSchedulesOnFormDate.length === 0 ? (
                      <div className="text-[10px] text-emerald-700 font-bold">{t.allFreeTimeline}</div>
                    ) : (
                      <div className="flex flex-wrap gap-1">
                        {existingSchedulesOnFormDate.map(s => (
                          <span key={s.id} className="bg-white border border-rose-200 text-rose-800 font-mono text-[10px] font-bold px-2 py-0.5 rounded-lg shadow-2xs">
                            🔒 {s.start_time}-{s.end_time} ({s.title})
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formTitleLabel}</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      placeholder="Shift Mom Uung / AquaPress / Me Time / Take Konten"
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-maroon focus:outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.catBrand} *</label>
                      <select
                        value={formData.brand_id}
                      onChange={e => {
  const newBrandId = e.target.value;
  let newStatus = formData.status;
  if (newBrandId === 'b_konten') newStatus = 'Konten';
  else if (newBrandId === 'b_sleep') newStatus = 'Tidur';
  else if (newBrandId === 'b_lainlain') newStatus = 'Me Time';
  else if (newBrandId === 'b_pribadi') newStatus = 'OFF';
  else if (newBrandId === 'b_sakit') newStatus = 'Sakit / Medis';
  else if (newBrandId === 'b_momuung' || newBrandId === 'b_aquapress' || newBrandId === 'b_moell') newStatus = 'LIVE';
  setFormData({ ...formData, brand_id: newBrandId, status: newStatus });
}}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        {brands.map(b => (
                          <option key={b.id} value={b.id}>
                            {b.emoji} {b.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.attStatus} *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        <option value="LIVE">🟢 LIVE</option>
                        <option value="Konten">🎬 Take Konten Video</option>
                        <option value="Tidur">😴 Tidur / Istirahat</option>
                        <option value="Me Time">💅 Me Time</option>
                        <option value="Meeting">💬 Meeting</option>
                        <option value="OFF">☕ OFF (Libur)</option>
                       <option value="Sakit / Medis">🤒 SAKIT / IZIN MEDIS</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartDate}</label>
                      <input
                        type="date"
                        required
                        value={formData.date}
                        onChange={e => setFormData({ ...formData, date: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      />
                    </div>
                    {!selectedSchedule ? (
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">{t.formRepeat}</label>
                        <select
                          value={repeatDays}
                          onChange={e => setRepeatDays(Number(e.target.value))}
                          className="w-full bg-pink-50 border border-pink-300 text-maroon rounded-2xl px-3 py-2.5 font-black"
                        >
                          <option value={1}>{t.rep1}</option>
                          <option value={2}>{t.rep2}</option>
                          <option value={3}>{t.rep3}</option>
                          <option value={5}>{t.rep5}</option>
                          <option value={7}>{t.rep7}</option>
                        </select>
                      </div>
                    ) : (
                      <div className="flex items-end pb-2 text-[10px] text-slate-400 italic">
                        {t.modalEditTitle}
                      </div>
                    )}
                  </div>
                  
                  {/* 🔒 DROPDOWN JAM MULAI & SELESAI YANG OTOMATIS MENGUNCI JAM TERISI */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartHour}</label>
                      <select
                        required
                        value={formData.start_time}
                        onChange={e => {
                          const newStart = e.target.value;
                          let newEnd = formData.end_time;
                          if (timeToMinutes(newEnd) <= timeToMinutes(newStart)) {
                            const nextIdx = END_TIME_OPTIONS.findIndex(tm => timeToMinutes(tm) > timeToMinutes(newStart));
                            if (nextIdx !== -1) newEnd = END_TIME_OPTIONS[nextIdx];
                          }
                          setFormData({ ...formData, start_time: newStart, end_time: newEnd });
                        }}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {START_TIME_OPTIONS.map(tm => {
                          const conflict = getStartTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict ? `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})` : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formEndHour}</label>
                      <select
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {END_TIME_OPTIONS.map(tm => {
                          const conflict = getEndTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict
                                ? (conflict.isInvalidOrder ? `${tm}` : `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})`)
                                : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                  </div>

                  {/* PERINGATAN JIKA RENTANG WAKTU MASIH BENTROK */}
                  {currentFormConflict && (
                    <div className="bg-rose-100 border-2 border-rose-400 text-rose-900 p-3 rounded-2xl text-xs font-extrabold flex items-center gap-2 animate-pulse">
                      <span className="text-lg">⛔</span>
                      <div>
                        <div>{t.overlapWarningTitle}</div>
                        <div className="text-[10px] font-bold">
                          {t.overlapWarningDesc} "{currentFormConflict.title}" ({currentFormConflict.start_time} - {currentFormConflict.end_time})
                        </div>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formNotes}</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 font-medium"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 font-extrabold hover:underline">
                        {t.deleteSchBtn}
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl font-bold">
                        {t.cancelBtn}
                      </button>
                      <button
                        type="submit"
                        disabled={!!currentFormConflict}
                        className={`px-5 py-2.5 rounded-2xl font-black shadow transition ${currentFormConflict ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-maroon to-rose-700 text-white active:scale-95'}`}
                      >
                        {currentFormConflict ? '⛔ Jam Terisi' : `💖 ${t.saveCloudBtn}`}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 📲 REGISTRASI BACKGROUND SERVICE WORKER UNTUK HP
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Latar Belakang Aktif:', reg.scope))
          .catch((err) => console.error('Gagal aktivasi Service Worker:', err));
      });
    }
  </script>
</body>
</html>
