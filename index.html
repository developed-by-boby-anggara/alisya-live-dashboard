<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alisya Schedule Dashboard 🌸</title>

  <meta name="theme-color" content="#7B1113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alisya Schedule">
  
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Alisya%20Schedule%20Dashboard%22%2C%22short_name%22%3A%22Alisya%20Schedule%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFF5F7%22%2C%22theme_color%22%3A%22%237B1113%22%7D">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js & html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- 🌟 PANGGIL MODUL DATA & BAHASA -->
  <script src="./config.js"></script>
  <script src="./translations.js"></script>
  <script type="text/babel" src="./components.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            maroon: { DEFAULT: '#7B1113', dark: '#520A0B', light: '#9E1B1E' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #FFF0F3; }
    ::-webkit-scrollbar-thumb { background: #F4ACB7; border-radius: 999px; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col { position: sticky; left: 0; z-index: 20; }
    .sticky-header { position: sticky; top: 0; z-index: 30; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 76px); }

    body.cute-bg {
      background-color: #FFF5F7;
      background-image: radial-gradient(#FFD6E0 1.35px, transparent 1.35px), radial-gradient(#FFE5EC 1.35px, #FFF5F7 1.35px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    body.dark-theme {
      background-color: #0F172A !important;
      background-image: radial-gradient(#1E293B 1.25px, transparent 1.25px) !important;
      color: #F1F5F9 !important;
    }
    body.dark-theme .bg-slate-100 { background-color: transparent !important; }
    body.dark-theme .bg-white { background-color: #1E293B !important; color: #F1F5F9 !important; }
    body.dark-theme .bg-slate-50 { background-color: #0F172A !important; color: #E2E8F0 !important; }
    body.dark-theme .border-slate-200, body.dark-theme .border-slate-300, body.dark-theme .border-pink-200 { border-color: #334155 !important; }
    body.dark-theme .text-slate-900, body.dark-theme .text-slate-800, body.dark-theme .text-slate-700 { color: #F8FAFC !important; }
    body.dark-theme .text-slate-600, body.dark-theme .text-slate-500 { color: #94A3B8 !important; }
    body.dark-theme .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }
    .live-card-glow { animation: pulse-border 2s infinite; }

    @keyframes float-up-sparkle {
      0% { transform: translateY(0) scale(0.7) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-140px) scale(1.4) rotate(25deg); opacity: 0; }
    }
    .sparkle-anim { animation: float-up-sparkle 1.6s ease-out forwards; }

    @keyframes gentle-bob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(4deg); }
    }
    .cute-float { animation: gentle-bob 3s ease-in-out infinite; }
  </style>
</head>
<body class="cute-bg text-slate-800 antialiased font-sans select-none pb-safe md:pb-8 transition-colors duration-200">
  <div id="root"></div>

  <!-- 🌟 MESIN UTAMA APP YANG MEMANGGIL MODUL -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const {
      version: APP_VERSION,
      adminPin,
      firebaseConfig,
      requiredCategories: REQUIRED_CATEGORIES,
      initialSchedules: INITIAL_SCHEDULES,
      timeSlots: TIME_SLOTS,
      moodList: MOOD_LIST,
      favoriteRewards: FAVORITE_REWARDS,
      momUungPresets,
      aquaPressPresets
    } = window.ALISYA_CONFIG;

    const {
      timeToMinutes,
      formatSecondsToHMS,
      formatSecondsToMS,
      calculateDurationHours,
      addDaysToDateStr,
      playNotificationChime,
      playWaterBubbleChime,
      playMekelMeowSound
    } = window.ALISYA_UTILS;

    const TRANSLATIONS = window.ALISYA_TRANSLATIONS;

    let firebaseDb = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      firebaseDb = firebase.database();
    } catch(err) {
      console.error("Firebase init error:", err);
    }

    function App() {
      const {
        CompactGreetingStrip,
        LiveNowBanner,
        KontenChecklist,
        WellnessAndMekelWidget
      } = window.ALISYA_COMPONENTS;

      const [nowTime, setNowTime] = useState(() => new Date());
      useEffect(() => {
        const timer = setInterval(() => setNowTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const realTodayStr = useMemo(() => {
        const y = nowTime.getFullYear();
        const m = String(nowTime.getMonth() + 1).padStart(2, '0');
        const d = String(nowTime.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }, [nowTime]);

      const liveClockString = useMemo(() => {
        const hh = String(nowTime.getHours()).padStart(2, '0');
        const mm = String(nowTime.getMinutes()).padStart(2, '0');
        const ss = String(nowTime.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }, [nowTime]);

      const [lang, setLang] = useState(() => {
        const saved = localStorage.getItem('alisya_lang');
        return (saved === 'en' || saved === 'id') ? saved : 'id';
      });
      const handleSetLang = (newLang) => {
        setLang(newLang);
        localStorage.setItem('alisya_lang', newLang);
      };
      const t = TRANSLATIONS[lang] || TRANSLATIONS.id;

      const cuteGreeting = useMemo(() => {
        const hr = nowTime.getHours();
        if (hr >= 4 && hr < 11) return t.greetMorning;
        if (hr >= 11 && hr < 15) return t.greetAfternoon;
        if (hr >= 15 && hr < 18) return t.greetEvening;
        return t.greetNight;
      }, [nowTime, t]);

      const [quoteIdx, setQuoteIdx] = useState(() => Math.floor(Math.random() * 35));
      const [sparkles, setSparkles] = useState([]);
      const [wellnessOpen, setWellnessOpen] = useState(true);

      const triggerCuteSparkles = () => {
        const emojis = ['💖', '✨', '🌸', '🎀', '🌷', '👑', '🍓', '💫', '🍒', '🧁', '💧', '🐱'];
        const batch = Array.from({ length: 16 }).map((_, i) => ({
          id: Date.now() + '_' + i,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          left: Math.floor(Math.random() * 86) + 7,
          top: Math.floor(Math.random() * 55) + 25
        }));
        setSparkles(batch);
        setTimeout(() => setSparkles([]), 1650);
      };

      const handleBoostMood = () => {
        setQuoteIdx(prev => (prev + 1) % t.affirmations.length);
        triggerCuteSparkles();
        playNotificationChime();
      };

      const [dailyWellness, setDailyWellness] = useState(() => {
        try {
          const saved = localStorage.getItem('alisya_wellness');
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }
      });

      const [selectedDate, setSelectedDate] = useState(realTodayStr);
      const prevRealTodayRef = useRef(realTodayStr);

      useEffect(() => {
        if (prevRealTodayRef.current !== realTodayStr) {
          prevRealTodayRef.current = realTodayStr;
          setSelectedDate(realTodayStr);
          setCustomStatDate(realTodayStr);
          triggerCuteSparkles();
          notify(`🌅 Selamat Hari Baru (${realTodayStr})! Target minum air, makan Mekel & ceklis harian otomatis di-reset! 🌸`);
        }
      }, [realTodayStr]);

      const currentDayWellness = useMemo(() => {
        const raw = dailyWellness[selectedDate] || {};
        return {
          mood: raw.mood || 'happy',
          water: typeof raw.water === 'number' ? raw.water : 0,
          waterLogs: Array.isArray(raw.waterLogs) ? raw.waterLogs : [],
          mekelFood: typeof raw.mekelFood === 'number' ? raw.mekelFood : 0,
          mekelFoodLogs: Array.isArray(raw.mekelFoodLogs) ? raw.mekelFoodLogs : [],
          mekelWater: typeof raw.mekelWater === 'number' ? raw.mekelWater : 0,
          mekelWaterLogs: Array.isArray(raw.mekelWaterLogs) ? raw.mekelWaterLogs : [],
          prep: raw.prep || { makeup: false, bath: false, perfume: false, battery: false },
          reward: raw.reward || '',
          diary: raw.diary || '',
          petHearts: typeof raw.petHearts === 'number' ? raw.petHearts : 0
        };
      }, [dailyWellness, selectedDate]);

      const updateDayWellness = (patch, withSparkles = true) => {
        const prevData = dailyWellness[selectedDate] || {};
        const updated = {
          ...dailyWellness,
          [selectedDate]: { ...prevData, ...patch }
        };
        setDailyWellness(updated);
        localStorage.setItem('alisya_wellness', JSON.stringify(updated));
        if (firebaseDb) firebaseDb.ref('alisya_wellness').set(updated);
        if (withSparkles) triggerCuteSparkles();
      };

      const [waterReminderInterval, setWaterReminderInterval] = useState(() => {
        const saved = localStorage.getItem('alisya_water_interval');
        return saved !== null ? Number(saved) : 60;
      });
      const [waterSecondsLeft, setWaterSecondsLeft] = useState(() => 60 * 60);
      const [waterPopupOpen, setWaterPopupOpen] = useState(false);

      const handleChangeWaterInterval = (mins) => {
        const m = Number(mins);
        setWaterReminderInterval(m);
        localStorage.setItem('alisya_water_interval', String(m));
        if (m > 0) {
          setWaterSecondsLeft(m * 60);
          playWaterBubbleChime();
          notify(`💧 Pengingat minum air putih aktif setiap ${m} menit!`);
        } else {
          notify('🔕 Pengingat minum air putih dimatikan.');
        }
      };

      useEffect(() => {
        if (waterReminderInterval <= 0) return;
        setWaterSecondsLeft(prev => {
          if (prev <= 1) {
            setWaterPopupOpen(true);
            playWaterBubbleChime();
            return waterReminderInterval * 60;
          }
          return prev - 1;
        });
      }, [nowTime, waterReminderInterval]);

      const handleDrinkWaterGlass = (targetGlassCount = null) => {
        const hh = String(nowTime.getHours()).padStart(2, '0');
        const mm = String(nowTime.getMinutes()).padStart(2, '0');
        const timeNowStr = `${hh}:${mm}`;
        const currentCount = currentDayWellness.water || 0;
        const currentLogs = Array.isArray(currentDayWellness.waterLogs) ? [...currentDayWellness.waterLogs] : [];
        let nextCount = targetGlassCount !== null ? targetGlassCount : currentCount + 1;
        if (nextCount < 0) nextCount = 0;

        let nextLogs = [...currentLogs];
        if (nextCount > currentCount) {
          for (let i = 0; i < (nextCount - currentCount); i++) nextLogs.push(timeNowStr);
          playWaterBubbleChime();
          notify(`💧 Gelas ke-${nextCount} (${nextCount * 250} ml) tercatat pukul ${timeNowStr} WIB! 🌸`);
        } else {
          nextLogs = nextLogs.slice(0, nextCount);
        }
        if (waterReminderInterval > 0) setWaterSecondsLeft(waterReminderInterval * 60);
        setWaterPopupOpen(false);
        updateDayWellness({ water: nextCount, waterLogs: nextLogs, petHearts: (currentDayWellness.petHearts || 0) + 1 });
      };

      const handleResetWaterToday = () => {
        updateDayWellness({ water: 0, waterLogs: [] });
        notify('💧 Catatan minum air hari ini direset.');
      };

      const handleFeedMekelFood = (targetCount = null) => {
        const timeNowStr = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;
        const curr = currentDayWellness.mekelFood || 0;
        const logs = Array.isArray(currentDayWellness.mekelFoodLogs) ? [...currentDayWellness.mekelFoodLogs] : [];
        let next = targetCount !== null ? targetCount : (curr >= 3 ? 0 : curr + 1);
        let nextLogs = [...logs];
        if (next > curr) {
          for (let i = 0; i < (next - curr); i++) nextLogs.push(timeNowStr);
          playMekelMeowSound();
          notify(`🐟 Mekel makan ke-${next} tercatat pukul ${timeNowStr} WIB! 😻`);
        } else nextLogs = nextLogs.slice(0, next);
        updateDayWellness({ mekelFood: next, mekelFoodLogs: nextLogs, petHearts: (currentDayWellness.petHearts || 0) + 2 });
      };

      const handleGiveMekelWater = (targetCount = null) => {
        const timeNowStr = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;
        const curr = currentDayWellness.mekelWater || 0;
        const logs = Array.isArray(currentDayWellness.mekelWaterLogs) ? [...currentDayWellness.mekelWaterLogs] : [];
        let next = targetCount !== null ? targetCount : (curr >= 3 ? 0 : curr + 1);
        let nextLogs = [...logs];
        if (next > curr) {
          for (let i = 0; i < (next - curr); i++) nextLogs.push(timeNowStr);
          playWaterBubbleChime();
          notify(`🥛 Mekel minum ke-${next} tercatat pukul ${timeNowStr} WIB! 🐱💧`);
        } else nextLogs = nextLogs.slice(0, next);
        updateDayWellness({ mekelWater: next, mekelWaterLogs: nextLogs, petHearts: (currentDayWellness.petHearts || 0) + 2 });
      };

      const handleSpinSelfReward = () => {
        const item = FAVORITE_REWARDS[Math.floor(Math.random() * FAVORITE_REWARDS.length)];
        const text = `${item.emoji} ${lang === 'id' ? item.labelId : item.labelEn}`;
        updateDayWellness({ reward: text });
        playNotificationChime();
        notify(`🎁 Self-Reward: ${text}`);
      };

      const handleSelectSpecificReward = (item) => {
        const text = `${item.emoji} ${lang === 'id' ? item.labelId : item.labelEn}`;
        updateDayWellness({ reward: text });
        playNotificationChime();
        notify(`😋 Self-Reward dipilih: ${text}`);
      };

      const getHariNama = (dateString) => {
        if (!dateString) return '-';
        const [y, m, d] = dateString.split('-').map(Number);
        return new Intl.DateTimeFormat(t.locale, { weekday: 'long' }).format(new Date(y, m - 1, d));
      };

      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('alisya_dark_mode') === 'true');
      useEffect(() => {
        if (darkMode) document.body.classList.add('dark-theme');
        else document.body.classList.remove('dark-theme');
        localStorage.setItem('alisya_dark_mode', darkMode);
      }, [darkMode]);

      const [soundAlert, setSoundAlert] = useState(() => localStorage.getItem('alisya_sound_alert') !== 'false');
      const notifiedIdsRef = useRef(new Set());
      const toggleSoundAlert = () => {
        const nextVal = !soundAlert;
        setSoundAlert(nextVal);
        localStorage.setItem('alisya_sound_alert', nextVal);
        if (nextVal) { playNotificationChime(); notify('🔔 Pengingat Suara Aktif'); }
        else notify('🔕 Pengingat Suara Dinonaktifkan');
      };

      const [displayMode, setDisplayMode] = useState(() => {
        const saved = localStorage.getItem('alisya_display_mode');
        return saved || (window.innerWidth < 768 ? 'mobile' : 'pc');
      });
      const handleSetDisplayMode = (mode) => {
        setDisplayMode(mode);
        localStorage.setItem('alisya_display_mode', mode);
      };

      const [activeTab, setActiveTab] = useState('agenda');
      const [pcSubTab, setPcSubTab] = useState('agenda');
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [brands, setBrands] = useState(REQUIRED_CATEGORIES);
      const [stickyNote, setStickyNote] = useState("Target Minggu Ini: Push GMV Live Mom Uung & AquaPress, Rajin Minum Air Putih & Sayang Mekel Terus! 🌸🐱✨");

      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInputModal, setPinInputModal] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState(false);

      const [currentYear, setCurrentYear] = useState(() => new Date().getFullYear());
      const [currentMonth, setCurrentMonth] = useState(() => new Date().getMonth());
      const [statPeriod, setStatPeriod] = useState('daily');
      const [customStatDate, setCustomStatDate] = useState(realTodayStr);
      const [customStatMonth, setCustomStatMonth] = useState(() => new Date().getMonth());
      const [customStatYear, setCustomStatYear] = useState(() => new Date().getFullYear());

      const [searchQuery, setSearchQuery] = useState('');
      const [filterBrand, setFilterBrand] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterDate, setFilterDate] = useState('');
      const [filterHour, setFilterHour] = useState('ALL');
      const [repeatDays, setRepeatDays] = useState(1);
      const [cloneModalOpen, setCloneModalOpen] = useState(false);
      const [cloneTargetDate, setCloneTargetDate] = useState(() => addDaysToDateStr(realTodayStr, 1));

      useEffect(() => {
        if (selectedDate) {
          const [y, m] = selectedDate.split('-').map(Number);
          if (y && m) { setCurrentYear(y); setCurrentMonth(m - 1); }
        }
      }, [selectedDate]);

      useEffect(() => {
        if (!firebaseDb) return;
        const refSch = firebaseDb.ref('alisya_schedules');
        refSch.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) setSchedules(val);
          else refSch.set(INITIAL_SCHEDULES);
        });

        const refBrands = firebaseDb.ref('alisya_brands');
        refBrands.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) setBrands(val);
          else refBrands.set(REQUIRED_CATEGORIES);
        });

        const refNote = firebaseDb.ref('alisya_sticky_note');
        refNote.on('value', snap => { if (snap.val()) setStickyNote(snap.val()); });

        const refWell = firebaseDb.ref('alisya_wellness');
        refWell.on('value', snap => {
          const val = snap.val();
          if (val && typeof val === 'object') {
            setDailyWellness(val);
            localStorage.setItem('alisya_wellness', JSON.stringify(val));
          }
        });

        return () => { refSch.off(); refBrands.off(); refNote.off(); refWell.off(); };
      }, []);

      const saveSchedulesToCloud = (newList) => {
        setSchedules(newList);
        if (firebaseDb) firebaseDb.ref('alisya_schedules').set(newList);
      };

      const saveBrandsToCloud = (newBrands) => {
        setBrands(newBrands);
        if (firebaseDb) firebaseDb.ref('alisya_brands').set(newBrands);
      };

      const handleEditStickyNote = () => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const nextText = prompt("📌 Masukkan Catatan Fokus Baru:", stickyNote);
        if (nextText !== null && nextText.trim() !== "") {
          setStickyNote(nextText.trim());
          if (firebaseDb) firebaseDb.ref('alisya_sticky_note').set(nextText.trim());
          notify('📌 Catatan Fokus diperbarui!');
        }
      };

      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSchedule, setSelectedSchedule] = useState(null);
      const [formData, setFormData] = useState({
        id: '', date: realTodayStr, start_time: '10:00', end_time: '12:00',
        title: '', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: '',
        checklist: { shoot: false, edit: false, upload: false }
      });

      const [toast, setToast] = useState('');
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3800); };

      const daysInMonth = useMemo(() => new Date(currentYear, currentMonth + 1, 0).getDate(), [currentYear, currentMonth]);
      const monthName = useMemo(() => new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(currentYear, currentMonth, 1)), [currentYear, currentMonth, t.locale]);

      // Anti-Overlap Logic
      const existingSchedulesOnFormDate = useMemo(() => {
        return schedules
          .filter(s => s.date === formData.date && (!selectedSchedule || s.id !== selectedSchedule.id))
          .sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, formData.date, selectedSchedule]);

      const getStartTimeConflict = (timeCandidate) => {
        const candMin = timeToMinutes(timeCandidate);
        return existingSchedulesOnFormDate.find(s => {
          const sStart = timeToMinutes(s.start_time);
          let sEnd = timeToMinutes(s.end_time);
          if (sEnd <= sStart) sEnd = 24 * 60;
          return candMin >= sStart && candMin < sEnd;
        });
      };

      const getEndTimeConflict = (endCandidate) => {
        const startMin = timeToMinutes(formData.start_time);
        let endMin = timeToMinutes(endCandidate);
        if (endMin <= startMin) return { title: '≤ ' + formData.start_time, isInvalidOrder: true };
        return existingSchedulesOnFormDate.find(s => {
          const sStart = timeToMinutes(s.start_time);
          let sEnd = timeToMinutes(s.end_time);
          if (sEnd <= sStart) sEnd = 24 * 60;
          return startMin < sEnd && endMin > sStart;
        });
      };

      const getRangeConflictOnFormDate = (startStr, endStr) => {
        const sMin = timeToMinutes(startStr);
        let eMin = timeToMinutes(endStr);
        if (eMin <= sMin) eMin = 24 * 60;
        return existingSchedulesOnFormDate.find(s => {
          const exStart = timeToMinutes(s.start_time);
          let exEnd = timeToMinutes(s.end_time);
          if (exEnd <= exStart) exEnd = 24 * 60;
          return sMin < exEnd && eMin > exStart;
        });
      };

      const currentFormConflict = useMemo(() => {
        return getRangeConflictOnFormDate(formData.start_time, formData.end_time);
      }, [formData.start_time, formData.end_time, existingSchedulesOnFormDate]);

      const findFirstFreeSlotOnDate = (dateStr, preferredStart = '10:00', preferredEnd = '12:00') => {
        const dayList = schedules.filter(s => s.date === dateStr);
        const isFree = (st, en) => {
          const sM = timeToMinutes(st);
          const eM = timeToMinutes(en);
          return !dayList.some(item => {
            const iS = timeToMinutes(item.start_time);
            let iE = timeToMinutes(item.end_time);
            if (iE <= iS) iE = 24 * 60;
            return sM < iE && eM > iS;
          });
        };
        if (isFree(preferredStart, preferredEnd)) return { start: preferredStart, end: preferredEnd };
        for (const slot of TIME_SLOTS) {
          if (isFree(slot.start, slot.end)) return { start: slot.start, end: slot.end };
        }
        return { start: preferredStart, end: preferredEnd };
      };

      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowTotalSeconds = nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();
        const toSec = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 3600;
          const [h, m] = tStr.split(':').map(Number);
          return h * 3600 + m * 60;
        };

        let activeItem = null;
        let nextItem = null;
        let completedCount = 0;

        todayList.forEach(item => {
          const sSec = toSec(item.start_time);
          let eSec = toSec(item.end_time);
          if (eSec <= sSec) eSec = 24 * 3600;

          if (nowTotalSeconds >= sSec && nowTotalSeconds < eSec) {
            const remSec = eSec - nowTotalSeconds;
            const totalDurSec = Math.max(1, eSec - sSec);
            const elapsedSec = nowTotalSeconds - sSec;
            const sessionPct = Math.min(100, Math.max(0, ((elapsedSec / totalDurSec) * 100).toFixed(1)));
            activeItem = { ...item, remainingSec: remSec, remainingHMS: formatSecondsToHMS(remSec), remainingMin: Math.ceil(remSec / 60), sessionPct };
          } else if (nowTotalSeconds >= eSec) {
            completedCount++;
          } else if (nowTotalSeconds < sSec && !nextItem) {
            const diffSec = sSec - nowTotalSeconds;
            nextItem = { ...item, startsInSec: diffSec, startsInHMS: formatSecondsToHMS(diffSec), startsInMin: Math.ceil(diffSec / 60) };
          }
        });

        const activeFraction = activeItem ? Number(activeItem.sessionPct) / 100 : 0;
        const progressPct = todayList.length > 0 ? Math.min(100, Math.round(((completedCount + activeFraction) / todayList.length) * 100)) : 0;
        return { activeItem, nextItem, progressPct, totalToday: todayList.length, completedCount };
      }, [schedules, realTodayStr, nowTime]);

      const getSessionTimeState = (item) => {
        if (item.date < realTodayStr) return 'done';
        if (item.date > realTodayStr) return 'upcoming';
        const nowMin = nowTime.getHours() * 60 + nowTime.getMinutes();
        const sMin = timeToMinutes(item.start_time);
        let eMin = timeToMinutes(item.end_time);
        if (eMin <= sMin) eMin = 24 * 60;
        if (nowMin >= eMin) return 'done';
        if (nowMin >= sMin && nowMin < eMin) return 'live';
        return 'upcoming';
      };

      const shortBreakWarnings = useMemo(() => {
        const map = {};
        const grouped = {};
        schedules.forEach(s => {
          if (s.status === 'Tidur' || s.brand_id === 'b_sleep' || s.status === 'OFF') return;
          if (!grouped[s.date]) grouped[s.date] = [];
          grouped[s.date].push(s);
        });
        Object.keys(grouped).forEach(date => {
          const list = grouped[date].sort((a, b) => a.start_time.localeCompare(b.start_time));
          for (let i = 0; i < list.length - 1; i++) {
            const diffMin = timeToMinutes(list[i+1].start_time) - timeToMinutes(list[i].end_time);
            if (diffMin > 0 && diffMin < 300) { map[date] = true; break; }
          }
        });
        return map;
      }, [schedules]);

      const selectedDaySchedules = useMemo(() => {
        return schedules.filter(s => s.date === selectedDate).sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, selectedDate]);

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {
          const sM = timeToMinutes(slot.start);
          const eM = timeToMinutes(slot.end);
          return !selectedDaySchedules.some(s => {
            const st = timeToMinutes(s.start_time);
            let en = timeToMinutes(s.end_time);
            if (en <= st) en = 24 * 60;
            return st < eM && en > sM;
          });
        });
      }, [selectedDaySchedules]);

      const getDayScheduleDensity = (dateStr) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };
        if (dayShifts.some(s => s.status === 'OFF')) return { text: t.statusOff, badge: 'bg-rose-100 text-rose-800 border-rose-300' };

        let productiveHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') productiveHours += calculateDurationHours(s.start_time, s.end_time);
        });
        if (productiveHours >= 10) return { text: t.statusFull, badge: 'bg-rose-500 text-white font-black shadow-sm' };
        if (productiveHours >= 8) return { text: t.statusMed, badge: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' };
        if (productiveHours > 0) return { text: t.statusLow, badge: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold' };
        return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };
      };

      const filteredByStatPeriod = useMemo(() => {
        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);
          if (statPeriod === 'daily') return s.date === customStatDate;
          if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - refDate.getDay());
            startOfWeek.setHours(0,0,0,0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);
            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          }
          if (statPeriod === 'monthly') return sY === customStatYear && sM === (customStatMonth + 1);
          if (statPeriod === 'yearly') return sY === customStatYear;
          return true;
        });
      }, [schedules, statPeriod, customStatDate, customStatMonth, customStatYear]);

      const stats = useMemo(() => {
        let totalLive = 0, totalOff = 0, totalSick = 0, totalMeeting = 0, totalSleep = 0, totalMeTime = 0, totalKonten = 0;
        let totalLiveHours = 0, totalSleepHours = 0, totalKontenHours = 0, totalMeTimeHours = 0;

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);
          if (s.status === 'LIVE') { totalLive++; totalLiveHours += dur; }
          else if (s.status === 'OFF') totalOff++;
          else if (s.status === 'Sakit / Medis') totalSick++;
          else if (s.status === 'Meeting') totalMeeting++;
          else if (s.status === 'Tidur') { totalSleep++; totalSleepHours += (dur || 7); }
          else if (s.status === 'Konten' || s.brand_id === 'b_konten') { totalKonten++; totalKontenHours += dur; }
          else if (s.status === 'Me Time' || s.brand_id === 'b_lainlain') { totalMeTime++; totalMeTimeHours += dur; }
        });

        totalLiveHours = Math.round(totalLiveHours * 10) / 10;
        totalSleepHours = Math.round(totalSleepHours * 10) / 10;
        totalKontenHours = Math.round(totalKontenHours * 10) / 10;

        const perBrand = brands.map(b => {
          const list = filteredByStatPeriod.filter(s => s.brand_id === b.id);
          return { name: b.name, emoji: b.emoji, totalShift: list.length, color: b.color };
        });

        return { totalLive, totalOff, totalSick, totalMeeting, totalSleep, totalMeTime, totalKonten, totalLiveHours, totalSleepHours, totalKontenHours, totalMeTimeHours, perBrand };
      }, [filteredByStatPeriod, brands]);

      const balanceScoreData = useMemo(() => {
        const prodHours = stats.totalLiveHours + stats.totalKontenHours;
        if (statPeriod === 'daily' && prodHours >= 11) return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        if (prodHours > 85) return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        if (stats.totalSleepHours === 0 && prodHours > 8) return { text: t.scoreWarning, color: 'text-amber-800 bg-amber-50 border-amber-200' };
        return { text: t.scoreBalanced, color: 'text-emerald-800 bg-emerald-50 border-emerald-200' };
      }, [stats, statPeriod, t]);

      const periodLabel = useMemo(() => {
        if (statPeriod === 'daily') return `${getHariNama(customStatDate)}, ${customStatDate}`;
        if (statPeriod === 'monthly') return `${new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(customStatYear, customStatMonth, 1))} ${customStatYear}`;
        if (statPeriod === 'yearly') return `${t.yearLabel} ${customStatYear}`;
        return customStatDate;
      }, [statPeriod, customStatDate, customStatMonth, customStatYear, t]);

      const filteredSchedules = useMemo(() => {
        return schedules.filter(s => {
          if (filterBrand !== 'ALL' && s.brand_id !== filterBrand) return false;
          if (filterStatus !== 'ALL' && s.status !== filterStatus) return false;
          if (filterDate && s.date !== filterDate) return false;
          if (filterHour !== 'ALL' && parseInt(s.start_time.split(':')[0], 10) !== parseInt(filterHour, 10)) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!s.title.toLowerCase().includes(q) && !(s.notes || '').toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [schedules, filterBrand, filterStatus, filterDate, filterHour, searchQuery]);

      const handleResetFilter = () => {
        setSearchQuery(''); setFilterBrand('ALL'); setFilterStatus('ALL'); setFilterDate(''); setFilterHour('ALL');
      };

      const donutCanvas = useRef(null);
      const barCanvas = useRef(null);
      const donutInst = useRef(null);
      const barInst = useRef(null);

      useEffect(() => {

        if (!shouldRenderCharts) return;

          if (donutInst.current) donutInst.current.destroy();
          donutInst.current = new Chart(donutCanvas.current, {
            type: 'doughnut',
            data: {
              labels: ['🟢 LIVE', '🎬 Konten', '😴 Sleep', '💅 Me Time', '☕ OFF', '💬 Meeting'],
              datasets: [{ data: [stats.totalLive, stats.totalKonten, stats.totalSleep, stats.totalMeTime, stats.totalOff, stats.totalMeeting], backgroundColor: ['#B6D7A8', '#8B5CF6', '#6366F1', '#EC4899', '#EF4444', '#00FFFF'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
          });
        }
        if (barCanvas.current) {
          if (barInst.current) barInst.current.destroy();
          barInst.current = new Chart(barCanvas.current, {
            type: 'bar',
            data: {
              labels: stats.perBrand.map(b => b.name),
              datasets: [{ label: '🟢 Shift / Session', data: stats.perBrand.map(b => b.totalShift), backgroundColor: '#B6D7A8' }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
          });
        }
      }, [displayMode, activeTab, pcSubTab, stats]);

      const handleToggleChecklist = (e, itemId, stepKey) => {
        e.stopPropagation();
        if (!isAdmin) { setPinInputModal(true); return; }
        const updated = schedules.map(s => {
          if (s.id === itemId) {

            return { ...s, checklist: { ...currentCheck, [stepKey]: !currentCheck[stepKey] } };
          }
          return s;
        });
        saveSchedulesToCloud(updated);
        triggerCuteSparkles();
      };

      const handleCloneFullDay = (e) => {
        e.preventDefault();
        if (!isAdmin) { setPinInputModal(true); return; }
        const existingOnTarget = schedules.filter(s => s.date === cloneTargetDate);
        const nonConflicting = selectedDaySchedules.filter(item => {
          const sM = timeToMinutes(item.start_time);
          let eM = timeToMinutes(item.end_time);
          if (eM <= sM) eM = 24 * 60;
          return !existingOnTarget.some(ex => {
            const exS = timeToMinutes(ex.start_time);
            let exE = timeToMinutes(ex.end_time);
            if (exE <= exS) exE = 24 * 60;
            return sM < exE && eM > exS;
          });
        });
        if (nonConflicting.length === 0) {
          notify('⛔ Semua jam di tanggal tujuan sudah terisi!');
          return;
        }
        const clonedList = nonConflicting.map((item, idx) => ({ ...item, id: 'sch_' + Date.now() + '_clone_' + idx, date: cloneTargetDate }));
        saveSchedulesToCloud([...schedules, ...clonedList]);
        setCloneModalOpen(false);
        setSelectedDate(cloneTargetDate);
        triggerCuteSparkles();
        notify(`🎀 ${clonedList.length} sesi berhasil disalin ke ${cloneTargetDate}!`);
      };

      const exportElementAsPNG = async (elementId, filenameLabel) => {
        const el = document.getElementById(elementId);
        if (!el || typeof html2canvas === 'undefined') return;
        notify('📸 Sedang memproses gambar...');
        try {
          const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: darkMode ? '#0F172A' : '#FFF5F7' });
          const link = document.createElement('a');
          link.download = `Alisya_Schedule_${filenameLabel}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          notify('✨ Gambar (.PNG) berhasil diunduh!');
        } catch (err) {}
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (enteredPin === adminPin) {
          setIsAdmin(true); setPinInputModal(false); setEnteredPin(''); setPinError(false);
          triggerCuteSparkles(); notify('🔓 Admin Access Unlocked! 🌸');
        } else setPinError(true);
      };

      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const targetDate = dateStr || selectedDate;
        const smartSlot = findFirstFreeSlotOnDate(targetDate, slotStart, slotEnd);
        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({
          id: 'sch_' + Date.now(), date: targetDate, start_time: smartSlot.start, end_time: smartSlot.end,
          title: '', brand_id: brands[0]?.id || 'b_momuung', status: 'LIVE', color: brands[0]?.color || '#B6D7A8', notes: '',
          checklist: { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);
      };

      const handleOpenEdit = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        setSelectedSchedule(sch);
        setRepeatDays(1);
        setFormData({ ...sch, checklist: sch.checklist || { shoot: false, edit: false, upload: false } });
        setModalOpen(true);
      };

      const handleDuplicate = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const freeSlot = findFirstFreeSlotOnDate(sch.date, sch.start_time, sch.end_time);
        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({ ...sch, id: 'sch_' + Date.now(), title: sch.title + ' (Copy)', start_time: freeSlot.start, end_time: freeSlot.end });
        setModalOpen(true);
      };

      const applyMomUungPreset = (shiftNum, start, end) => {
        const conflict = getRangeConflictOnFormDate(start, end);
        if (conflict) return;
        const momUungBrand = brands.find(b => b.id === 'b_momuung') || { color: '#B6D7A8' };
        setFormData(prev => ({ ...prev, title: `Shift ${shiftNum} Mom Uung`, brand_id: 'b_momuung', status: 'LIVE', color: momUungBrand.color, start_time: start, end_time: end }));
      };

      const applyAquaPressPreset = (shiftNum, start, end) => {
        const conflict = getRangeConflictOnFormDate(start, end);
        if (conflict) return;
        const aquaBrand = brands.find(b => b.id === 'b_aquapress') || { color: '#00FFFF' };
        setFormData(prev => ({ ...prev, title: `Shift ${shiftNum} AquaPress`, brand_id: 'b_aquapress', status: 'LIVE', color: aquaBrand.color, start_time: start, end_time: end }));
      };

      const handleSave = (e) => {
        e.preventDefault();
        const sMin = timeToMinutes(formData.start_time);
        const eMin = timeToMinutes(formData.end_time);
        if (eMin <= sMin || currentFormConflict) return;

        const brandObj = brands.find(b => b.id === formData.brand_id);
        const basePayload = { ...formData, color: brandObj?.color || formData.color };

        if (selectedSchedule) {
          saveSchedulesToCloud(schedules.map(s => s.id === selectedSchedule.id ? basePayload : s));
        } else {
          const newItems = [];
          const count = Number(repeatDays) || 1;
          for (let i = 0; i < count; i++) {
            const targetDate = i === 0 ? basePayload.date : addDaysToDateStr(basePayload.date, i);
            const daySchedules = schedules.filter(s => s.date === targetDate);
            const hasConflict = daySchedules.some(ex => {
              const exS = timeToMinutes(ex.start_time);
              let exE = timeToMinutes(ex.end_time);
              if (exE <= exS) exE = 24 * 60;
              return sMin < exE && eMin > exS;
            });
            if (!hasConflict) newItems.push({ ...basePayload, id: 'sch_' + Date.now() + '_' + i, date: targetDate });
          }
          if (newItems.length === 0) return;
          saveSchedulesToCloud([...schedules, ...newItems]);
        }
        triggerCuteSparkles();
        setModalOpen(false);
        notify('💖 Jadwal berhasil disimpan!');
      };

      const handleDelete = (id) => {
        if (confirm('Hapus jadwal ini?')) {
          saveSchedulesToCloud(schedules.filter(s => s.id !== id));
          setModalOpen(false);
          notify('🗑️ Dihapus.');
        }
      };

      const exportCSV = () => {
        const headers = [t.colDay, t.colDate, t.formStartHour, t.formEndHour, t.colTitle, t.colCategory, t.colStatus, t.colNotes];
        const rows = schedules.map(s => [
          `"${getHariNama(s.date)}"`, s.date, s.start_time, s.end_time,
          `"${s.title}"`, `"${brands.find(b => b.id === s.brand_id)?.name || s.brand_id}"`, `"${s.status}"`, `"${s.notes || ''}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `Alisya_Schedule_${currentYear}_${currentMonth+1}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const shareToWhatsApp = () => {
        const todayItems = schedules.filter(s => s.date === selectedDate).sort((a,b) => a.start_time.localeCompare(b.start_time));
        let text = `🌸 *${t.radarTitle}* 🌸\n🗓️ ${getHariNama(selectedDate)}, ${selectedDate}\n\n`;
        if (todayItems.length === 0) text += `☕ ${t.noSchedule}\n`;
        else todayItems.forEach((s, idx) => { text += `${idx + 1}. *${s.start_time} - ${s.end_time}* : ${s.title} [${s.status}]\n`; });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const jumpToOffset = (days) => {
        const d = new Date();
        d.setDate(d.getDate() + days);
        setSelectedDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
        setCurrentMonth(d.getMonth());
        setCurrentYear(d.getFullYear());
      };

      const wellnessProps = {
        t, lang, selectedDate, wellnessOpen, setWellnessOpen, currentDayWellness, updateDayWellness,
        handleDrinkWaterGlass, handleResetWaterToday, waterReminderInterval, handleChangeWaterInterval,
        waterSecondsLeft, handleFeedMekelFood, handleGiveMekelWater, handleSpinSelfReward, handleSelectSpecificReward, notify
      };

      return (
        <div className="min-h-screen flex flex-col relative">
          <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
            {sparkles.map(sp => (
              <div key={sp.id} style={{ left: `${sp.left}%`, top: `${sp.top}%` }} className="absolute text-2xl md:text-3xl sparkle-anim select-none">
                {sp.emoji}
              </div>
            ))}
          </div>

          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-maroon/95 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-bold animate-bounce border-2 border-pink-300">
              <span>🌸</span><span>{toast}</span>
            </div>
          )}

          {/*HEADER UTAMA*/}
          <header className="bg-gradient-to-r from-maroon via-[#8B1538] to-maroon text-white px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg sticky top-0 z-40 border-b-2 border-pink-300/30">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-pink-200/20 flex items-center justify-center font-black text-rose-200 text-xl border border-pink-200/40 shadow-inner cute-float">
                🎀
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="font-extrabold text-base tracking-wide">Alisya Schedule 🌸</h1>
                <span className="bg-pink-400/25 text-pink-100 border border-pink-300/40 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold">
                  {APP_VERSION}
                </span>
                <span className="flex items-center gap-1 text-[10px] bg-black/30 text-emerald-300 border border-emerald-400/30 px-2.5 py-0.5 rounded-full font-mono font-bold">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>{liveClockString} WIB</span>
                </span>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex items-center bg-black/30 px-2.5 py-1.5 rounded-2xl border border-white/15">
                <span className="text-xs mr-1.5">🌐</span>
                <select value={lang} onChange={(e) => handleSetLang(e.target.value)} className="bg-transparent text-white font-extrabold text-xs focus:outline-none cursor-pointer">
                  <option value="id" className="bg-slate-900 text-white">🇮🇩 Indonesia</option>
                  <option value="en" className="bg-slate-900 text-white">🇬🇧 English</option>
                </select>
              </div>
              <button onClick={() => setDarkMode(!darkMode)} className="px-3 py-1.5 rounded-2xl text-xs font-black border bg-black/30 text-rose-100 border-white/15">

              </button>

                {soundAlert ? '🔔' : '🔕'}
              </button>
              <div className="flex items-center bg-black/30 p-1 rounded-2xl border border-white/15">
                <button onClick={() => handleSetDisplayMode('mobile')} className={`px-3 py-1.5 rounded-xl text-xs font-black ${displayMode === 'mobile' ? 'bg-pink-100 text-maroon' : 'text-rose-100'}`}>📱 {t.modeHP}</button>
                <button onClick={() => handleSetDisplayMode('pc')} className={`px-3 py-1.5 rounded-xl text-xs font-black ${displayMode === 'pc' ? 'bg-pink-100 text-maroon' : 'text-rose-100'}`}>💻 {t.modePC}</button>
              </div>
              {isAdmin ? (
                <button onClick={() => setIsAdmin(false)} className="bg-rose-950 text-rose-200 px-3 py-1.5 rounded-xl text-xs font-bold">🔒 {t.lockBtn}</button>
              ) : (
                <button onClick={() => setPinInputModal(true)} className="bg-pink-400/30 border border-pink-200/40 text-white px-3 py-1.5 rounded-xl text-xs font-bold">🔑 {t.loginBtn}</button>
              )}
            </div>
          </header>

          {/* KONTEN UTAMA */}
          <div className="p-4 md:p-6 max-w-[1400px] w-full mx-auto space-y-5">
            {/* 1. RADAR JADWAL LIVE & LOMPAT HARI (PRIORITAS #1 DI ATAS) */}
            <div className="bg-gradient-to-r from-maroon via-[#8A1432] to-rose-900 text-white rounded-3xl p-5 shadow-lg space-y-3 border-2 border-pink-300/30">
              <CompactGreetingStrip
                cuteGreeting={cuteGreeting}
                quoteText={t.affirmations[quoteIdx % t.affirmations.length]}
                onBoostMood={handleBoostMood}
                cheerBtnLabel={t.cheerMeBtn}
              />
              <div className="flex flex-wrap items-center justify-between gap-4 pt-1">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span className="text-xs font-extrabold uppercase tracking-widest text-pink-200">{t.radarTitle}</span>
                    <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${getDayScheduleDensity(selectedDate).badge}`}>
                      {getDayScheduleDensity(selectedDate).text}
                    </span>
                  </div>
                  <h2 className="text-xl md:text-2xl font-black mt-1">
                    {getHariNama(selectedDate)}, {selectedDate} {MOOD_LIST.find(m => m.id === currentDayWellness.mood)?.emoji || '🌸'}
                  </h2>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
                  <div className="flex items-center gap-1.5 bg-black/20 p-1.5 rounded-2xl border border-white/10">
                    <span className="text-xs text-rose-200 font-bold px-2">{t.jump}</span>
                    <button onClick={() => jumpToOffset(0)} className="bg-white/20 hover:bg-white/30 text-white text-xs font-black px-3 py-1 rounded-xl">{t.today}</button>
                    <button onClick={() => jumpToOffset(1)} className="bg-white/20 hover:bg-white/30 text-white text-xs font-black px-3 py-1 rounded-xl">{t.tomorrow}</button>
                    <button onClick={() => jumpToOffset(2)} className="bg-white/20 hover:bg-white/30 text-white text-xs font-black px-3 py-1 rounded-xl">{t.dayAfter}</button>
                  </div>
                  <button onClick={shareToWhatsApp} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-2xl font-black text-xs shadow">📲 {t.btnShareWA}</button>
                  {isAdmin && (
                    <button onClick={() => handleOpenCreate(selectedDate)} className="bg-pink-100 text-maroon px-4 py-2 rounded-2xl font-black text-xs shadow">{t.btnAddSession}</button>
                  )}
                </div>
              </div>
              <LiveNowBanner t={t} liveTracker={liveTracker} realTodayStr={realTodayStr} />
            </div>

            {/* 2. SLOT JAM KOSONG + KALENDER TANGGAL + DAFTAR JADWAL */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div className="lg:col-span-5 space-y-4">
                <div className="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-4 space-y-2.5 shadow-xs">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black text-emerald-950">🟢 {t.availableTitle}</span>
                    <span className="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded-full">{availableSlotsForSelectedDate.length} {t.slotsReady}</span>
                  </div>
                  <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                    {availableSlotsForSelectedDate.map(slot => (
                      <button key={slot.label} onClick={() => handleOpenCreate(selectedDate, slot.start, slot.end)} className="flex-shrink-0 bg-white border border-emerald-300 text-emerald-950 font-mono text-[11px] font-bold px-3 py-1.5 rounded-xl hover:bg-emerald-100">
                        + {slot.start}-{slot.end}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-3xl border-2 border-pink-200/70 p-4 shadow-sm space-y-2.5">
                  <span className="text-xs font-black text-maroon uppercase">🗓️ {t.calendarTitle} ({monthName} {currentYear})</span>
                  <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                    {Array.from({ length: daysInMonth }).map((_, i) => {
                      const day = i + 1;
                      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                      const isSelected = selectedDate === dateStr;
                      const dayName = new Intl.DateTimeFormat(t.locale, { weekday: 'short' }).format(new Date(currentYear, currentMonth, day));
                      return (
                        <button key={day} onClick={() => setSelectedDate(dateStr)} className={`flex-shrink-0 w-12 py-2 rounded-2xl flex flex-col items-center justify-center border ${isSelected ? 'bg-maroon text-white font-black shadow-md' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                          <span className="text-[9px]">{dayName}</span>
                          <span className="text-sm font-black">{day}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-7 space-y-3">
                {selectedDaySchedules.map(item => {
                  const brand = brands.find(b => b.id === item.brand_id);
                  return (
                    <div key={item.id} onClick={() => handleOpenEdit(item)} className="bg-white rounded-3xl p-4 border-2 border-pink-200/70 shadow-sm flex items-start justify-between gap-3 cursor-pointer relative overflow-hidden">
                      <div className="w-2 absolute left-0 top-0 bottom-0" style={{ backgroundColor: item.color }}></div>
                      <div className="space-y-1.5 pl-2 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-mono text-xs font-black text-slate-900 bg-pink-50 border border-pink-200 px-2.5 py-0.5 rounded-lg">⏰ {item.start_time} - {item.end_time}</span>
                          <span className="text-[10px] font-black px-2 py-0.5 rounded-lg uppercase" style={{ backgroundColor: item.color + '44' }}>{item.status}</span>
                          <span className="text-xs font-bold text-slate-600">{brand?.emoji} {brand?.name}</span>
                        </div>
                        <div className="font-black text-base text-slate-900">{item.title}</div>
                        <KontenChecklist item={item} onToggleChecklist={handleToggleChecklist} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 3. MODUL PANEL SELF-CARE, HIDRASI & RUMAH KUCING MEKEL DI BAWAH JADWAL */}
            <WellnessAndMekelWidget {...wellnessProps} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
