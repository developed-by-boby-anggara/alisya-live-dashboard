    const getHariNama = (dateString) => {
      if (!dateString) return '-';
      const [y, m, d] = dateString.split('-').map(Number);
      return new Intl.DateTimeFormat('id-ID', { weekday: 'long' }).format(new Date(y, m - 1, d));
    };

    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (end === '23:59') {
        eh = 24;
        em = 0;
      }
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
        if (diff > 1440) diff = 120;
      }
      return Math.round((diff / 60) * 10) / 10;
    };

            setBrands(merged);
            if (needsUpdate) refBrands.set(merged);
          } else {
            refBrands.set(REQUIRED_CATEGORIES);
            setBrands(REQUIRED_CATEGORIES);
          }
        });

        return () => { refSch.off(); refBrands.off(); };

      const exportCSV = () => {

        const rows = schedules.map(s => [
          `"${getHariNama(s.date)}"`,

          s.start_time,
          s.end_time,

        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');

        document.body.appendChild(link);

        text += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;

        if (monthItems.length === 0) {
          text += `Belum ada agenda jadwal terdaftar di bulan ini.\n`;
        } else {
          const grouped = {};
          monthItems.forEach(item => {
            if (!grouped[item.date]) grouped[item.date] = [];
            grouped[item.date].push(item);
          });

          Object.keys(grouped).forEach(date => {

            grouped[date].forEach(item => {
              const b = brands.find(brand => brand.id === item.brand_id);
              text += ` • ⏰ ${item.start_time}-${item.end_time} | ${b?.emoji || '🏷️'} *${item.title}* [${item.status}]\n`;
              if (item.notes) text += `   └ 📝 ${item.notes}\n`;

            text += `\n`;
          });
        }

        text += `━━━━━━━━━━━━━━━━━━━━━━\n_Dashboard Alisya Schedule Realtime Cloud_ 🚀`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');

      const selectedDaySchedules = useMemo(() => {
        return schedules
          .filter(s => s.date === selectedDate)
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {

            return (s.start_time < slot.end && s.end_time > slot.start);
          });
          return !isBusy;
        });
      }, [selectedDaySchedules]);

      const getDayScheduleDensity = (dateStr) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: '✨ FREE SLOT', badge: 'bg-slate-100 text-slate-600 border-slate-200' };

        const hasOff = dayShifts.some(s => s.status === 'OFF');
        if (hasOff) return { text: '☕ LIBUR / OFF', badge: 'bg-rose-100 text-rose-800 border-rose-300' };

        let productiveHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') {
            productiveHours += calculateDurationHours(s.start_time, s.end_time);
          }
        });

        if (productiveHours >= 10) {
          return { text: '🔥 FULL SCHEDULE', badge: 'bg-rose-500 text-white font-black shadow-sm' };
        }
        if (productiveHours >= 8) {
          return { text: '⚡ MEDIUM', badge: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' };
        }
        if (productiveHours > 0) {
          return { text: '🟢 LOW', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold' };
        }
        return { text: '✨ FREE SLOT', badge: 'bg-slate-100 text-slate-600 border-slate-200' };
      };

      const filteredByStatPeriod = useMemo(() => {
        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);

          if (statPeriod === 'daily') {
            return s.date === customStatDate;
          } else if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const dayOfWeek = refDate.getDay();
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - dayOfWeek);
            startOfWeek.setHours(0,0,0,0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          } else if (statPeriod === 'monthly') {
            return sY === customStatYear && sM === (customStatMonth + 1);
          } else if (statPeriod === 'yearly') {
            return sY === customStatYear;
          }
          return true;
        });
      }, [schedules, statPeriod, customStatDate, customStatMonth, customStatYear]);

      const stats = useMemo(() => {
        let totalLive = 0, totalOff = 0, totalSick = 0, totalMeeting = 0, totalSleep = 0, totalMeTime = 0, totalKonten = 0;
        let totalLiveHours = 0, totalSleepHours = 0, totalKontenHours = 0, totalMeTimeHours = 0;

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);

          if (s.status === 'LIVE') {
            totalLive++;
            totalLiveHours += dur;
          } else if (s.status === 'OFF') {
            totalOff++;
          } else if (s.status === 'Sakit / Medis') {
            totalSick++;
          } else if (s.status === 'Meeting') {
            totalMeeting++;
          } else if (s.status === 'Tidur') {
            totalSleep++;
            totalSleepHours += (dur || 7);
          } else if (s.status === 'Konten' || s.brand_id === 'b_konten') {
            totalKonten++;
            totalKontenHours += dur;
          } else if (s.status === 'Me Time' || s.status === 'Lain-Lain' || s.brand_id === 'b_lainlain') {
            totalMeTime++;
            totalMeTimeHours += dur;
          }
        });

        if (statPeriod === 'daily') {
          totalLiveHours = Math.min(24, Math.round(totalLiveHours * 10) / 10);
          totalSleepHours = Math.min(24, Math.round(totalSleepHours * 10) / 10);
          totalKontenHours = Math.min(24, Math.round(totalKontenHours * 10) / 10);
        } else {
          totalLiveHours = Math.round(totalLiveHours * 10) / 10;
          totalSleepHours = Math.round(totalSleepHours * 10) / 10;
          totalKontenHours = Math.round(totalKontenHours * 10) / 10;
        }

        const perBrand = brands.map(b => {
          const list = filteredByStatPeriod.filter(s => s.brand_id === b.id);
          const liveCount = list.filter(s => s.status === 'LIVE').length;
          const offCount = list.filter(s => s.status === 'OFF').length;
          return { name: b.name, emoji: b.emoji, totalShift: list.length, liveCount, offCount, totalJam: liveCount * 2, color: b.color };
        });

        return { totalLive, totalOff, totalSick, totalMeeting, totalSleep, totalMeTime, totalKonten, totalLiveHours, totalSleepHours, totalKontenHours, totalMeTimeHours, perBrand };
      }, [filteredByStatPeriod, brands, statPeriod]);

      const periodLabel = useMemo(() => {
        if (statPeriod === 'daily') return `${getHariNama(customStatDate)}, ${customStatDate}`;
        if (statPeriod === 'weekly') {
          const [y, m, d] = customStatDate.split('-').map(Number);
          const ref = new Date(y, m - 1, d);
          const start = new Date(ref);
          start.setDate(ref.getDate() - ref.getDay());
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          return `${start.getDate()} - ${end.getDate()} ${new Intl.DateTimeFormat('id-ID', { month: 'short' }).format(end)} ${end.getFullYear()}`;
        }
        if (statPeriod === 'monthly') {
          const mLabel = new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(customStatYear, customStatMonth, 1));
          return `${mLabel} ${customStatYear}`;
        }
        if (statPeriod === 'yearly') return `Tahun ${customStatYear}`;
        return '';
      }, [statPeriod, customStatDate, customStatMonth, customStatYear]);

      const filteredSchedules = useMemo(() => {
        return schedules.filter(s => {
          if (filterBrand !== 'ALL' && s.brand_id !== filterBrand) return false;
          if (filterStatus !== 'ALL' && s.status !== filterStatus) return false;
          if (filterDate && s.date !== filterDate) return false;
          if (filterHour !== 'ALL') {
            const startHour = parseInt(s.start_time.split(':')[0], 10);
            const targetHour = parseInt(filterHour, 10);
            if (startHour !== targetHour) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const bName = brands.find(b => b.id === s.brand_id)?.name.toLowerCase() || '';
            const matchTitle = s.title.toLowerCase().includes(q);
            const matchNotes = (s.notes || '').toLowerCase().includes(q);
            const matchBrand = bName.includes(q);
            const matchDate = s.date.includes(q);
            if (!matchTitle && !matchNotes && !matchBrand && !matchDate) return false;
          }
          return true;
        });
      }, [schedules, filterBrand, filterStatus, filterDate, filterHour, searchQuery, brands]);

      const handleResetFilter = () => {

      const renderStatDateSelector = () => (
        <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200">
          <span className="text-[11px] font-bold text-slate-500 uppercase">Tentukan Pilihan:</span>

                    <span>📅</span><span>{t.tabSpreadsheet}</span>

                          <button onClick={() => jumpToOffset(2)} className="bg-white/20 hover:bg-white/30 text-white text-xs font-black px-3 py-1.5 rounded-xl">{t.dayAfter}</button>

                          <span className="text-sm">📲</span><span>{t.btnShareWA}</span>

                                    <span className="font-mono text-xs font-black text-slate-900 bg-slate-100 px-3 py-1 rounded-xl">

                                    <span className="text-xs font-bold text-slate-600 flex items-center gap-1.5">

                                      title="Salin Jadwal"
                                    >
                                      📋 Salin
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  </div>

                      <div className="flex items-center gap-3">
                        <button
                          onClick={shareSpreadsheetToWA}
                          className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-2xl font-black shadow-md flex items-center gap-2 active:scale-95 transition"

                          <span className="text-sm">📲</span>
                          <span>Share Rekap Spreadsheet ke WA</span>
                        </button>

                            <span className="w-3 h-3 rounded-full border border-black/10 shadow-sm" style={{ backgroundColor: b.color }}></span>
                            <span>{b.emoji} {b.name}</span>

                                <th key={slot.label} className="px-2 py-3 text-center font-mono font-bold border-b border-r border-rose-900 min-w-[105px]">
                                  {slot.label}
                                </th>
                              ))}
                            </tr>
                          </thead>

                              const day = i + 1;

                              const dayName = new Intl.DateTimeFormat('id-ID', { weekday: 'long' }).format(new Date(currentYear, currentMonth, day));
                              const isWeekend = dayName === 'Sabtu' || dayName === 'Minggu';
                              const isToday = dateStr === realTodayStr;
                              const density = getDayScheduleDensity(dateStr);

                              return (
                                <tr key={day} className={`border-b border-slate-200 hover:bg-slate-50/70 transition ${isToday ? 'bg-emerald-50/70' : ''}`}>
                                  <td className={`sticky-col px-4 py-2.5 border-r border-slate-200 whitespace-nowrap shadow-sm ${isToday ? 'bg-[#d1fae5] text-slate-900 font-black' : isWeekend ? 'bg-rose-50/80 text-rose-900 font-bold' : 'bg-slate-50 font-bold'}`}>

                                      <span className="text-base font-black text-slate-900">{day}</span>
                                      <span className="text-xs uppercase text-slate-800">{dayName}</span>

                                  </td>

                                    const slotItems = schedules.filter(s => {

                                      return (s.start_time < slot.end && s.end_time > slot.start);
                                    });

                                    return (
                                      <td
                                        key={slot.label}
                                        onClick={() => handleOpenCreate(dateStr, slot.start, slot.end)}
                                        className={`border-r border-slate-200 p-1 align-top h-14 relative transition ${isAdmin ? 'hover:bg-rose-50/50 cursor-pointer' : ''}`}
                                      >
                                        {slotItems.map(item => {
                                          const isStartSlot = (item.start_time >= slot.start && item.start_time < slot.end) || (slot.start === '00:00' && item.start_time === '00:00');

                                            <div
                                              key={item.id}
                                              onClick={(e) => { e.stopPropagation(); handleOpenEdit(item); }}

                                                  <div className="text-[9px] font-mono text-slate-700">{item.start_time}-{item.end_time}</div>

                                                </div>

                                      </td>
                                    );
                                  })}
                                </tr>

                          </button>
                          <button
                            onClick={() => setStatPeriod('weekly')}

                            {t.weekly}

                          >
                            {t.monthly}
                          </button>
                          <button
                            onClick={() => setStatPeriod('yearly')}
                            className={`px-4 py-2 rounded-xl text-xs font-black transition ${statPeriod === 'yearly' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:text-slate-900'}`}

                            {t.yearly}

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">

                        <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                          <span>🟢</span><span>{t.totalLive}</span>

                        <div className="text-3xl font-black text-emerald-600 mt-2">{stats.totalLive}</div>
                        <div className="text-xs text-slate-500 mt-2 font-bold">≈ {stats.totalLiveHours} {t.hoursLive}</div>
                      </div>
                      <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                          <span>🎬</span><span>{t.takeKonten}</span>
                        </div>
                        <div className="text-3xl font-black text-purple-600 mt-2">{stats.totalKonten}</div>
                        <div className="text-xs text-slate-500 mt-2 font-bold">≈ {stats.totalKontenHours} {t.hoursProd}</div>
                      </div>
                      <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                          <span>😴</span><span>{t.sleepTime}</span>
                        </div>
                        <div className="text-3xl font-black text-indigo-600 mt-2">{stats.totalSleep}</div>
                        <div className="text-xs text-slate-500 mt-2 font-bold">≈ {stats.totalSleepHours} {t.hoursSleep}</div>
                      </div>
                      <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                          <span>💅</span><span>{t.meTime}</span>
                        </div>
                        <div className="text-3xl font-black text-pink-600 mt-2">{stats.totalMeTime}</div>
                        <div className="text-xs text-slate-500 mt-2">{t.hoursMeTime}</div>
                      </div>
                      <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                          <span>☕</span><span>{t.offDay}</span>
                        </div>
                        <div className="text-3xl font-black text-rose-600 mt-2">{stats.totalOff}</div>
                        <div className="text-xs text-slate-500 mt-2">{t.hoursOff}</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-6">
                      <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                          <h3 className="text-sm font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
                            <span>🍩</span><span>{t.propTitle}</span>
                          </h3>
                          <span className="text-xs font-bold text-maroon bg-rose-50 px-3 py-1 rounded-xl border border-rose-200">
                            {periodLabel}
                          </span>
                        </div>
                        <div className="h-72 relative"><canvas ref={donutCanvas}></canvas></div>
                      </div>
                      <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                          <h3 className="text-sm font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
                            <span>📊</span><span>{t.barTitle}</span>
                          </h3>
                          <span className="text-xs font-bold text-maroon bg-rose-50 px-3 py-1 rounded-xl border border-rose-200">
                            {periodLabel}
                          </span>
                        </div>
                        <div className="h-72 relative"><canvas ref={barCanvas}></canvas></div>
                      </div>
                    </div>
                  </div>
                )}

                {/* DAFTAR SEMUA JADWAL PC */}
                {pcSubTab === 'list' && (
                  <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="font-black text-slate-800 text-lg">Semua Jadwal Terdaftar ({filteredSchedules.length})</h3>
                      {isAdmin && (
                        <button onClick={() => handleOpenCreate()} className="bg-maroon hover:bg-maroon-dark text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow active:scale-95 transition">
                          {t.btnAddSch}
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-5 gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-200 text-xs font-semibold">
                      <div className="md:col-span-1">
                        <label className="block text-slate-500 mb-1">Cari Kata Kunci:</label>
                        <input
                          type="text"
                          placeholder="🔍 Shift, catatan..."
                          value={searchQuery}
                          onChange={e => setSearchQuery(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-maroon focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-500 mb-1">Kategori / Brand:</label>
                        <select
                          value={filterBrand}
                          onChange={e => setFilterBrand(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs"
                        >
                          <option value="ALL">Semua Kategori</option>
                          {brands.map(b => <option key={b.id} value={b.id}>{b.emoji} {b.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-500 mb-1">Status Kehadiran:</label>
                        <select
                          value={filterStatus}
                          onChange={e => setFilterStatus(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs"
                        >
                          <option value="ALL">Semua Status</option>
                          <option value="LIVE">🟢 LIVE</option>
                          <option value="Konten">🎬 Take Konten</option>
                          <option value="Tidur">😴 Tidur</option>
                          <option value="Me Time">💅 Me Time</option>
                          <option value="Meeting">💬 Meeting</option>
                          <option value="OFF">☕ OFF</option>
                          <option value="Sakit / Medis">🏥 Sakit / Medis</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-500 mb-1">Pilih Cek Tanggal:</label>
                        <input
                          type="date"
                          value={filterDate}
                          onChange={e => setFilterDate(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-slate-700"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-slate-500">Cek Jam Mulai (Digital):</label>
                          {(searchQuery || filterBrand !== 'ALL' || filterStatus !== 'ALL' || filterDate || filterHour !== 'ALL') && (
                            <button onClick={handleResetFilter} className="text-[10px] text-rose-600 font-bold hover:underline">Reset</button>
                          )}
                        </div>
                        <select
                          value={filterHour}
                          onChange={e => setFilterHour(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-mono"
                        >
                          <option value="ALL">Semua Jam</option>
                          {Array.from({ length: 24 }).map((_, h) => (
                            <option key={h} value={h}>{String(h).padStart(2, '0')}:00</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-bold">
                          <tr>
                            <th className="px-4 py-3.5">Hari</th>
                            <th className="px-4 py-3.5">Tanggal</th>
                            <th className="px-4 py-3.5">Jam Digital</th>
                            <th className="px-4 py-3.5">Judul Shift / Agenda</th>
                            <th className="px-4 py-3.5">Kategori</th>
                            <th className="px-4 py-3.5">Status</th>
                            <th className="px-4 py-3.5">Catatan</th>
                            {isAdmin && <th className="px-4 py-3.5 text-right">Aksi</th>}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {filteredSchedules.length === 0 ? (
                            <tr><td colSpan="8" className="text-center py-8 text-slate-400 font-bold">Tidak ada jadwal yang cocok dengan filter pencarian ini.</td></tr>
                          ) : (
                            filteredSchedules.map(s => {
                              const brand = brands.find(b => b.id === s.brand_id);
                              const namaHari = getHariNama(s.date);
                              const isWeekend = namaHari === 'Sabtu' || namaHari === 'Minggu';

                              return (
                                <tr key={s.id} className="hover:bg-slate-50">
                                  <td className="px-4 py-3 font-bold">
                                    <span className={`px-2.5 py-1 rounded-xl text-[11px] ${isWeekend ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-700'}`}>
                                      {namaHari}
                                    </span>
                                  </td>
                                  <td className="px-4 py-3 font-semibold text-slate-900">{s.date}</td>
                                  <td className="px-4 py-3 font-mono font-bold text-slate-700">{s.start_time} - {s.end_time}</td>
                                  <td className="px-4 py-3 font-extrabold text-slate-900">
                                    <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: s.color }}></span>
                                    {s.title}
                                  </td>
                                  <td className="px-4 py-3 font-medium">{brand?.emoji} {brand?.name || s.brand_id}</td>
                                  <td className="px-4 py-3"><span className="px-2 py-0.5 rounded-md font-bold text-[10px]" style={{ backgroundColor: s.color + '44' }}>{s.status}</span></td>
                                  <td className="px-4 py-3 italic text-slate-500">{s.notes || '-'}</td>
                                  {isAdmin && (
                                    <td className="px-4 py-3 text-right space-x-2 whitespace-nowrap font-bold">
                                      <button onClick={() => handleDuplicate(s)} className="text-slate-600 hover:text-slate-900 bg-slate-100 px-2 py-1 rounded-lg" title="Salin Jadwal">📋 Salin</button>
                                      <button onClick={() => handleOpenEdit(s)} className="text-blue-600 hover:underline">Edit</button>
                                      <button onClick={() => handleDelete(s.id)} className="text-rose-600 hover:underline">Hapus</button>
                                    </td>
                                  )}
                                </tr>
                              );
                            })
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* WARNA BRAND PC */}
                {pcSubTab === 'colors' && (
                  <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4 max-w-2xl mx-auto">
                    <div>
                      <h3 className="font-black text-slate-800 text-base">🎨 {t.tabColors}</h3>
                      <p className="text-xs text-slate-500 mt-1">Ubah warna visual brand, take konten video affiliate, jam tidur, dan jadwal me time dengan Color Picker.</p>
                    </div>

                    <div className="space-y-3">
                      {brands.map(b => (
                        <div key={b.id} className="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-200">
                          <div className="flex items-center gap-3">
                            <input
                              type="color"
                              disabled={!isAdmin}
                              value={b.color}
                              onChange={e => {
                                const newColor = e.target.value;
                                const updated = brands.map(item => item.id === b.id ? { ...item, color: newColor } : item);
                                saveBrandsToCloud(updated);
                                const updatedSch = schedules.map(s => s.brand_id === b.id ? { ...s, color: newColor } : s);
                                saveSchedulesToCloud(updatedSch);
                              }}
                              className="w-10 h-10 rounded-2xl border-none cursor-pointer"
                            />
                            <div>
                              <div className="font-extrabold text-sm text-slate-800 flex items-center gap-1.5">
                                <span>{b.emoji}</span><span>{b.name}</span>
                              </div>
                              <div className="text-[11px] text-slate-400 font-mono font-bold">{b.color}</div>
                            </div>
                          </div>
                          <span className={`text-[10px] font-black px-2.5 py-1 rounded-xl ${isAdmin ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                            {isAdmin ? 'BISA DIUBAH' : 'TERKUNCI'}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* 🌟 2. TAMPILAN MODE HP / MOBILE                          */}
          {/* ========================================================= */}
          {displayMode === 'mobile' && (
            <div className="flex-1 flex flex-col">
              <nav className="bg-white border-b border-slate-200 px-3 py-2 overflow-x-auto scrollbar-none flex items-center gap-2 sticky top-[58px] z-30 shadow-sm">
                <button
                  onClick={() => setActiveTab('agenda')}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeTab === 'agenda' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <span>📱</span><span>{t.tabAgenda}</span>
                </button>
                <button
                  onClick={() => setActiveTab('calendar')}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeTab === 'calendar' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <span>📅</span><span>{t.tabSpreadsheet}</span>
                </button>
                <button
                  onClick={() => setActiveTab('kpi')}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeTab === 'kpi' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <span>📊</span><span>{t.tabKPI}</span>
                </button>
                <button
                  onClick={() => setActiveTab('list')}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeTab === 'list' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <span>📋</span><span>{t.tabList}</span>
                </button>
                <button
                  onClick={() => setActiveTab('colors')}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeTab === 'colors' ? 'bg-maroon text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  <span>🎨</span><span>{t.tabColors}</span>
                </button>
                <button
                  onClick={exportCSV}
                  className="flex-shrink-0 ml-auto bg-slate-100 text-slate-800 border border-slate-300 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1"
                >
                  <span>📥</span><span>CSV</span>
                </button>
              </nav>

              <div className="p-4 space-y-4 max-w-lg w-full mx-auto">
                {activeTab === 'agenda' && (
                  <div className="space-y-4">
                    {/* RADAR LIVE STREAM */}
                    <div className="bg-gradient-to-r from-maroon to-rose-900 text-white rounded-3xl p-4 shadow-lg space-y-2">
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-1.5">
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                          <span className="text-[10px] font-extrabold uppercase tracking-widest text-rose-200">{t.radarTitle}</span>
                        </div>
                        <button
                          onClick={shareToWhatsApp}
                          className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-xl text-[11px] font-black shadow flex items-center gap-1 active:scale-95 transition"
                        >
                          <span>📲</span><span>{t.btnShareWA}</span>
                        </button>
                      </div>
                      <div>
                        <div className="flex items-center justify-between">
                          <h2 className="text-base font-black">{getHariNama(selectedDate)}, {selectedDate}</h2>
                          <span className={`px-2 py-0.5 rounded-lg text-[10px] border ${getDayScheduleDensity(selectedDate).badge}`}>
                            {getDayScheduleDensity(selectedDate).text}
                          </span>
                        </div>
                        <p className="text-xs text-rose-100 mt-1">{selectedDaySchedules.length} Sesi Terjadwal • {selectedDaySchedules.filter(s=>s.status!=='Tidur').length} Aktivitas Produktif</p>
                      </div>

                      <div className="flex items-center gap-2 pt-2 border-t border-white/20">
                        <span className="text-[10px] text-rose-200 font-bold">{t.jump}</span>
                        <button onClick={() => jumpToOffset(0)} className="bg-white/20 hover:bg-white/30 text-white text-[10px] font-black px-2.5 py-1 rounded-lg">{t.today}</button>
                        <button onClick={() => jumpToOffset(1)} className="bg-white/20 hover:bg-white/30 text-white text-[10px] font-black px-2.5 py-1 rounded-lg">{t.tomorrow}</button>
                        <button onClick={() => jumpToOffset(2)} className="bg-white/20 hover:bg-white/30 text-white text-[10px] font-black px-2.5 py-1 rounded-lg">{t.dayAfter}</button>
                      </div>
                    </div>

                    {/* AVAILABLE SCHEDULE CARD */}
                    <div className="bg-emerald-50 border border-emerald-200 rounded-3xl p-3.5 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-black text-emerald-900 flex items-center gap-1.5">
                          <span>🟢</span><span>{t.availableTitle}</span>
                        </span>
                        <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                          {availableSlotsForSelectedDate.length} {t.slotsReady}
                        </span>
                      </div>
                      <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                        {availableSlotsForSelectedDate.length === 0 ? (
                          <span className="text-xs text-rose-600 font-bold py-1">{t.allSlotsFilled}</span>
                        ) : (
                          availableSlotsForSelectedDate.map(slot => (
                            <button
                              key={slot.label}
                              onClick={() => handleOpenCreate(selectedDate, slot.start, slot.end)}
                              className="flex-shrink-0 bg-white border border-emerald-300 text-emerald-950 font-mono text-[10px] font-bold px-2.5 py-1 rounded-xl shadow-xs hover:bg-emerald-100 active:scale-95"
                              title="Klik untuk pasang jadwal di jam ini"
                            >
                              + {slot.start}-{slot.end}
                            </button>
                          ))
                        )}
                      </div>
                    </div>

                    {/* HORIZONTAL DATE PICKER BAR */}
                    <div className="bg-white p-3 rounded-3xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between mb-2 px-1">
                        <span className="text-xs font-black text-slate-700 uppercase">🗓️ {t.calendarTitle} ({monthName})</span>
                        <span className="text-[10px] text-slate-400 font-bold">Geser ❯</span>
                      </div>
                      <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                        {Array.from({ length: daysInMonth }).map((_, i) => {
                          const day = i + 1;
                          const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                          const isSelected = selectedDate === dateStr;
                          const isToday = dateStr === realTodayStr;
                          const dayName = new Intl.DateTimeFormat('id-ID', { weekday: 'short' }).format(new Date(currentYear, currentMonth, day));
                          const dayShifts = schedules.filter(s => s.date === dateStr);
                          const isWeekend = dayName === 'Sab' || dayName === 'Min';

                          return (
                            <button
                              key={day}
                              onClick={() => setSelectedDate(dateStr)}
                              className={`flex-shrink-0 w-12 py-2 rounded-2xl flex flex-col items-center justify-center transition active:scale-95 ${isSelected ? 'bg-maroon text-white shadow-md scale-105' : isToday ? 'bg-emerald-100 text-emerald-900 border border-emerald-300 font-black' : 'bg-slate-50 text-slate-700 border border-slate-200'}`}
                            >
                              <span className={`text-[9px] font-bold ${isSelected ? 'text-rose-200' : isToday ? 'text-emerald-700' : isWeekend ? 'text-rose-600' : 'text-slate-400'}`}>{dayName}</span>
                              <span className="text-sm font-black">{day}</span>
                              <div className="flex gap-0.5 mt-1 h-1">
                                {dayShifts.slice(0, 3).map((s, idx) => (
                                  <span key={idx} className="w-1 h-1 rounded-full" style={{ backgroundColor: isSelected ? '#FFFFFF' : s.color }}></span>
                                ))}
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* KARTU JADWAL HARIAN */}
                    <div className="space-y-3">
                      {selectedDaySchedules.length === 0 ? (
                        <div className="bg-white rounded-3xl p-7 text-center border border-slate-200 shadow-sm space-y-2">
                          <div className="text-4xl">☕</div>
                          <div className="font-extrabold text-sm text-slate-800">{t.noSchedule}</div>
                          <p className="text-xs text-slate-400">{t.noScheduleSub}</p>
                          {isAdmin && (
                            <button onClick={() => handleOpenCreate(selectedDate)} className="mt-2 bg-maroon text-white text-xs font-bold px-4 py-2 rounded-xl">
                              {t.btnAddSession}
                            </button>
                          )}
                        </div>
                      ) : (
                        selectedDaySchedules.map(item => {
                          const brand = brands.find(b => b.id === item.brand_id);
                          return (
                            <div
                              key={item.id}
                              onClick={() => handleOpenEdit(item)}
                              className="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm flex items-start justify-between gap-3 active:scale-[0.98] transition cursor-pointer relative overflow-hidden"
                            >
                              <div className="w-2 absolute left-0 top-0 bottom-0" style={{ backgroundColor: item.color }}></div>
                              <div className="space-y-1.5 pl-2 flex-1">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <span className="font-mono text-[11px] font-black text-slate-900 bg-slate-100 px-2 py-0.5 rounded-lg">
                                    ⏰ {item.start_time} - {item.end_time}
                                  </span>
                                  <span className="text-[9px] font-black px-2 py-0.5 rounded-lg uppercase" style={{ backgroundColor: item.color + '44', color: '#0F172A' }}>
                                    {item.status}
                                  </span>
                                  <span className="text-[11px] font-bold text-slate-600 flex items-center gap-1">
                                    <span>{brand?.emoji}</span><span>{brand?.name}</span>
                                  </span>
                                </div>
                                <div className="font-black text-sm text-slate-900 leading-snug">{item.title}</div>
                                {item.notes && (
                                  <div className="bg-amber-50 border border-amber-200 p-2 rounded-xl text-[10px] text-amber-900 italic">
                                    📝 {item.notes}
                                  </div>
                                )}
                              </div>
                              {isAdmin && (
                                <div className="flex flex-col items-end gap-1">
                                  <span className="text-[11px] text-blue-600 font-extrabold">Edit ❯</span>
                                  <button onClick={(e) => { e.stopPropagation(); handleDuplicate(item); }} className="text-[9px] text-slate-500 font-bold bg-slate-100 px-2 py-0.5 rounded-lg">
                                    📋
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                  <div className="space-y-3">

                                <tr key={day} className={`border-b border-slate-200 ${isToday ? 'bg-emerald-50/70' : ''}`}>

                                        <span className="bg-[#10b981] text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-xs">

                                      )}

                                  <td className="border-r border-slate-200 p-1 text-center whitespace-nowrap">

                                    const slotItems = schedules.filter(s => {

                                      return (s.start_time < slot.end && s.end_time > slot.start);
                                    });

                                    return (
                                      <td key={slot.label} onClick={() => handleOpenCreate(dateStr, slot.start, slot.end)} className="border-r border-slate-200 p-0.5 align-top h-10 relative">

                                            <div
                                              key={item.id}
                                              onClick={(e) => { e.stopPropagation(); handleOpenEdit(item); }}

                                    <button onClick={() => handleDelete(s.id)} className="text-[10px] font-bold text-rose-600">Hapus</button>
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* WARNA HP */}

                          <span className="text-[10px] font-bold font-mono text-slate-500">{b.color}</span>

                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* FLOATING ACTION BUTTON HP */}
              {isAdmin && (
                <button
                  onClick={() => handleOpenCreate(selectedDate)}
                  className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-maroon text-white flex items-center justify-center text-3xl shadow-2xl z-40 active:scale-90 transition border-2 border-white/50"
                  title="Tambah Cepat"
                >
                  +
                </button>

                    </button>
                  </div>
                </form>
              </div>
            </div>

          {modalOpen && (

                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>
                <form onSubmit={handleSave} className="p-5 space-y-3 text-xs">
                  
                  {/* 🍼 PANEL 1-KLIK PRESET SHIFT MOM UUNG */}

                      <span className="font-black text-amber-950 flex items-center gap-1.5 text-[11px]">
                        <span>🍼</span><span>Shift Cepat Mom Uung (1-Klik Isi):</span>

                          const newBrandId = e.target.value;
                          let newStatus = formData.status;
                          if (newBrandId === 'b_konten') newStatus = 'Konten';
                          else if (newBrandId === 'b_sleep') newStatus = 'Tidur';
                          else if (newBrandId === 'b_lainlain') newStatus = 'Me Time';
                          else if (newBrandId === 'b_pribadi') newStatus = 'OFF';
                          setFormData({ ...formData, brand_id: newBrandId, status: newStatus });
                        }}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        {brands.map(b => (
                          <option key={b.id} value={b.id}>
                            {b.emoji} {b.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Status Kehadiran *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        <option value="LIVE">🟢 LIVE</option>
                        <option value="Konten">🎬 Take Konten Video</option>
                        <option value="Tidur">😴 Tidur / Istirahat</option>
                        <option value="Me Time">💅 Me Time</option>
                        <option value="Meeting">💬 Meeting</option>
                        <option value="OFF">☕ OFF (Libur)</option>
                        <option value="Sakit / Medis">🏥 Sakit / Medis</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tanggal *</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                    />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jam Mulai (Digital) *</label>
                      <select
                        required
                        value={formData.start_time}
                        onChange={e => setFormData({ ...formData, start_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {START_TIME_OPTIONS.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jam Selesai (Digital) *</label>
                      <select
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {END_TIME_OPTIONS.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Catatan / Target GMV</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="Target GMV, agenda me time, konsep video affiliate, atau catatan sesi..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 font-medium"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 font-extrabold hover:underline">
                        🗑️ Hapus Jadwal
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl font-bold">
                        Batal
                      </button>
                      <button type="submit" className="bg-maroon text-white px-5 py-2.5 rounded-2xl font-black shadow active:scale-95 transition">
                        Simpan ke Cloud
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
