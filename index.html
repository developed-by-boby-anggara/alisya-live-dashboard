    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (end === '23:59') {
        eh = 24;
        em = 0;
      }
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
        if (diff > 1440) diff = 120;
      }
      return Math.round((diff / 60) * 10) / 10;
    };

    const addDaysToDateStr = (dateStr, daysToAdd) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysToAdd);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    // Fungsi Suara Notifikasi Lembut
    const playNotificationChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        const now = ctx.currentTime;
        playTone(587.33, now, 0.25);
        playTone(880.00, now + 0.2, 0.45);
      } catch (e) {
        console.log("Audio chime error:", e);
      }
    };

    function App() {

      const saveSchedulesToCloud = (newList) => {

      const [modalOpen, setModalOpen] = useState(false);

      const [formData, setFormData] = useState({

      const [toast, setToast] = useState('');
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3500); };

      const daysInMonth = useMemo(() => new Date(currentYear, currentMonth + 1, 0).getDate(), [currentYear, currentMonth]);
      const monthName = useMemo(() => new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(currentYear, currentMonth, 1)), [currentYear, currentMonth, t.locale]);

      // 🌟 Live Now Tracker
      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowMinutes = nowTime.getHours() * 60 + nowTime.getMinutes();
        const toMin = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 60;
          const [h, m] = tStr.split(':').map(Number);
          return h * 60 + m;
        };

        let activeItem = null;
        let nextItem = null;
        let completedCount = 0;

        todayList.forEach(item => {
          const sMin = toMin(item.start_time);
          let eMin = toMin(item.end_time);
          if (eMin <= sMin) eMin = 24 * 60;

          if (nowMinutes >= sMin && nowMinutes < eMin) {
            activeItem = { ...item, remainingMin: eMin - nowMinutes };
          } else if (nowMinutes >= eMin) {
            completedCount++;
          } else if (nowMinutes < sMin && !nextItem) {
            nextItem = { ...item, startsInMin: sMin - nowMinutes };
          }
        });

        const progressPct = todayList.length > 0
          ? Math.min(100, Math.round(((completedCount + (activeItem ? 0.5 : 0)) / todayList.length) * 100))
          : 0;

        return { activeItem, nextItem, progressPct, totalToday: todayList.length, completedCount };
      }, [schedules, realTodayStr, nowTime]);

      // 🛡️ Burnout Guard: Deteksi Jeda Singkat (<5 jam) antar shift produktif
      const shortBreakWarnings = useMemo(() => {
        const map = {};
        const grouped = {};
        schedules.forEach(s => {
          if (s.status === 'Tidur' || s.brand_id === 'b_sleep' || s.status === 'OFF') return;
          if (!grouped[s.date]) grouped[s.date] = [];
          grouped[s.date].push(s);
        });

        const toM = (timeStr) => {
          if (timeStr === '23:59') return 24 * 60;
          const [h, m] = timeStr.split(':').map(Number);
          return h * 60 + m;
        };

        Object.keys(grouped).forEach(date => {
          const list = grouped[date].sort((a, b) => a.start_time.localeCompare(b.start_time));
          for (let i = 0; i < list.length - 1; i++) {
            const endCurr = toM(list[i].end_time);
            const startNext = toM(list[i+1].start_time);
            const diffMin = startNext - endCurr;
            if (diffMin > 0 && diffMin < 300) {
              map[date] = true;
              break;
            }
          }
        });
        return map;
      }, [schedules]);

      const selectedDaySchedules = useMemo(() => {
        return schedules
          .filter(s => s.date === selectedDate)
          .sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, selectedDate]);

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {
          const isBusy = selectedDaySchedules.some(s => (s.start_time < slot.end && s.end_time > slot.start));
          return !isBusy;
        });
      }, [selectedDaySchedules]);

      const getDayScheduleDensity = (dateStr) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: t.statusFree, badge: 'bg-slate-100 text-slate-600 border-slate-200' };

        const hasOff = dayShifts.some(s => s.status === 'OFF');
        if (hasOff) return { text: t.statusOff, badge: 'bg-rose-100 text-rose-800 border-rose-300' };

        let productiveHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') {
            productiveHours += calculateDurationHours(s.start_time, s.end_time);
          }
        });

        if (productiveHours >= 10) {
          return { text: t.statusFull, badge: 'bg-rose-500 text-white font-black shadow-sm' };
        }
        if (productiveHours >= 8) {
          return { text: t.statusMed, badge: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' };
        }
        if (productiveHours > 0) {
          return { text: t.statusLow, badge: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold' };
        }
        return { text: t.statusFree, badge: 'bg-slate-100 text-slate-600 border-slate-200' };
      };

      const filteredByStatPeriod = useMemo(() => {
        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);

          if (statPeriod === 'daily') {
            return s.date === customStatDate;
          } else if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const dayOfWeek = refDate.getDay();
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - dayOfWeek);
            startOfWeek.setHours(0,0,0,0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          } else if (statPeriod === 'monthly') {
            return sY === customStatYear && sM === (customStatMonth + 1);
          } else if (statPeriod === 'yearly') {
            return sY === customStatYear;
          }
          return true;
        });
      }, [schedules, statPeriod, customStatDate, customStatMonth, customStatYear]);

      const stats = useMemo(() => {
        let totalLive = 0, totalOff = 0, totalSick = 0, totalMeeting = 0, totalSleep = 0, totalMeTime = 0, totalKonten = 0;
        let totalLiveHours = 0, totalSleepHours = 0, totalKontenHours = 0, totalMeTimeHours = 0;

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);

          if (s.status === 'LIVE') {
            totalLive++;
            totalLiveHours += dur;
          } else if (s.status === 'OFF') {
            totalOff++;
          } else if (s.status === 'Sakit / Medis') {
            totalSick++;
          } else if (s.status === 'Meeting') {
            totalMeeting++;
          } else if (s.status === 'Tidur') {
            totalSleep++;
            totalSleepHours += (dur || 7);
          } else if (s.status === 'Konten' || s.brand_id === 'b_konten') {
            totalKonten++;
            totalKontenHours += dur;
          } else if (s.status === 'Me Time' || s.status === 'Lain-Lain' || s.brand_id === 'b_lainlain') {

            totalMeTimeHours += dur;

        if (statPeriod === 'daily') {
          totalLiveHours = Math.min(24, Math.round(totalLiveHours * 10) / 10);
          totalSleepHours = Math.min(24, Math.round(totalSleepHours * 10) / 10);
          totalKontenHours = Math.min(24, Math.round(totalKontenHours * 10) / 10);
        } else {
          totalLiveHours = Math.round(totalLiveHours * 10) / 10;
          totalSleepHours = Math.round(totalSleepHours * 10) / 10;
          totalKontenHours = Math.round(totalKontenHours * 10) / 10;

          if (searchQuery.trim()) {

            const bName = brands.find(b => b.id === s.brand_id)?.name.toLowerCase() || '';
            const matchTitle = s.title.toLowerCase().includes(q);
            const matchNotes = (s.notes || '').toLowerCase().includes(q);
            const matchBrand = bName.includes(q);
            const matchDate = s.date.includes(q);
            if (!matchTitle && !matchNotes && !matchBrand && !matchDate) return false;

          return true;

      const handleResetFilter = () => {

        setFilterBrand('ALL');

          if (!notifiedIdsRef.current.has(alertKey)) {
            notifiedIdsRef.current.add(alertKey);
            playNotificationChime();
            notify(`🔔 "${nextItem.title}" (${nextItem.start_time}) - ${nextItem.startsInMin} ${t.minUnit}!`);
          }
        }
      }, [liveTracker, soundAlert, realTodayStr, t.minUnit]);

      const handleToggleChecklist = (e, itemId, stepKey) => {
        e.stopPropagation();
        if (!isAdmin) { setPinInputModal(true); return; }
        const updated = schedules.map(s => {
          if (s.id === itemId) {
            const currentCheck = s.checklist || { shoot: false, edit: false, upload: false };
            return {
              ...s,
              checklist: { ...currentCheck, [stepKey]: !currentCheck[stepKey] }
            };
          }
          return s;
        });
        saveSchedulesToCloud(updated);
        notify('✅ Progres konten diperbarui!');
      };

      const exportElementAsPNG = async (elementId, filenameLabel) => {
        const el = document.getElementById(elementId);
        if (!el || typeof html2canvas === 'undefined') {
          notify('⚠️ Gagal mengekspor gambar.');
          return;
        }
        notify('📸 Sedang memproses gambar...');
        try {
          const canvas = await html2canvas(el, {
            scale: 2,
            useCORS: true,
            backgroundColor: darkMode ? '#0F172A' : '#F8FAFC'
          });
          const link = document.createElement('a');
          link.download = `Alisya_Schedule_${filenameLabel}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          notify('✨ Gambar (.PNG) berhasil diunduh!');
        } catch (err) {
          console.error(err);
          notify('⚠️ Gagal mengunduh gambar.');
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (enteredPin === adminPin) {
          setIsAdmin(true);
          setPinInputModal(false);
          setEnteredPin('');
          setPinError(false);
          notify('🔓 Admin Access Unlocked!');
        } else {
          setPinError(true);
        }
      };

      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {
        if (!isAdmin) { setPinInputModal(true); return; }
        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({
          id: 'sch_' + Date.now(),
          date: dateStr || selectedDate,
          start_time: slotStart,
          end_time: slotEnd,
          title: '',
          brand_id: brands[0]?.id || 'b_momuung',
          status: 'LIVE',
          color: brands[0]?.color || '#B6D7A8',
          notes: '',
          checklist: { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);
      };

      const handleOpenEdit = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        setSelectedSchedule(sch);
        setRepeatDays(1);
        setFormData({
          ...sch,
          checklist: sch.checklist || { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);
      };

      const handleDuplicate = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const copy = { ...sch, id: 'sch_' + Date.now(), title: sch.title + ' (Copy)' };
        saveSchedulesToCloud([...schedules, copy]);
        notify('📋 Disalin!');
      };

      const applyMomUungPreset = (shiftNum, start, end) => {
        const momUungBrand = brands.find(b => b.id === 'b_momuung') || { color: '#B6D7A8' };
        setFormData(prev => ({
          ...prev,
          title: `Shift ${shiftNum} Mom Uung`,
          brand_id: 'b_momuung',
          status: 'LIVE',
          color: momUungBrand.color,
          start_time: start,
          end_time: end
        }));
        notify(`⚡ Shift ${shiftNum} Mom Uung (${start} - ${end})`);
      };

      const applyAquaPressPreset = (shiftNum, start, end) => {
        const aquaBrand = brands.find(b => b.id === 'b_aquapress') || { color: '#00FFFF' };
        setFormData(prev => ({
          ...prev,
          title: `Shift ${shiftNum} AquaPress`,
          brand_id: 'b_aquapress',
          status: 'LIVE',
          color: aquaBrand.color,
          start_time: start,
          end_time: end
        }));
        notify(`💧 Shift ${shiftNum} AquaPress (${start} - ${end})`);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const brandObj = brands.find(b => b.id === formData.brand_id);
        const basePayload = { ...formData, color: brandObj?.color || formData.color };

        if (selectedSchedule) {
          saveSchedulesToCloud(schedules.map(s => s.id === selectedSchedule.id ? basePayload : s));
          notify('✨ Berhasil diperbarui!');
        } else {
          const newItems = [];
          const count = Number(repeatDays) || 1;
          for (let i = 0; i < count; i++) {
            const targetDate = i === 0 ? basePayload.date : addDaysToDateStr(basePayload.date, i);
            newItems.push({
              ...basePayload,
              id: 'sch_' + Date.now() + '_' + i,
              date: targetDate
            });
          }
          saveSchedulesToCloud([...schedules, ...newItems]);
          notify('🚀 Berhasil disimpan!');
        }
        setModalOpen(false);
      };

      const handleDelete = (id) => {
        if (confirm('Hapus jadwal ini?')) {
          const updated = schedules.filter(s => s.id !== id);
          saveSchedulesToCloud(updated);
          setModalOpen(false);
          notify('🗑️ Dihapus.');
        }
      };

      const exportCSV = () => {
        const headers = [t.colDay, t.colDate, t.formStartHour, t.formEndHour, t.colTitle, t.colCategory, t.colStatus, t.colNotes];
        const rows = schedules.map(s => [
          `"${getHariNama(s.date)}"`,
          s.date,
          s.start_time,
          s.end_time,
          `"${s.title.replace(/"/g, '""')}"`,
          `"${(brands.find(b => b.id === s.brand_id)?.name || s.brand_id).replace(/"/g, '""')}"`,
          `"${s.status}"`,
          `"${(s.notes || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Alisya_Schedule_${currentYear}_${currentMonth+1}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notify('📥 CSV Downloaded!');
      };

      const shareToWhatsApp = () => {
        const todayItems = schedules.filter(s => s.date === selectedDate).sort((a,b) => a.start_time.localeCompare(b.start_time));
        const hari = getHariNama(selectedDate);
        let text = `📢 *${t.radarTitle}*\n🗓️ ${hari}, ${selectedDate}\n\n`;
        if (todayItems.length === 0) text += `☕ ${t.noSchedule}\n`;
        else {
          todayItems.forEach((s, idx) => {
            const b = brands.find(brand => brand.id === s.brand_id);
            text += `${idx + 1}. *${s.start_time} - ${s.end_time}* : ${s.title}\n   🏷️ ${b ? b.name : '-'}\n   📌 ${s.status}\n\n`;
          });
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const shareSpreadsheetToWA = () => {
        const monthItems = schedules
          .filter(s => {
            const [y, m] = s.date.split('-').map(Number);
            return y === currentYear && m === (currentMonth + 1);
          })
          .sort((a, b) => a.date.localeCompare(b.date) || a.start_time.localeCompare(b.start_time));

        let text = `📊 *ALISYA SCHEDULE (${monthName} ${currentYear})*\n\n`;
        if (monthItems.length === 0) text += `${t.noSchedule}\n`;
        else {
          const grouped = {};
          monthItems.forEach(item => {
            if (!grouped[item.date]) grouped[item.date] = [];
            grouped[item.date].push(item);
          });
          Object.keys(grouped).forEach(date => {
            text += `📅 *${getHariNama(date)}, ${date}*:\n`;
            grouped[date].forEach(item => {
              text += ` • ⏰ ${item.start_time}-${item.end_time} | *${item.title}* [${item.status}]\n`;
            });
            text += `\n`;
          });
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const jumpToOffset = (days) => {
        const d = new Date();
        d.setDate(d.getDate() + days);
        const yStr = d.getFullYear();
        const mStr = String(d.getMonth() + 1).padStart(2, '0');
        const dStr = String(d.getDate()).padStart(2, '0');
        setSelectedDate(`${yStr}-${mStr}-${dStr}`);
        setCurrentMonth(d.getMonth());
        setCurrentYear(d.getFullYear());
      };

      const renderStatDateSelector = () => (
        <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200">
          <span className="text-[11px] font-bold text-slate-500 uppercase">{t.selectOption}</span>
          {statPeriod === 'daily' && (
            <input
              type="date"
              value={customStatDate}
              onChange={e => setCustomStatDate(e.target.value)}
              className="bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 shadow-xs focus:ring-1 focus:ring-maroon"
            />
          )}
          {statPeriod === 'weekly' && (
            <div className="flex items-center gap-1.5">
              <span className="text-xs text-slate-600 font-medium">{t.weekFrom}</span>
              <input
                type="date"
                value={customStatDate}
                onChange={e => setCustomStatDate(e.target.value)}
                className="bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 shadow-xs focus:ring-1 focus:ring-maroon"
              />
            </div>
          )}
          {statPeriod === 'monthly' && (
            <div className="flex items-center gap-2">
              <select
                value={customStatMonth}
                onChange={e => setCustomStatMonth(Number(e.target.value))}
                className="bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 shadow-xs"
              >
                {Array.from({ length: 12 }).map((_, mIdx) => (
                  <option key={mIdx} value={mIdx}>
                    {new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(2026, mIdx, 1))}
                  </option>
                ))}
              </select>
              <select
                value={customStatYear}
                onChange={e => setCustomStatYear(Number(e.target.value))}
                className="bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 shadow-xs"
              >
                {[2024, 2025, 2026, 2027, 2028].map(yr => (
                  <option key={yr} value={yr}>{yr}</option>
                ))}
              </select>
            </div>
          )}
          {statPeriod === 'yearly' && (
            <select
              value={customStatYear}
              onChange={e => setCustomStatYear(Number(e.target.value))}
              className="bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 shadow-xs"
            >
              {[2024, 2025, 2026, 2027, 2028].map(yr => (
                <option key={yr} value={yr}>{t.yearLabel} {yr}</option>
              ))}
            </select>
          )}
        </div>
      );

      const renderLiveNowBanner = () => (
        <div className="bg-black/25 rounded-2xl p-3 border border-white/15 space-y-2 mt-2">
          <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex items-center gap-2">
              {liveTracker.activeItem ? (
                <span className="flex items-center gap-1.5 font-black text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>{t.liveNowActive} {liveTracker.activeItem.title} ({liveTracker.activeItem.remainingMin} {t.minLeft})</span>
                </span>
              ) : (
                <span className="text-rose-200 font-bold">{t.liveNowIdle}</span>
              )}
            </div>
            {liveTracker.nextItem && (
              <div className="text-[11px] font-bold bg-white/15 px-2.5 py-1 rounded-xl text-amber-200">
                ⏳ {t.nextUp} <span className="text-white font-black">{liveTracker.nextItem.title}</span> ({liveTracker.nextItem.start_time} • {t.inMin} {liveTracker.nextItem.startsInMin} {t.minUnit})
              </div>
            )}
          </div>
          <div className="space-y-1">
            <div className="flex justify-between text-[10px] text-rose-200 font-bold">
              <span>{t.progressToday} ({realTodayStr})</span>
              <span>{liveTracker.progressPct}% {t.completed}</span>
            </div>
            <div className="w-full h-2 bg-black/40 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-emerald-400 to-teal-300 transition-all duration-500"
                style={{ width: `${liveTracker.progressPct}%` }}
              ></div>
            </div>
          </div>
        </div>
      );

      const renderKontenChecklist = (item) => {
        if (item.brand_id !== 'b_konten' && item.status !== 'Konten') return null;
        const cl = item.checklist || { shoot: false, edit: false, upload: false };
        return (
          <div className="flex flex-wrap items-center gap-1.5 pt-1.5" onClick={e => e.stopPropagation()}>
            <button
              type="button"
              onClick={(e) => handleToggleChecklist(e, item.id, 'shoot')}
              className={`px-2.5 py-1 rounded-xl text-[10px] font-black border transition flex items-center gap-1 ${cl.shoot ? 'bg-emerald-500 text-white border-emerald-600 shadow-xs' : 'bg-slate-100 text-slate-600 border-slate-300'}`}
            >
              <span>{cl.shoot ? '✅' : '⬜'}</span><span>1. Take Video</span>
            </button>
            <button
              type="button"
              onClick={(e) => handleToggleChecklist(e, item.id, 'edit')}
              className={`px-2.5 py-1 rounded-xl text-[10px] font-black border transition flex items-center gap-1 ${cl.edit ? 'bg-amber-500 text-white border-amber-600 shadow-xs' : 'bg-slate-100 text-slate-600 border-slate-300'}`}
            >
              <span>{cl.edit ? '✅' : '⬜'}</span><span>2. Editing</span>
            </button>
            <button
              type="button"
              onClick={(e) => handleToggleChecklist(e, item.id, 'upload')}
              className={`px-2.5 py-1 rounded-xl text-[10px] font-black border transition flex items-center gap-1 ${cl.upload ? 'bg-purple-600 text-white border-purple-700 shadow-xs' : 'bg-slate-100 text-slate-600 border-slate-300'}`}
            >
              <span>{cl.upload ? '🚀' : '⬜'}</span><span>3. Done Upload</span>
            </button>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-bold animate-bounce border border-slate-700">
              <span>{toast}</span>
            </div>
          )}

          {/* HEADER UTAMA */}
          <header className="bg-maroon text-white px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center font-black text-rose-300 text-xl border border-white/20 shadow-inner">
                ✨
              </div>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <h1 className="font-extrabold text-base tracking-wide">Alisya Schedule</h1>
                  <span className="bg-white/15 text-rose-200 border border-white/25 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold tracking-wider">
                    v6.1-Ultra PRO
                  </span>
                  {isAdmin ? (
                    <span className="bg-amber-400 text-amber-950 px-2 py-0.5 rounded-md text-[10px] font-black shadow">👑 ADMIN</span>
                  ) : (
                    <span className="bg-white/20 text-rose-100 px-2 py-0.5 rounded-md text-[10px] font-semibold">👀 VIEWER</span>
                  )}
                  <span className="flex items-center gap-1 text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full font-bold">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Live Cloud</span>
                  </span>
                </div>
              </div>
            </div>

            {/* 🌐 3 BAHASA, TEMA MALAM, ALARM & MODE TAMPILAN */}
            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex items-center bg-black/30 px-2.5 py-1.5 rounded-2xl border border-white/10 shadow-inner">
                <span className="text-xs mr-1.5">🌐</span>
                <select
                  value={lang}
                  onChange={(e) => handleSetLang(e.target.value)}
                  className="bg-transparent text-white font-extrabold text-xs border-none focus:outline-none cursor-pointer"
                >
                  <option value="id" className="bg-slate-900 text-white">🇮🇩 Indonesia</option>
                  <option value="en" className="bg-slate-900 text-white">🇬🇧 English</option>
                  <option value="zh" className="bg-slate-900 text-white">🇨🇳 中文</option>
                </select>
              </div>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className={`px-3 py-1.5 rounded-2xl text-xs font-black border transition flex items-center gap-1 ${darkMode ? 'bg-amber-400 text-slate-900 border-amber-300 shadow' : 'bg-black/30 text-rose-100 border-white/10 hover:bg-black/40'}`}
                title="Dark / Light Mode"
              >
                <span>{darkMode ? '☀️' : '🌙'}</span>
                <span className="hidden sm:inline">{darkMode ? 'Light' : 'Dark'}</span>
              </button>

              <button
                onClick={toggleSoundAlert}
                className={`px-3 py-1.5 rounded-2xl text-xs font-black border transition flex items-center gap-1 ${soundAlert ? 'bg-emerald-500/30 text-emerald-200 border-emerald-400/40' : 'bg-black/30 text-rose-200/60 border-white/10'}`}
                title="Sound Reminder"
              >
                <span>{soundAlert ? '🔔' : '🔕'}</span>
              </button>

              <div className="flex items-center bg-black/30 p-1 rounded-2xl border border-white/10 shadow-inner">
                <button
                  onClick={() => handleSetDisplayMode('mobile')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${displayMode === 'mobile' ? 'bg-white text-maroon shadow-md' : 'text-rose-100 hover:text-white'}`}
                >
                  <span>📱</span><span>{t.modeHP}</span>
                </button>
                <button
                  onClick={() => handleSetDisplayMode('pc')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${displayMode === 'pc' ? 'bg-white text-maroon shadow-md' : 'text-rose-100 hover:text-white'}`}
                >
                  <span>💻</span><span>{t.modePC}</span>
                </button>
              </div>
            </div>

            {/* NAVIGASI BULAN & TAHUN */}
            <div className="flex items-center gap-2">
              <div className="flex items-center bg-white/10 rounded-2xl p-1 text-xs font-bold border border-white/20 shadow-sm gap-1">
                <button
                  onClick={() => currentMonth === 0 ? (setCurrentMonth(11), setCurrentYear(y => y-1)) : setCurrentMonth(m => m-1)}
                  className="px-2 py-1 hover:bg-white/20 rounded-xl active:scale-95 transition"
                >
                  ◀
                </button>

                <select
                  value={currentMonth}
                  onChange={e => setCurrentMonth(Number(e.target.value))}
                  className="bg-black/30 text-white font-extrabold text-xs px-2 py-1 rounded-xl border border-white/20 focus:outline-none focus:ring-1 focus:ring-rose-300 cursor-pointer"
                >
                  {Array.from({ length: 12 }).map((_, idx) => (
                    <option key={idx} value={idx} className="bg-slate-900 text-white">
                      {new Intl.DateTimeFormat(t.locale, { month: 'short' }).format(new Date(2026, idx, 1))}
                    </option>
                  ))}
                </select>

                <select
                  value={currentYear}
                  onChange={e => setCurrentYear(Number(e.target.value))}
                  className="bg-black/30 text-white font-mono font-extrabold text-xs px-2 py-1 rounded-xl border border-white/20 focus:outline-none focus:ring-1 focus:ring-rose-300 cursor-pointer"
                >
                  {[2024, 2025, 2026, 2027, 2028, 2029, 2030].map(yr => (
                    <option key={yr} value={yr} className="bg-slate-900 text-white">
                      {yr}
                    </option>
                  ))}
                </select>

                <button
                  onClick={() => currentMonth === 11 ? (setCurrentMonth(0), setCurrentYear(y => y+1)) : setCurrentMonth(m => m+1)}
                  className="px-2 py-1 hover:bg-white/20 rounded-xl active:scale-95 transition"
                >
                  ▶
                </button>
              </div>

              {isAdmin ? (
                <button onClick={() => { setIsAdmin(false); notify('🔒 Locked'); }} className="bg-rose-950 hover:bg-black text-rose-200 px-3 py-1.5 rounded-xl text-xs font-bold shadow active:scale-95 transition">
                  🔒 {t.lockBtn}
                </button>
              ) : (
                <button onClick={() => setPinInputModal(true)} className="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition shadow">
                  <span>🔑</span><span>{t.loginBtn}</span>
                </button>
              )}
            </div>
          </header>

          {/* ========================================================= */}
          {/* 🌟 1. TAMPILAN MODE PC / DESKTOP                          */}
          {/* ========================================================= */}
          {displayMode === 'pc' && (
            <div className="flex-1 flex flex-col">
              <div className="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-between shadow-sm sticky top-[60px] z-30">
                <div className="flex items-center gap-2 text-xs font-extrabold">
                  <button
                    onClick={() => setPcSubTab('agenda')}
                    className={`px-4 py-2 rounded-xl transition flex items-center gap-2 ${pcSubTab === 'agenda' ? 'bg-maroon text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>📱</span><span>{t.tabAgenda}</span>
                  </button>
                  <button
                    onClick={() => setPcSubTab('calendar')}
                    className={`px-4 py-2 rounded-xl transition flex items-center gap-2 ${pcSubTab === 'calendar' ? 'bg-maroon text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>📅</span><span>{t.tabSpreadsheet}</span>
                  </button>
                  <button
                    onClick={() => setPcSubTab('dashboard')}
                    className={`px-4 py-2 rounded-xl transition flex items-center gap-2 ${pcSubTab === 'dashboard' ? 'bg-maroon text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>📊</span><span>{t.tabKPI}</span>
                  </button>
                  <button
                    onClick={() => setPcSubTab('list')}
                    className={`px-4 py-2 rounded-xl transition flex items-center gap-2 ${pcSubTab === 'list' ? 'bg-maroon text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>📋</span><span>{t.tabList}</span>
                  </button>
                  <button
                    onClick={() => setPcSubTab('colors')}
                    className={`px-4 py-2 rounded-xl transition flex items-center gap-2 ${pcSubTab === 'colors' ? 'bg-maroon text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>🎨</span><span>{t.tabColors}</span>
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={exportCSV}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 active:scale-95"
                  >
                    <span>📥</span><span>{t.btnExportCSV}</span>
                  </button>

                        <span className="text-[9px] text-slate-500">00:00 - 07:00</span>

                    <div className="flex items-center justify-between">
                      <span className="font-black text-cyan-950 flex items-center gap-1.5 text-[11px]">

                      </div>
                    ) : (
                      <div className="flex items-end pb-2 text-[10px] text-slate-400 italic">
                        {t.modalEditTitle}
                      </div>
                    )}
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartHour}</label>
                      <select
                        required
                        value={formData.start_time}
                        onChange={e => setFormData({ ...formData, start_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {START_TIME_OPTIONS.map(tm => (
                          <option key={tm} value={tm}>{tm}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formEndHour}</label>
                      <select
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {END_TIME_OPTIONS.map(tm => (
                          <option key={tm} value={tm}>{tm}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formNotes}</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 font-medium"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 font-extrabold hover:underline">
                        {t.deleteSchBtn}
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl font-bold">
                        {t.cancelBtn}
                      </button>
                      <button type="submit" className="bg-maroon text-white px-5 py-2.5 rounded-2xl font-black shadow active:scale-95 transition">
                        {t.saveCloudBtn}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
