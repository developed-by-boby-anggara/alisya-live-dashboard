    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (end === '23:59') {
        eh = 24;
        em = 0;
      }
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
        if (diff > 1440) diff = 120;
      }
      return Math.round((diff / 60) * 10) / 10;
    };

    const addDaysToDateStr = (dateStr, daysToAdd) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysToAdd);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

 const playNotificationChime = () => {
   try {
     const ctx = new (window.AudioContext || window.webkitAudioContext)();
     const now = ctx.currentTime;

     // Rangkaian nada kristal Evol (E5 -> G#5 -> B5 -> D#6 -> F#6)
     const notes = [
       { freq: 659.25, delay: 0.00, dur: 0.45, vol: 0.11 },
       { freq: 830.61, delay: 0.07, dur: 0.50, vol: 0.12 },
       { freq: 987.77, delay: 0.14, dur: 0.60, vol: 0.13 },
       { freq: 1244.51, delay: 0.21, dur: 0.75, vol: 0.10 },
       { freq: 1479.98, delay: 0.28, dur: 0.95, vol: 0.08 }
     ];

     notes.forEach(({ freq, delay, dur, vol }) => {
       const osc = ctx.createOscillator();
       const shimmer = ctx.createOscillator();
       const gain = ctx.createGain();

       osc.type = 'sine';
       osc.frequency.setValueAtTime(freq, now + delay);

       // Efek kilau lembut (octave harmonic) khas UI Love and Deepspace
       shimmer.type = 'triangle';
       shimmer.frequency.setValueAtTime(freq * 2, now + delay);

       const shimmerGain = ctx.createGain();
       shimmerGain.gain.setValueAtTime(0.025, now + delay);
       shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);

       gain.gain.setValueAtTime(0.001, now + delay);
       gain.gain.linearRampToValueAtTime(vol, now + delay + 0.02);
       gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);

       osc.connect(gain);
       shimmer.connect(shimmerGain);
       shimmerGain.connect(gain);
       gain.connect(ctx.destination);

       osc.start(now + delay);
       shimmer.start(now + delay);
       osc.stop(now + delay + dur + 0.02);
       shimmer.stop(now + delay + dur + 0.02);
     });
   } catch (e) {
     console.log("Audio chime error:", e);
   }
 };

          return !existingOnTarget.some(ex => {

        if (eMin <= sMin) {
          notify('⛔ Jam Selesai harus lebih besar dari Jam Mulai!');
          return;
        }

        const brandObj = brands.find(b => b.id === formData.brand_id);
        const basePayload = { ...formData, color: brandObj?.color || formData.color };

        if (selectedSchedule) {
          const conflict = getRangeConflictOnFormDate(basePayload.start_time, basePayload.end_time);
          if (conflict) {
            notify(`⛔ Tidak bisa disimpan! Bentrok dengan "${conflict.title}" (${conflict.start_time}-${conflict.end_time}).`);
            return;
          }
          saveSchedulesToCloud(schedules.map(s => s.id === selectedSchedule.id ? basePayload : s));
          notify('✨ Jadwal berhasil diperbarui!');

          const newItems = [];

            const targetDate = i === 0 ? basePayload.date : addDaysToDateStr(basePayload.date, i);

            const hasConflict = daySchedules.some(ex => {

              let exE = timeToMinutes(ex.end_time);
              if (exE <= exS) exE = 24 * 60;
              return sMin < exE && eMin > exS;

              skippedDates.push(targetDate);

              newItems.push({

            <div className="flex flex-col gap-1 min-w-0 flex-1 w-full">

        const mekelFood = currentDayWellness.mekelFood || 0;
        const mekelFoodLogs = Array.isArray(currentDayWellness.mekelFoodLogs) ? currentDayWellness.mekelFoodLogs : [];
        const mekelWater = currentDayWellness.mekelWater || 0;
        const mekelWaterLogs = Array.isArray(currentDayWellness.mekelWaterLogs) ? currentDayWellness.mekelWaterLogs : [];

        const prep = currentDayWellness.prep || { makeup: false, bath: false, perfume: false, battery: false };
        const prepDoneCount = [prep.makeup, prep.bath, prep.perfume, prep.battery].filter(Boolean).length;
        const allPrepDone = prepDoneCount === 4;

                <span className="text-[10px] font-bold text-pink-700 bg-pink-50 px-2 py-0.5 rounded-full border border-pink-200">

                  onClick={() => setWellnessOpen(!wellnessOpen)}

                      <span className="text-xs font-extrabold text-[#F3F5F7] group-hover:text-[#42D6C5] transition">

                    <div className="flex items-center gap-2 shrink-0">
                      <span className="font-mono text-[10px] font-black text-[#B99BEB]">

                      <span className="text-[10px] font-black text-[#42D6C5] bg-[#071525]/80 px-2 py-0.5 rounded-lg border border-[#42D6C5]/30">

                {/* ⏳ RAFAYEL'S TIDE TIMER (FOKUS & ISTIRAHAT REAL-TIME) */}
             <div className="bg-[#061224] border border-cyan-400/35 rounded-2xl p-3 space-y-2.5">
               <div className="flex items-center justify-between gap-2">

                   ⏳ {lang === 'en' ? "Rafayel's Tide Timer" : "Timer Pasang Surut Lemuria"}
                 </span>
                 <div className="flex items-center gap-1">
                   <button type="button" onClick={() => selectTidePreset('focus', 25)} className={`px-2 py-0.5 rounded-lg text-[9px] font-black border ${tideTimerMode === 'focus' ? 'bg-cyan-500 text-slate-950 border-cyan-300' : 'bg-slate-900 text-slate-300 border-slate-700'}`}>
                     🎬 25m
                   </button>
                   <button type="button" onClick={() => selectTidePreset('live', 45)} className={`px-2 py-0.5 rounded-lg text-[9px] font-black border ${tideTimerMode === 'live' ? 'bg-teal-500 text-slate-950 border-teal-300' : 'bg-slate-900 text-slate-300 border-slate-700'}`}>
                     📡 45m

                   <button type="button" onClick={() => selectTidePreset('break', 15)} className={`px-2 py-0.5 rounded-lg text-[9px] font-black border ${tideTimerMode === 'break' ? 'bg-purple-500 text-white border-purple-300' : 'bg-slate-900 text-slate-300 border-slate-700'}`}>
                     ☕ 15m
                   </button>
                 </div>
               </div>
               <div className="flex items-center justify-between gap-3 bg-black/40 px-3 py-2 rounded-xl border border-cyan-500/20">

                   {formatSecondsToMS(tideTimerSeconds)}
                 </span>
                 <div className="flex items-center gap-1.5">
                   <button
                     type="button"
                     onClick={() => setTideTimerRunning(!tideTimerRunning)}
                     className={`px-3 py-1.5 rounded-xl text-[10px] font-black transition active:scale-95 ${tideTimerRunning ? 'bg-amber-500 text-slate-950' : 'bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-950'}`}
                   >
                     {tideTimerRunning ? '⏸ Pause' : '▶ Mulai'}
                   </button>
                   <button
                     type="button"
                     onClick={() => selectTidePreset(tideTimerMode, tideTimerMode === 'focus' ? 25 : tideTimerMode === 'live' ? 45 : 15)}

                   >
                     ↺
                   </button>
                 </div>
               </div>
             </div>
                {/* 5 Pilihan Mood Hari Ini */}

                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-black text-maroon uppercase tracking-wider">{t.beautyPrepTitle}</span>
                    <span className="text-[10px] font-mono font-black text-pink-600">

                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5">

                          <span className="truncate">{item.label}</span>
                          <span>{done ? '✅' : '⬜'}</span>

                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
                      <div className="w-12 h-12 rounded-2xl bg-white border-2 border-pink-200 flex items-center justify-center text-2xl shadow-2xs cute-float shrink-0">
                        {(mekelFood >= 2 && mekelWater >= 2) ? '😻' : '🐱'}
                      </div>
                      <div className="space-y-0.5">
                        <div className="text-xs font-black text-maroon flex items-center gap-1.5 flex-wrap">

                    <button

                      }}
                      className="bg-white hover:bg-pink-100 text-maroon border border-pink-300 font-black text-[10px] px-2.5 py-1.5 rounded-xl shadow-2xs active:scale-90 transition shrink-0"

                        <span className="font-mono font-black text-amber-700 bg-amber-50 px-1.5 py-0.2 rounded border border-amber-200">
                          {mekelFood}/3 🐟
                        </span>
                      </div>
                      <div className="grid grid-cols-3 gap-1">

                          const fed = idx < mekelFood;
                          const fLog = mekelFoodLogs[idx];
                          return (
                            <button

                              type="button"
                              onClick={() => handleFeedMekelFood(idx + 1 === mekelFood ? idx : idx + 1)}
                              className={`py-1.5 rounded-lg border text-center transition flex flex-col items-center justify-center active:scale-90 ${fed ? 'bg-amber-400 text-amber-950 border-amber-500 font-black shadow-2xs' : 'bg-slate-50 border-slate-200 text-slate-400'}`}
                            >
                              <span className="text-xs leading-none">{fed ? '🐟' : '🍽️'}</span>
                              <span className="text-[8px] font-mono mt-0.5">{fLog || `#${idx + 1}`}</span>
                            </button>
                          );
                        })}
                      </div>
                      <button
                        type="button"
                        onClick={() => handleFeedMekelFood(Math.min(3, mekelFood + 1))}

                      >
                        + {t.petFeedFoodBtn}
                      </button>
                    </div>

                    {/* Mangkuk Minum Mekel */}
                    <div className="bg-white/90 border border-pink-200 rounded-xl p-2.5 space-y-2">
                      <div className="flex items-center justify-between text-[10px]">
                        <span className="font-black text-sky-900">{t.petWaterLabel}</span>
                        <span className="font-mono font-black text-sky-700 bg-sky-50 px-1.5 py-0.2 rounded border border-sky-200">
                          {mekelWater}/3 🥛
                        </span>
                      </div>
                      <div className="grid grid-cols-3 gap-1">
                        {Array.from({ length: 3 }).map((_, idx) => {
                          const watered = idx < mekelWater;
                          const wLog = mekelWaterLogs[idx];
                          return (
                            <button
                              key={idx}
                              type="button"
                              onClick={() => handleGiveMekelWater(idx + 1 === mekelWater ? idx : idx + 1)}
                              className={`py-1.5 rounded-lg border text-center transition flex flex-col items-center justify-center active:scale-90 ${watered ? 'bg-sky-400 text-white border-sky-500 font-black shadow-2xs' : 'bg-slate-50 border-slate-200 text-slate-400'}`}
                            >
                              <span className="text-xs leading-none">{watered ? '🥛' : '🥣'}</span>
                              <span className="text-[8px] font-mono mt-0.5">{wLog || `#${idx + 1}`}</span>
                            </button>
                          );
                        })}
                      </div>
                      <button
                        type="button"
                        onClick={() => handleGiveMekelWater(Math.min(3, mekelWater + 1))}
                        className="w-full bg-sky-100 hover:bg-sky-200 text-sky-950 border border-sky-300 font-black text-[10px] py-1.5 rounded-lg transition active:scale-95"
                      >
                        + {t.petFeedWaterBtn}
                      </button>
                    </div>
                  </div>
                </div>

                {/* 💧 PANEL HIDRASI PINTAR, PENGINGAT WAKTU & RIWAYAT JAM MINUM */}
                <div className="bg-gradient-to-br from-pink-50 via-rose-50/70 to-sky-50/60 border-2 border-pink-200/80 rounded-2xl p-3.5 space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div className="text-xs font-black text-rose-950 flex items-center gap-1">
                        <span>{t.waterTitle}</span>
                      </div>
                      <div className="text-[10px] font-bold text-pink-700">
                        Total Hari Ini: <span className="font-black text-maroon">{waterCount} Kali Minum</span> ({waterMl} ml / 2.000 ml)
                      </div>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="font-mono font-black text-xs text-pink-700 bg-white px-2.5 py-1 rounded-xl border border-pink-200 shadow-2xs">
                        {waterCount} / 8 🥤
                      </span>
                      {waterCount > 0 && (
                        <button
                          type="button"
                          onClick={handleResetWaterToday}
                          className="text-[10px] font-bold text-rose-500 hover:underline px-1"

                          {t.waterResetBtn}
                        </button>
                      )}
                    </div>
                  </div>

                      style={{ width: `${waterPct}%` }}

                  </div>

                  <div className="grid grid-cols-8 gap-1.5">

                          onClick={() => handleDrinkWaterGlass(idx + 1 === waterCount ? idx : idx + 1)}
                          className={`h-11 rounded-xl border flex flex-col items-center justify-center transition active:scale-90 relative ${filled ? 'bg-gradient-to-b from-pink-400 to-rose-500 text-white border-rose-500 shadow-sm' : 'bg-white border-pink-200 text-slate-400 hover:border-pink-400'}`}

                          <span className="text-sm leading-none">{filled ? '🥤' : '🥛'}</span>
                          <span className={`text-[8px] font-mono font-black mt-0.5 ${filled ? 'text-pink-100' : 'text-slate-400'}`}>

                        </button>

                    })}
                  </div>

{/* 🔮 MINI-GAME: LEMURIAN WISH POOL (GACHA VOUCHER RAFAYEL) */}

                    }
                  }

                  const cardTheme = wonCard?.rarity?.includes('5★')
                    ? 'border-amber-400/70 bg-gradient-to-br from-[#1A1625] via-[#261D36] to-[#0E2438] shadow-[0_0_20px_rgba(251,191,36,0.25)]'
                    : wonCard?.rarity?.includes('4★')

                  </div>

                  <div className="space-y-1">

                      {isEn ? scenario.subtitleEn : scenario.subtitleId}

                    <div className="pt-1">
                      {isConnected ? (
                        <span className="font-mono text-sm font-black text-[#42D6C5] tracking-widest">

                        </span>
                      ) : (
                        <span className="text-xs font-semibold text-amber-200/90 tracking-widest animate-pulse">
                          {isEn ? 'Calling you...' : 'Menghubungi...'}
                        </span>

                    </div>
                  </div>

                  {isConnected && (
                    <div className="w-full space-y-3 animate-in fade-in slide-in-from-bottom-2 duration-300">
                      <div className="flex items-center justify-center gap-1 h-7">
                        {[10, 18, 24, 14, 26, 20, 12, 24, 16, 22, 12, 18, 10].map((h, i) => (
                          <span
                            key={i}
                            style={{ animationDelay: `${i * 0.09}s`, height: `${h}px` }}
                            className="w-1 rounded-full bg-gradient-to-t from-[#42D6C5] to-[#B99BEB] rafayel-eq-bar"
                          ></span>
                        ))}
                      </div>

                      <div className="bg-[#08172B]/80 backdrop-blur-md border border-[#42D6C5]/35 rounded-2xl px-4 py-3.5 text-left shadow-xl">
                        <div className="text-[10px] font-black text-[#42D6C5] uppercase tracking-wider mb-1">
                          Rafayel
                        </div>
                        <p className="text-xs sm:text-[13px] text-[#F3F5F7] leading-relaxed font-medium">
                          “{isEn ? scenario.transcriptEn : scenario.transcriptId}”
                        </p>
                      </div>
                    </div>
                  )}
                </div>

                {/* BAGIAN BAWAH: Tombol Kontrol Bulat Besar Ala Layar Panggilan L&D */}
                <div className="relative z-10 w-full max-w-xs pb-4">
                  {!isConnected ? (
                    <div className="flex items-center justify-around">
                      <div className="flex flex-col items-center gap-2">
                        <button
                          type="button"
                          onClick={handleEndRafayelCall}
                          className="w-16 h-16 rounded-full bg-rose-500 hover:bg-rose-600 text-white text-2xl flex items-center justify-center shadow-[0_0_25px_rgba(244,63,94,0.55)] active:scale-90 transition cursor-pointer"
                          title={isEn ? 'Decline' : 'Tolak'}
                        >
                          📵
                        </button>
                        <span className="text-[11px] font-bold text-[#C7D5DE]">
                          {isEn ? 'Decline' : 'Tolak'}
                        </span>
                      </div>

                      <div className="flex flex-col items-center gap-2">
                        <button
                          type="button"
                          onClick={handleAcceptRafayelCall}
                          className="w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-[#42D6C5] hover:brightness-110 text-slate-950 text-2xl flex items-center justify-center shadow-[0_0_30px_rgba(66,214,197,0.75)] animate-bounce active:scale-90 transition cursor-pointer"
                          title={isEn ? 'Accept' : 'Terima'}
                        >
                          📞
                        </button>
                        <span className="text-[11px] font-bold text-[#42D6C5]">
                          {isEn ? 'Accept' : 'Angkat'}
                        </span>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center justify-around">
                      <div className="flex flex-col items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => triggerIncomingRafayelCall(currentCallScenario + 1)}
                          className="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white text-lg flex items-center justify-center active:scale-90 transition cursor-pointer"
                          title={isEn ? 'Next Topic' : 'Ganti Topik'}
                        >
                          🔀
                        </button>
                        <span className="text-[10px] font-semibold text-[#C7D5DE]">
                          {isEn ? 'Switch' : 'Ganti Topik'}
                        </span>
                      </div>

                      <div className="flex flex-col items-center gap-1.5">
                        <button
                          type="button"
                          onClick={handleEndRafayelCall}
                          className="w-16 h-16 rounded-full bg-rose-500 hover:bg-rose-600 text-white text-2xl flex items-center justify-center shadow-[0_0_25px_rgba(244,63,94,0.6)] active:scale-90 transition cursor-pointer"
                          title={isEn ? 'End Call' : 'Akhiri'}
                        >
                          📵
                        </button>
                        <span className="text-[11px] font-bold text-rose-300">
                          {isEn ? 'End Call' : 'Tutup'}
                        </span>
                      </div>

                      <div className="flex flex-col items-center gap-1.5">
                        <button
                          type="button"
                          onClick={handleAcceptRafayelCall}
                          className="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-[#42D6C5] text-lg flex items-center justify-center active:scale-90 transition cursor-pointer"
                          title={isEn ? 'Replay' : 'Ulangi'}
                        >
                          🔁
                        </button>
                        <span className="text-[10px] font-semibold text-[#C7D5DE]">
                          {isEn ? 'Replay' : 'Ulangi'}
                        </span>
                      </div>
                    </div>

              </div>
            );
          })()}

          {/* 📜 MODAL ARSIP SURAT & MEMORI AFFINITY RAFAYEL */}
          {affinityModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#071525] rounded-3xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col border border-[#42D6C5]/50 overflow-hidden animate-in zoom-in duration-150">
                <div className="bg-gradient-to-r from-[#071525] via-[#123C50] to-[#1E1B4B] p-4 border-b border-[#42D6C5]/35 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">📜</span>
                    <div>
                      <h3 className="font-black text-sm text-[#F3F5F7]">
                        {lang === 'en' ? "Rafayel's Lemurian Memory Archive" : "Arsip Surat & Memori Rafayel"}
                      </h3>
                      <p className="text-[10px] font-mono text-[#42D6C5]">
                        Current Bond: Affinity Lv.{rafayelAffinity.level} ({rafayelAffinity.totalExp} Total EXP)
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setAffinityModalOpen(false)}
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-[#F3F5F7] font-bold flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 text-xs">
                  {RAFAYEL_MILESTONE_LETTERS.map((letter) => {
                    const isUnlocked = rafayelAffinity.level >= letter.reqLevel;
                    return (
                      <div
                        key={letter.reqLevel}
                        className={`rounded-2xl p-3.5 border transition ${
                          isUnlocked
                            ? 'bg-[#0C2238]/90 border-[#42D6C5]/45 shadow-[0_4px_20px_rgba(66,214,197,0.12)]'
                            : 'bg-[#050E1A]/80 border-slate-700/60 opacity-65'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black ${
                            isUnlocked
                              ? 'bg-[#42D6C5]/20 text-[#42D6C5] border border-[#42D6C5]/40'
                              : 'bg-slate-800 text-slate-400 border border-slate-700'
                          }`}>
                            {isUnlocked ? `🔓 ${letter.badge}` : `🔒 Terkunci • Butuh Lv.${letter.reqLevel}`}
                          </span>
                        </div>

                        {isUnlocked ? (
                          <div className="flex items-start gap-3">
                            <img
                              src={letter.sticker}
                              alt="Rafayel Memory"
                              className="w-12 h-12 rounded-xl object-cover border border-[#B99BEB]/50 shrink-0"
                            />
                            <div className="space-y-1">
                              <div className="font-black text-sm text-[#B99BEB]">
                                {lang === 'en' ? letter.titleEn : letter.titleId}
                              </div>
                              <p className="text-[#C7D5DE] leading-relaxed italic">
                                "{lang === 'en' ? letter.bodyEn : letter.bodyId}"
                              </p>
                            </div>
                          </div>
                        ) : (
                          <p className="text-[11px] text-slate-400 italic">
                            {lang === 'en'
                              ? `Reach Affinity Level ${letter.reqLevel} by completing daily schedules, hydrating, and caring for Mekel to unlock this memory.`
                              : `Capai Affinity Level ${letter.reqLevel} dengan menyelesaikan jadwal, minum air, dan merawat Mekel untuk membuka surat ini.`}
                          </p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
          {/* MODAL PENGATURAN SLIDESHOW FOTO & VIDEO RADAR */}
          {radarMediaModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 space-y-4 border-2 border-pink-300 animate-in zoom-in duration-150">
                <div className="flex items-center justify-between">
                  <h3 className="font-black text-base text-[#6D2E46] flex items-center gap-2">
                    <span>🎬</span><span>Slideshow Foto & Video Radar</span>
                  </h3>
                  <button type="button" onClick={() => setRadarMediaModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Tempelkan link foto atau video (format <b>.mp4</b>) di sini (1 baris = 1 link). Media akan tampil transparan secara bergantian setiap <b>7 detik</b>! 🌊
                </p>
                <form onSubmit={handleSaveRadarMedia} className="space-y-3 text-xs">
                  <textarea
                    rows="6"
                    value={radarMediaInput}
                    onChange={e => setRadarMediaInput(e.target.value)}
                    placeholder={"https://drive.google.com/file/d/xxxx/view?usp=sharing\nhttps://example.com/video-aesthetic.mp4"}
                    className="w-full bg-pink-50/50 border border-pink-300 rounded-2xl p-3 font-mono text-[11px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                  ></textarea>
                  <div className="flex justify-between text-[10px] text-slate-500">
                    <span>Mendukung Foto & Video MP4 🎥</span>
                    <span>Berganti tiap 7 detik ✨</span>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button type="button" onClick={() => setRadarMediaModal(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold">
                      Batal
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black shadow">
                      💖 Simpan Media
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {/* MODAL SALIN 1 HARI PENUH (CLONE DAY) */}
          {cloneModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <h3 className="font-black text-base text-slate-800">{t.cloneModalTitle}</h3>
                <p className="text-xs text-slate-500">
                  {t.cloneModalDesc} <span className="font-black text-maroon">{selectedDate}</span> ({selectedDaySchedules.length} sesi):
                </p>
                <form onSubmit={handleCloneFullDay} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.cloneTargetLabel}</label>
                    <input
                      type="date"
                      required
                      value={cloneTargetDate}
                      onChange={e => setCloneTargetDate(e.target.value)}
                      className="w-full bg-pink-50/50 border border-pink-300 rounded-2xl px-3.5 py-2.5 text-xs font-bold"
                    />
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setCloneModalOpen(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.cloneConfirmBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL PIN ADMIN */}
          {pinInputModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 text-center space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <div className="w-12 h-12 rounded-2xl bg-teal-950/80 border border-teal-400 text-teal-300 flex items-center justify-center text-2xl mx-auto font-black shadow-inner">
  🔐
</div>
                <div>
                  <h3 className="font-black text-base text-slate-800">{t.adminAccessTitle}</h3>
                  <p className="text-xs text-slate-500 mt-1">{t.adminAccessDesc}</p>
                </div>
                <form onSubmit={handleVerifyPin} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    autoFocus
                    value={enteredPin}
                    onChange={e => { setEnteredPin(e.target.value); setPinError(false); }}
                    placeholder={t.pinPlaceholder}
                    className="w-full text-center text-xl tracking-widest font-mono font-black bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-maroon"
                  />
                  {pinError && <div className="text-rose-600 text-xs font-bold">{t.pinWrong}</div>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setPinInputModal(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.unlockBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FORM INPUT JADWAL DENGAN PROTEKSI JAM TERISI (ANTI-TUMPUK) */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
              <div className="bg-white rounded-t-3xl md:rounded-3xl shadow-2xl w-full max-w-md max-h-[92vh] overflow-y-auto border-2 border-pink-200 animate-in slide-in-from-bottom duration-200">
                <div className="bg-gradient-to-r from-maroon to-rose-800 text-white p-4 flex justify-between items-center sticky top-0 z-10">
                  <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                   <span>🔱</span>
<span>{selectedSchedule ? t.modalEditTitle : t.modalAddTitle}</span>
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>
                <form onSubmit={handleSave} className="p-5 space-y-3 text-xs">
                  {/* 🗓️ SMART WEEKLY ROUTINE: SALIN POLA 7 HARI SEBELUMNYA */}
                  {!selectedSchedule && (
                    <div className="bg-gradient-to-r from-[#071525] via-[#123C50]/60 to-[#1B183B] border border-[#42D6C5]/45 p-3 rounded-2xl flex items-center justify-between gap-2">
                      <div className="space-y-0.5">
                        <div className="text-[11px] font-black text-[#42D6C5] flex items-center gap-1.5">
                          <span>🗓️</span>
                          <span>{lang === 'en' ? 'Smart Weekly Template' : 'Isi Rutinitas 1 Minggu Otomatis'}</span>
                        </div>
                        <p className="text-[10px] text-[#C7D5DE]">
                          {lang === 'en'
                            ? `Copy full 7-day schedule from ${addDaysToDateStr(formData.date, -7)} starting ${formData.date}`
                            : `Salin seluruh pola jadwal 7 hari lalu mulai tgl ${formData.date}`}
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={handleApplyLastWeekTemplate}
                        className="bg-gradient-to-r from-[#42D6C5] to-[#B99BEB] text-slate-950 font-black text-[10px] px-3 py-2 rounded-xl shadow active:scale-95 transition shrink-0"
                      >
                        ⚡ {lang === 'en' ? 'Auto-Fill Week' : 'Isi 1 Minggu'}
                      </button>
                    </div>
                  )}
                  {/* 🍼 PRESET MOM UUNG DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-amber-950 flex items-center gap-1.5 text-[11px]">
                        <span>🍼</span><span>{t.presetMomUung}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-amber-200/70 text-amber-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "05:00", en: "13:00" },
                        { num: 2, st: "11:00", en: "19:00" },
                        { num: 3, st: "16:00", en: "23:59" },
                        { num: 4, st: "00:00", en: "07:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyMomUungPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-amber-300 hover:bg-amber-100 text-amber-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-emerald-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] bg-rose-100 text-rose-700 px-1.5 py-0.2 rounded font-sans font-black">{t.presetBlocked}</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 💧 PRESET AQUAPRESS DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-cyan-50 border border-cyan-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-cyan-950 flex items-center gap-1.5 text-[11px]">
                        <span>💧</span><span>{t.presetAquaPress}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-cyan-200/70 text-cyan-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-3 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "08:00", en: "12:00" },
                        { num: 2, st: "12:00", en: "16:00" },
                        { num: 3, st: "16:00", en: "20:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyAquaPressPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-cyan-300 hover:bg-cyan-100 text-cyan-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-cyan-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] text-rose-600">🔒</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 🔒 DAFTAR JAM YANG SUDAH TERISI DI TANGGAL INI */}
                  <div className="bg-pink-50/80 border border-pink-200 rounded-2xl p-2.5 space-y-1.5">
                    <div className="text-[10px] font-black text-maroon">{t.occupiedTimelineTitle}</div>
                    {existingSchedulesOnFormDate.length === 0 ? (
                      <div className="text-[10px] text-emerald-700 font-bold">{t.allFreeTimeline}</div>
                    ) : (
                      <div className="flex flex-wrap gap-1">
                        {existingSchedulesOnFormDate.map(s => (
                          <span key={s.id} className="bg-white border border-rose-200 text-rose-800 font-mono text-[10px] font-bold px-2 py-0.5 rounded-lg shadow-2xs">
                            🔒 {s.start_time}-{s.end_time} ({s.title})
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formTitleLabel}</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      placeholder="Shift Mom Uung / AquaPress / Me Time / Take Konten"
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-maroon focus:outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.catBrand} *</label>
                      <select
                        value={formData.brand_id}
                      onChange={e => {
  const newBrandId = e.target.value;
  let newStatus = formData.status;
  if (newBrandId === 'b_konten') newStatus = 'Konten';
  else if (newBrandId === 'b_sleep') newStatus = 'Tidur';
  else if (newBrandId === 'b_lainlain') newStatus = 'Me Time';
  else if (newBrandId === 'b_pribadi') newStatus = 'OFF';
  else if (newBrandId === 'b_sakit') newStatus = 'Sakit / Medis';
  else if (newBrandId === 'b_momuung' || newBrandId === 'b_aquapress' || newBrandId === 'b_moell') newStatus = 'LIVE';
  setFormData({ ...formData, brand_id: newBrandId, status: newStatus });
}}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        {brands.map(b => (
                          <option key={b.id} value={b.id}>
                            {b.emoji} {b.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.attStatus} *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        <option value="LIVE">🟢 LIVE</option>
                        <option value="Konten">🎬 Take Konten Video</option>
                        <option value="Tidur">😴 Tidur / Istirahat</option>
                        <option value="Me Time">💅 Me Time</option>
                        <option value="Meeting">💬 Meeting</option>
                        <option value="OFF">☕ OFF (Libur)</option>
                       <option value="Sakit / Medis">🤒 SAKIT / IZIN MEDIS</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartDate}</label>
                      <input
                        type="date"
                        required
                        value={formData.date}
                        onChange={e => setFormData({ ...formData, date: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      />
                    </div>
                    {!selectedSchedule ? (
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">{t.formRepeat}</label>
                        <select
                          value={repeatDays}
                          onChange={e => setRepeatDays(Number(e.target.value))}
                          className="w-full bg-pink-50 border border-pink-300 text-maroon rounded-2xl px-3 py-2.5 font-black"
                        >
                          <option value={1}>{t.rep1}</option>
                          <option value={2}>{t.rep2}</option>
                          <option value={3}>{t.rep3}</option>
                          <option value={5}>{t.rep5}</option>
                          <option value={7}>{t.rep7}</option>
                        </select>
                      </div>
                    ) : (
                      <div className="flex items-end pb-2 text-[10px] text-slate-400 italic">
                        {t.modalEditTitle}
                      </div>
                    )}
                  </div>
                  
                  {/* 🔒 DROPDOWN JAM MULAI & SELESAI YANG OTOMATIS MENGUNCI JAM TERISI */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartHour}</label>
                      <select
                        required
                        value={formData.start_time}
                        onChange={e => {
                          const newStart = e.target.value;
                          let newEnd = formData.end_time;
                          if (timeToMinutes(newEnd) <= timeToMinutes(newStart)) {
                            const nextIdx = END_TIME_OPTIONS.findIndex(tm => timeToMinutes(tm) > timeToMinutes(newStart));
                            if (nextIdx !== -1) newEnd = END_TIME_OPTIONS[nextIdx];
                          }
                          setFormData({ ...formData, start_time: newStart, end_time: newEnd });
                        }}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {START_TIME_OPTIONS.map(tm => {
                          const conflict = getStartTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict ? `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})` : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formEndHour}</label>
                      <select
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {END_TIME_OPTIONS.map(tm => {
                          const conflict = getEndTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict
                                ? (conflict.isInvalidOrder ? `${tm}` : `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})`)
                                : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                  </div>

                  {/* PERINGATAN JIKA RENTANG WAKTU MASIH BENTROK */}
                  {currentFormConflict && (
                    <div className="bg-rose-100 border-2 border-rose-400 text-rose-900 p-3 rounded-2xl text-xs font-extrabold flex items-center gap-2 animate-pulse">
                      <span className="text-lg">⛔</span>
                      <div>
                        <div>{t.overlapWarningTitle}</div>
                        <div className="text-[10px] font-bold">
                          {t.overlapWarningDesc} "{currentFormConflict.title}" ({currentFormConflict.start_time} - {currentFormConflict.end_time})
                        </div>
                      </div>
                    </div>
                  )}
{formData.status === 'LIVE' && (
                 <div className="bg-emerald-950/40 border border-emerald-500/40 p-3 rounded-2xl space-y-1">
                   <label className="block font-black text-emerald-300 text-[11px]">
                     💰 {lang === 'en' ? 'Actual GMV Achieved (Rp)' : 'Pencapaian Aktual GMV Live (Rp)'}
                   </label>
                   <input
                     type="number"
                     min="0"
                     step="1000"
                     value={formData.gmv || ''}
                     onChange={e => setFormData({ ...formData, gmv: e.target.value })}
                     placeholder="Contoh: 15000000"
                     className="w-full bg-slate-900 border border-emerald-400/50 rounded-xl px-3 py-2 font-mono font-black text-emerald-200 focus:outline-none"
                   />
                 </div>
               )}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formNotes}</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 font-medium"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 font-extrabold hover:underline">
                        {t.deleteSchBtn}
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl font-bold">
                        {t.cancelBtn}
                      </button>
                      <button
                        type="submit"
                        disabled={!!currentFormConflict}
                        className={`px-5 py-2.5 rounded-2xl font-black shadow transition ${currentFormConflict ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-maroon to-rose-700 text-white active:scale-95'}`}
                      >
                        {currentFormConflict ? '⛔ Jam Terisi' : `💖 ${t.saveCloudBtn}`}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 📲 REGISTRASI BACKGROUND SERVICE WORKER UNTUK HP
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Latar Belakang Aktif:', reg.scope))
          .catch((err) => console.error('Gagal aktivasi Service Worker:', err));
      });
    }
  </script>
</body>
</html>
