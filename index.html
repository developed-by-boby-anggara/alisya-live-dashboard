    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (end === '23:59') {
        eh = 24;
        em = 0;
      }
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
        if (diff > 1440) diff = 120;
      }
      return Math.round((diff / 60) * 10) / 10;
    };

    const addDaysToDateStr = (dateStr, daysToAdd) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysToAdd);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    // Fungsi Suara Notifikasi Lembut
    const playNotificationChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        const now = ctx.currentTime;
        playTone(587.33, now, 0.25);
        playTone(880.00, now + 0.2, 0.45);
      } catch (e) {
        console.log("Audio chime error:", e);
      }
    };

        };
        if (isFree(preferredStart, preferredEnd)) return { start: preferredStart, end: preferredEnd };
        for (const slot of TIME_SLOTS) {
          if (isFree(slot.start, slot.end)) return { start: slot.start, end: slot.end };
        }
        return { start: preferredStart, end: preferredEnd };
      };

      // 🌟 MESIN COUNTDOWN TIMER REAL-TIME PER DETIK (HH:MM:SS)
      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowTotalSeconds = nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();
        const toSec = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 3600;
          const [h, m] = tStr.split(':').map(Number);
          return h * 3600 + m * 60;
        };

        let activeItem = null;
        let nextItem = null;
        let completedCount = 0;

        todayList.forEach(item => {
          const sSec = toSec(item.start_time);
          let eSec = toSec(item.end_time);
          if (eSec <= sSec) eSec = 24 * 3600;

          if (nowTotalSeconds >= sSec && nowTotalSeconds < eSec) {
            const remSec = eSec - nowTotalSeconds;
            const totalDurSec = Math.max(1, eSec - sSec);
            const elapsedSec = nowTotalSeconds - sSec;
            const sessionPct = Math.min(100, Math.max(0, ((elapsedSec / totalDurSec) * 100).toFixed(1)));
            activeItem = {
              ...item,
              remainingSec: remSec,
              remainingHMS: formatSecondsToHMS(remSec),
              remainingMin: Math.ceil(remSec / 60),
              sessionPct
            };
          } else if (nowTotalSeconds >= eSec) {
            completedCount++;
          } else if (nowTotalSeconds < sSec && !nextItem) {
            const diffSec = sSec - nowTotalSeconds;
            nextItem = {
              ...item,
              startsInSec: diffSec,
              startsInHMS: formatSecondsToHMS(diffSec),
              startsInMin: Math.ceil(diffSec / 60)
            };
          }
        });

        let activeFraction = 0;
        if (activeItem) {
          activeFraction = Number(activeItem.sessionPct) / 100;
        }

        const progressPct = todayList.length > 0
          ? Math.min(100, Math.round(((completedCount + activeFraction) / todayList.length) * 100))
          : 0;

        return { activeItem, nextItem, progressPct, totalToday: todayList.length, completedCount };
      }, [schedules, realTodayStr, nowTime]);

      // 🛡️ Burnout Guard: Deteksi Jeda Singkat (<5 jam) antar shift produktif
      const shortBreakWarnings = useMemo(() => {
        const map = {};
        const grouped = {};
        schedules.forEach(s => {
          if (s.status === 'Tidur' || s.brand_id === 'b_sleep' || s.status === 'OFF') return;
          if (!grouped[s.date]) grouped[s.date] = [];
          grouped[s.date].push(s);
        });

        Object.keys(grouped).forEach(date => {
          const list = grouped[date].sort((a, b) => a.start_time.localeCompare(b.start_time));
          for (let i = 0; i < list.length - 1; i++) {
            const endCurr = timeToMinutes(list[i].end_time);
            const startNext = timeToMinutes(list[i+1].start_time);
            const diffMin = startNext - endCurr;
            if (diffMin > 0 && diffMin < 300) {
              map[date] = true;
              break;
            }
          }
        });
        return map;
      }, [schedules]);

      const selectedDaySchedules = useMemo(() => {
        return schedules
          .filter(s => s.date === selectedDate)
          .sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, selectedDate]);

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {
          const sM = timeToMinutes(slot.start);
          const eM = timeToMinutes(slot.end);
          const isBusy = selectedDaySchedules.some(s => {
            const st = timeToMinutes(s.start_time);
            let en = timeToMinutes(s.end_time);
            if (en <= st) en = 24 * 60;
            return st < eM && en > sM;
          });
          return !isBusy;
        });
      }, [selectedDaySchedules]);

      const getDayScheduleDensity = (dateStr) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };

        const hasOff = dayShifts.some(s => s.status === 'OFF');
        if (hasOff) return { text: t.statusOff, badge: 'bg-rose-100 text-rose-800 border-rose-300' };

        let productiveHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') {
            productiveHours += calculateDurationHours(s.start_time, s.end_time);
          }
        });

        if (productiveHours >= 10) {
          return { text: t.statusFull, badge: 'bg-rose-500 text-white font-black shadow-sm' };
        }
        if (productiveHours >= 8) {
          return { text: t.statusMed, badge: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' };
        }
        if (productiveHours > 0) {
          return { text: t.statusLow, badge: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold' };
        }
        return { text: t.statusFree, badge: 'bg-pink-50 text-pink-700 border-pink-200' };
      };

      const filteredByStatPeriod = useMemo(() => {
        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);

          if (statPeriod === 'daily') {
            return s.date === customStatDate;
          } else if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const dayOfWeek = refDate.getDay();
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - dayOfWeek);
            startOfWeek.setHours(0,0,0,0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          } else if (statPeriod === 'monthly') {
            return sY === customStatYear && sM === (customStatMonth + 1);
          } else if (statPeriod === 'yearly') {
            return sY === customStatYear;
          }
          return true;
        });
      }, [schedules, statPeriod, customStatDate, customStatMonth, customStatYear]);

      const stats = useMemo(() => {
        let totalLive = 0, totalOff = 0, totalSick = 0, totalMeeting = 0, totalSleep = 0, totalMeTime = 0, totalKonten = 0;
        let totalLiveHours = 0, totalSleepHours = 0, totalKontenHours = 0, totalMeTimeHours = 0;

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);

          if (s.status === 'LIVE') {
            totalLive++;
            totalLiveHours += dur;
          } else if (s.status === 'OFF') {
            totalOff++;
          } else if (s.status === 'Sakit / Medis') {
            totalSick++;
          } else if (s.status === 'Meeting') {
            totalMeeting++;
          } else if (s.status === 'Tidur') {
            totalSleep++;
            totalSleepHours += (dur || 7);
          } else if (s.status === 'Konten' || s.brand_id === 'b_konten') {
            totalKonten++;
            totalKontenHours += dur;
          } else if (s.status === 'Me Time' || s.status === 'Lain-Lain' || s.brand_id === 'b_lainlain') {
            totalMeTime++;
            totalMeTimeHours += dur;
          }
        });

        if (statPeriod === 'daily') {
          totalLiveHours = Math.min(24, Math.round(totalLiveHours * 10) / 10);
          totalSleepHours = Math.min(24, Math.round(totalSleepHours * 10) / 10);
          totalKontenHours = Math.min(24, Math.round(totalKontenHours * 10) / 10);
        } else {
          totalLiveHours = Math.round(totalLiveHours * 10) / 10;
          totalSleepHours = Math.round(totalSleepHours * 10) / 10;
          totalKontenHours = Math.round(totalKontenHours * 10) / 10;
        }

        const perBrand = brands.map(b => {
          const list = filteredByStatPeriod.filter(s => s.brand_id === b.id);
          const liveCount = list.filter(s => s.status === 'LIVE').length;
          const offCount = list.filter(s => s.status === 'OFF').length;
          return { name: b.name, emoji: b.emoji, totalShift: list.length, liveCount, offCount, totalJam: liveCount * 2, color: b.color };
        });

        return { totalLive, totalOff, totalSick, totalMeeting, totalSleep, totalMeTime, totalKonten, totalLiveHours, totalSleepHours, totalKontenHours, totalMeTimeHours, perBrand };
      }, [filteredByStatPeriod, brands, statPeriod]);

      const balanceScoreData = useMemo(() => {
        const prodHours = stats.totalLiveHours + stats.totalKontenHours;
        if (statPeriod === 'daily' && prodHours >= 11) {
          return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        }
        if (prodHours > 85) {
          return { text: t.scoreBurnout, color: 'text-rose-700 bg-rose-50 border-rose-200' };
        }
        if (stats.totalSleepHours === 0 && prodHours > 8) {
          return { text: t.scoreWarning, color: 'text-amber-800 bg-amber-50 border-amber-200' };
        }
        return { text: t.scoreBalanced, color: 'text-emerald-800 bg-emerald-50 border-emerald-200' };
      }, [stats, statPeriod, t]);

      const periodLabel = useMemo(() => {
        if (statPeriod === 'daily') return `${getHariNama(customStatDate)}, ${customStatDate}`;
        if (statPeriod === 'weekly') {
          const [y, m, d] = customStatDate.split('-').map(Number);
          const ref = new Date(y, m - 1, d);
          const start = new Date(ref);
          start.setDate(ref.getDate() - ref.getDay());
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          return `${start.getDate()} - ${end.getDate()} ${new Intl.DateTimeFormat(t.locale, { month: 'short' }).format(end)} ${end.getFullYear()}`;
        }
        if (statPeriod === 'monthly') {
          const mLabel = new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(customStatYear, customStatMonth, 1));
          return `${mLabel} ${customStatYear}`;
        }
        if (statPeriod === 'yearly') return `${t.yearLabel} ${customStatYear}`;
        return '';
      }, [statPeriod, customStatDate, customStatMonth, customStatYear, t]);

      const filteredSchedules = useMemo(() => {
        return schedules.filter(s => {
          if (filterBrand !== 'ALL' && s.brand_id !== filterBrand) return false;
          if (filterStatus !== 'ALL' && s.status !== filterStatus) return false;
          if (filterDate && s.date !== filterDate) return false;
          if (filterHour !== 'ALL') {
            const startHour = parseInt(s.start_time.split(':')[0], 10);
            const targetHour = parseInt(filterHour, 10);
            if (startHour !== targetHour) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const bName = brands.find(b => b.id === s.brand_id)?.name.toLowerCase() || '';
            const matchTitle = s.title.toLowerCase().includes(q);
            const matchNotes = (s.notes || '').toLowerCase().includes(q);
            const matchBrand = bName.includes(q);
            const matchDate = s.date.includes(q);
            if (!matchTitle && !matchNotes && !matchBrand && !matchDate) return false;
          }
          return true;
        });
      }, [schedules, filterBrand, filterStatus, filterDate, filterHour, searchQuery, brands]);

      const donutCanvas = useRef(null);

      const barInst = useRef(null);

      useEffect(() => {
        const shouldRenderCharts = (displayMode === 'mobile' && activeTab === 'kpi') || (displayMode === 'pc' && pcSubTab === 'dashboard');
        if (!shouldRenderCharts) return;

        if (donutCanvas.current) {

                data: [stats.totalLive, stats.totalKonten, stats.totalSleep, stats.totalMeTime, stats.totalOff, stats.totalMeeting],

            },

          });
        }
        if (barCanvas.current) {

          barInst.current = new Chart(barCanvas.current, {
            type: 'bar',
            data: {
              labels: stats.perBrand.map(b => b.name),
              datasets: [
                { label: '🟢 Shift / Session', data: stats.perBrand.map(b => b.totalShift), backgroundColor: '#B6D7A8' }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
          });
        }
      }, [displayMode, activeTab, pcSubTab, stats]);

      // Cek Pengingat Alarm 15 Menit Sebelum Mulai
      useEffect(() => {
        if (!soundAlert || !liveTracker.nextItem) return;
        const { nextItem } = liveTracker;
        if (nextItem.startsInMin <= 15 && nextItem.startsInMin > 0) {

            notify(`🔔 "${nextItem.title}" (${nextItem.start_time}) - ${nextItem.startsInMin} ${t.minUnit}!`);
          }
        }
      }, [liveTracker, soundAlert, realTodayStr, t.minUnit]);

      const handleToggleChecklist = (e, itemId, stepKey) => {
        e.stopPropagation();
        if (!isAdmin) { setPinInputModal(true); return; }
        const updated = schedules.map(s => {
          if (s.id === itemId) {

      const handleCloneFullDay = (e) => {

        if (!isAdmin) { setPinInputModal(true); return; }
        if (selectedDaySchedules.length === 0) {
          notify('⚠️ Tidak ada jadwal di tanggal ini untuk disalin.');

          return;
        }
        // Hanya salin jadwal yang tidak bertumpuk di tanggal tujuan
        const existingOnTarget = schedules.filter(s => s.date === cloneTargetDate);
        const nonConflicting = selectedDaySchedules.filter(item => {
          const sM = timeToMinutes(item.start_time);
          let eM = timeToMinutes(item.end_time);
          if (eM <= sM) eM = 24 * 60;
          return !existingOnTarget.some(ex => {
            const exS = timeToMinutes(ex.start_time);
            let exE = timeToMinutes(ex.end_time);
            if (exE <= exS) exE = 24 * 60;
            return sM < exE && eM > exS;
          });
        });

        if (nonConflicting.length === 0) {
          notify('⛔ Semua jam di tanggal tujuan sudah terisi! Tidak bisa menumpuk jadwal.');

        }));

      const exportElementAsPNG = async (elementId, filenameLabel) => {

          });

      const handleVerifyPin = (e) => {

      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {

        });

      };

      // Jika duplikasi di hari yang sama, arahkan ke modal edit agar bisa pilih jam kosong dan tidak menumpuk
      const handleDuplicate = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }

        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({

      const applyMomUungPreset = (shiftNum, start, end) => {

        if (conflict) {

        }));

      // Validasi Ketat Anti-Tumpuk Saat Simpan
      const handleSave = (e) => {
        e.preventDefault();
        const sMin = timeToMinutes(formData.start_time);
        const eMin = timeToMinutes(formData.end_time);

        if (eMin <= sMin) {
          notify('⛔ Jam Selesai harus lebih besar dari Jam Mulai!');
          return;
        }

        const brandObj = brands.find(b => b.id === formData.brand_id);
        const basePayload = { ...formData, color: brandObj?.color || formData.color };

        if (selectedSchedule) {
          const conflict = getRangeConflictOnFormDate(basePayload.start_time, basePayload.end_time);
          if (conflict) {
            notify(`⛔ Tidak bisa disimpan! Bentrok dengan "${conflict.title}" (${conflict.start_time}-${conflict.end_time}).`);
            return;
          }
          saveSchedulesToCloud(schedules.map(s => s.id === selectedSchedule.id ? basePayload : s));
          notify('✨ Jadwal berhasil diperbarui!');
        } else {
          const newItems = [];
          const skippedDates = [];

          for (let i = 0; i < count; i++) {

            const daySchedules = schedules.filter(s => s.date === targetDate);
            const hasConflict = daySchedules.some(ex => {
              const exS = timeToMinutes(ex.start_time);
              let exE = timeToMinutes(ex.end_time);
              if (exE <= exS) exE = 24 * 60;
              return sMin < exE && eMin > exS;
            });

            if (hasConflict) {
              skippedDates.push(targetDate);
            } else {
              newItems.push({
                ...basePayload,
                id: 'sch_' + Date.now() + '_' + i,
                date: targetDate
              });

      const exportCSV = () => {

        const rows = schedules.map(s => [
          `"${getHariNama(s.date)}"`,
          s.date,
          s.start_time,
          s.end_time,
          `"${s.title.replace(/"/g, '""')}"`,
          `"${(brands.find(b => b.id === s.brand_id)?.name || s.brand_id).replace(/"/g, '""')}"`,

          `"${(s.notes || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');

                              className={`bg-white rounded-3xl p-4 border-2 shadow-sm flex items-start justify-between gap-3 active:scale-[0.98] transition cursor-pointer relative overflow-hidden ${isCurrentlyLive ? 'border-emerald-500 ring-2 ring-emerald-400/50 live-card-glow' : 'border-pink-200/70'}`}
                            >
                              <div className="w-2 absolute left-0 top-0 bottom-0" style={{ backgroundColor: item.color }}></div>
                              <div className="space-y-1.5 pl-2 flex-1">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <span className="font-mono text-[11px] font-black text-slate-900 bg-pink-50 border border-pink-200 px-2 py-0.5 rounded-lg">
                                    ⏰ {item.start_time} - {item.end_time}
                                  </span>
                                  {isCurrentlyLive && (
                                    <span className="bg-emerald-500 text-white text-[9px] font-mono font-black px-2 py-0.5 rounded-lg flex items-center gap-1">
                                      <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                                      <span>-{liveTracker.activeItem.remainingHMS}</span>
                                    </span>
                                  )}
                                  <span className="text-[9px] font-black px-2 py-0.5 rounded-lg uppercase" style={{ backgroundColor: item.color + '44', color: '#0F172A' }}>
                                    {item.status}
                                  </span>
                                  <span className="text-[11px] font-bold text-slate-600 flex items-center gap-1">
                                    <span>{brand?.emoji}</span><span>{brand?.name}</span>
                                  </span>
                                </div>
                                <div className="font-black text-sm text-slate-900 leading-snug">{item.title}</div>
                                {item.notes && (
                                  <div className="bg-pink-50/70 border border-pink-200 p-2 rounded-xl text-[10px] text-rose-900 italic">
                                    💌 {item.notes}
                                  </div>
                                )}
                                {renderKontenChecklist(item)}
                              </div>
                              {isAdmin && (
                                <div className="flex flex-col items-end gap-1">
                                  <span className="text-[11px] text-pink-600 font-extrabold">{t.editBtn} ❯</span>
                                  <button onClick={(e) => { e.stopPropagation(); handleDuplicate(item); }} className="text-[9px] text-slate-500 font-bold bg-pink-50 px-2 py-0.5 rounded-lg">
                                    📋
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* SPREADSHEET MODE HP */}
                {activeTab === 'calendar' && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={shareSpreadsheetToWA}
                        className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-2xl text-xs font-black shadow flex items-center justify-center gap-1.5 active:scale-95 transition"
                      >
                        <span>📲</span><span>{t.btnShareWA}</span>
                      </button>
                      <button
                        onClick={() => exportElementAsPNG('mobile-spreadsheet-capture', `${monthName}_${currentYear}`)}
                        className="bg-maroon hover:bg-maroon-dark text-white px-3 py-2 rounded-2xl text-xs font-black shadow flex items-center justify-center gap-1.5 active:scale-95 transition"
                      >
                        <span>📸</span><span>{t.btnSavePNG}</span>
                      </button>
                    </div>

                    <div id="mobile-spreadsheet-capture" className="bg-white rounded-3xl border-2 border-pink-200/70 shadow-sm overflow-hidden flex flex-col">
                      <div className="overflow-x-auto relative" style={{ maxHeight: '70vh' }}>
                        <table className="w-full border-collapse text-xs select-none">
                          <thead>
                            <tr className="bg-maroon text-white sticky-header">
                              <th className="sticky-col bg-maroon px-3 py-2.5 text-left font-black border-b border-r border-rose-900 min-w-[150px]">🌸 {t.colDate}</th>
                              <th className="bg-maroon px-2 py-2.5 text-center font-bold border-b border-r border-rose-900 min-w-[90px]">{t.colStatus}</th>
                              {TIME_SLOTS.map(slot => (
                                <th key={slot.label} className="px-2 py-2.5 text-center font-mono font-bold border-b border-r border-rose-900 min-w-[85px] text-[10px]">
                                  {slot.start}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                              const day = i + 1;
                              const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                              const dayName = new Intl.DateTimeFormat(t.locale, { weekday: 'short' }).format(new Date(currentYear, currentMonth, day));
                              const isToday = dateStr === realTodayStr;
                              const density = getDayScheduleDensity(dateStr);

                              return (
                                <tr key={day} className={`border-b border-slate-200 ${isToday ? 'bg-pink-50/70' : ''}`}>
                                  <td className={`sticky-col px-3 py-2 border-r border-slate-200 whitespace-nowrap shadow-sm ${isToday ? 'bg-pink-100 text-maroon font-black' : 'bg-slate-50 font-bold'}`}>
                                    <div className="flex items-center gap-2">
                                      <span className="text-sm font-black text-slate-900">{day}</span>
                                      <span className="text-[11px] uppercase text-slate-800">{dayName}</span>
                                      {isToday && (
                                        <span className="bg-pink-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full shadow-xs">
                                          🎀 {t.todayBadge}
                                        </span>
                                      )}
                                    </div>
                                  </td>
                                  <td className="border-r border-slate-200 p-1 text-center whitespace-nowrap">
                                    <span className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${density.badge}`}>
                                      {density.text}
                                    </span>
                                  </td>
                                  {TIME_SLOTS.map(slot => {
                                    const sM = timeToMinutes(slot.start);
                                    const eM = timeToMinutes(slot.end);
                                    const slotItems = schedules.filter(s => {
                                      if (s.date !== dateStr) return false;
                                      const st = timeToMinutes(s.start_time);
                                      let en = timeToMinutes(s.end_time);
                                      if (en <= st) en = 24 * 60;
                                      return st < eM && en > sM;
                                    });

                                    return (
                                      <td
                                        key={slot.label}
                                        onClick={() => {
                                          if (slotItems.length > 0) handleOpenEdit(slotItems[0]);
                                          else handleOpenCreate(dateStr, slot.start, slot.end);
                                        }}
                                        className="border-r border-slate-200 p-0.5 align-top h-10 relative"
                                      >
                                        {slotItems.map(item => {
                                          const isStartSlot = (item.start_time >= slot.start && item.start_time < slot.end) || (slot.start === '00:00' && item.start_time === '00:00');
                                          return (
                                            <div
                                              key={item.id}
                                              onClick={(e) => { e.stopPropagation(); handleOpenEdit(item); }}
                                              className={`p-0.5 rounded font-bold text-[8px] text-slate-900 truncate mb-0.5 shadow-sm ${!isStartSlot ? 'opacity-85' : ''}`}
                                              style={{ backgroundColor: item.color }}
                                            >
                                              {isStartSlot ? item.title : `• ${item.title}`}
                                            </div>
                                          );
                                        })}
                                      </td>
                                    );
                                  })}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* STATISTIK MODE HP */}
                {activeTab === 'kpi' && (
                  <div className="space-y-4">
                    <div className="bg-white p-3 rounded-2xl border-2 border-pink-200/70 shadow-sm space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-black text-slate-800">{t.statFilterTitle}</span>
                        <span className="font-bold text-maroon text-[11px] truncate">{periodLabel}</span>
                      </div>
                      <div className="grid grid-cols-4 gap-1 bg-pink-50 p-1 rounded-xl">
                        <button
                          onClick={() => setStatPeriod('daily')}
                          className={`py-1.5 rounded-lg text-[11px] font-bold transition ${statPeriod === 'daily' ? 'bg-maroon text-white shadow' : 'text-slate-600'}`}
                        >
                          {t.daily}
                        </button>
                        <button
                          onClick={() => setStatPeriod('weekly')}
                          className={`py-1.5 rounded-lg text-[11px] font-bold transition ${statPeriod === 'weekly' ? 'bg-maroon text-white shadow' : 'text-slate-600'}`}
                        >
                          {t.weekly}
                        </button>
                        <button
                          onClick={() => setStatPeriod('monthly')}
                          className={`py-1.5 rounded-lg text-[11px] font-bold transition ${statPeriod === 'monthly' ? 'bg-maroon text-white shadow' : 'text-slate-600'}`}
                        >
                          {t.monthly}
                        </button>
                        <button
                          onClick={() => setStatPeriod('yearly')}
                          className={`py-1.5 rounded-lg text-[11px] font-bold transition ${statPeriod === 'yearly' ? 'bg-maroon text-white shadow' : 'text-slate-600'}`}
                        >
                          {t.yearly}
                        </button>
                      </div>

                      <div className="pt-1">
                        {renderStatDateSelector()}
                      </div>
                    </div>

                    <div className={`p-4 rounded-3xl border-2 shadow-sm space-y-1 ${balanceScoreData.color}`}>
                      <div className="flex items-center gap-2">
                        <span>🛡️</span>
                        <h4 className="font-black text-xs uppercase">{t.balanceScore}</h4>
                      </div>
                      <p className="text-xs font-extrabold">{balanceScoreData.text}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                        <div className="text-[10px] font-bold text-slate-500 uppercase">🟢 {t.totalLive}</div>
                        <div className="text-3xl font-black text-emerald-600 mt-1">{stats.totalLive}</div>
                        <div className="text-[10px] text-slate-400 mt-1 font-bold">≈ {stats.totalLiveHours} {t.hoursLive}</div>
                      </div>
                      <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                        <div className="text-[10px] font-bold text-slate-500 uppercase">🎬 {t.takeKonten}</div>
                        <div className="text-3xl font-black text-purple-600 mt-1">{stats.totalKonten}</div>
                        <div className="text-[10px] text-slate-400 mt-1 font-bold">≈ {stats.totalKontenHours} {t.hoursProd}</div>
                      </div>
                      <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                        <div className="text-[10px] font-bold text-slate-500 uppercase">😴 {t.sleepTime}</div>
                        <div className="text-3xl font-black text-indigo-600 mt-1">{stats.totalSleep}</div>
                        <div className="text-[10px] text-slate-400 mt-1 font-bold">≈ {stats.totalSleepHours} {t.hoursSleep}</div>
                      </div>
                      <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                        <div className="text-[10px] font-bold text-slate-500 uppercase">💅 {t.meTime}</div>
                        <div className="text-3xl font-black text-pink-600 mt-1">{stats.totalMeTime}</div>
                        <div className="text-[10px] text-slate-400 mt-1">{t.hoursMeTime}</div>
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                      <h3 className="text-xs font-black text-slate-700 uppercase mb-2">🍩 {t.propTitle}</h3>
                      <div className="h-52 relative"><canvas ref={donutCanvas}></canvas></div>
                    </div>

                    <div className="bg-white p-4 rounded-3xl border-2 border-pink-200/70 shadow-sm">
                      <h3 className="text-xs font-black text-slate-700 uppercase mb-2">📊 {t.barTitle}</h3>
                      <div className="h-52 relative"><canvas ref={barCanvas}></canvas></div>
                    </div>
                  </div>
                )}

                {/* DAFTAR HP */}
                {activeTab === 'list' && (
                  <div className="bg-white rounded-3xl border-2 border-pink-200/70 shadow-sm p-4 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="font-black text-slate-800 text-sm">🎀 {t.allRegistered} ({filteredSchedules.length})</h3>
                      <div className="flex items-center gap-2">
                        {(searchQuery || filterBrand !== 'ALL' || filterStatus !== 'ALL' || filterDate || filterHour !== 'ALL') && (
                          <button onClick={handleResetFilter} className="text-[11px] text-rose-600 font-bold hover:underline">Reset</button>
                        )}
                        {isAdmin && (
                          <button onClick={() => handleOpenCreate()} className="bg-maroon text-white px-3 py-1.5 rounded-xl text-xs font-bold">
                            {t.btnAddSch}
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="space-y-2 bg-pink-50/50 p-3 rounded-2xl border border-pink-200">
                      <input
                        type="text"
                        placeholder={t.searchPlaceholder}
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-maroon"
                      />
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <select
                          value={filterBrand}
                          onChange={e => setFilterBrand(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 font-medium"
                        >
                          <option value="ALL">{t.allCategories}</option>
                          {brands.map(b => <option key={b.id} value={b.id}>{b.emoji} {b.name}</option>)}
                        </select>
                        <select
                          value={filterStatus}
                          onChange={e => setFilterStatus(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 font-medium"
                        >
                          <option value="ALL">{t.allStatuses}</option>
                          <option value="LIVE">🟢 LIVE</option>
                          <option value="Konten">🎬 Take Konten</option>
                          <option value="Tidur">😴 Tidur</option>
                          <option value="Me Time">💅 Me Time</option>
                          <option value="Meeting">💬 Meeting</option>
                          <option value="OFF">☕ OFF</option>
                          <option value="Sakit / Medis">🏥 Sakit</option>
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <label className="block text-[10px] text-slate-500 font-bold mb-0.5">{t.checkDate}</label>
                          <input
                            type="date"
                            value={filterDate}
                            onChange={e => setFilterDate(e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-xl px-2 py-1 text-[11px] font-semibold"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-bold mb-0.5">{t.checkStartHour}</label>
                          <select
                            value={filterHour}
                            onChange={e => setFilterHour(e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 font-medium font-mono"
                          >
                            <option value="ALL">{t.allHours}</option>
                            {Array.from({ length: 24 }).map((_, h) => (
                              <option key={h} value={h}>{String(h).padStart(2, '0')}:00</option>
                            ))}
                          </select>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      {filteredSchedules.length === 0 ? (
                        <div className="text-center py-6 text-slate-400 text-xs font-bold">{t.noMatchFilter}</div>
                      ) : (
                        filteredSchedules.map(s => {
                          const brand = brands.find(b => b.id === s.brand_id);
                          return (
                            <div key={s.id} className="p-3 bg-pink-50/30 rounded-2xl border border-pink-200 space-y-1 relative overflow-hidden">
                              <div className="w-1.5 absolute left-0 top-0 bottom-0" style={{ backgroundColor: s.color }}></div>
                              <div className="pl-1">
                                <div className="flex justify-between items-center">
                                  <span className="font-bold text-xs text-maroon">{getHariNama(s.date)}, {s.date}</span>
                                  <span className="font-mono text-[10px] font-bold bg-white px-2 py-0.5 rounded border">{s.start_time}-{s.end_time}</span>
                                </div>
                                <div className="font-black text-xs text-slate-900 mt-0.5">{s.title}</div>
                                <div className="text-[10px] text-slate-500 flex items-center gap-1.5 mt-0.5">
                                  <span>{brand?.emoji} {brand?.name}</span>
                                  <span>•</span>
                                  <span className="font-bold text-slate-700">[{s.status}]</span>
                                </div>
                                {s.notes && <div className="text-[10px] text-rose-900 italic bg-pink-50 p-1.5 rounded-lg mt-1">💌 {s.notes}</div>}
                                {renderKontenChecklist(s)}
                                {isAdmin && (
                                  <div className="flex justify-end gap-2 pt-1 border-t border-pink-200/60 mt-1">
                                    <button onClick={() => handleDuplicate(s)} className="text-[10px] font-bold text-slate-600">{t.copyBtn}</button>
                                    <button onClick={() => handleOpenEdit(s)} className="text-[10px] font-bold text-pink-600">{t.editBtn}</button>
                                    <button onClick={() => handleDelete(s.id)} className="text-[10px] font-bold text-rose-600">{t.deleteBtn}</button>
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* WARNA HP */}
                {activeTab === 'colors' && (
                  <div className="bg-white rounded-3xl border-2 border-pink-200/70 shadow-sm p-4 space-y-3">
                    <h3 className="font-black text-sm text-slate-800">🎨 {t.tabColors}</h3>
                    <div className="space-y-2">
                      {brands.map(b => (
                        <div key={b.id} className="flex items-center justify-between p-3 bg-pink-50/40 rounded-2xl border border-pink-200">
                          <div className="flex items-center gap-3">
                            <input
                              type="color"
                              disabled={!isAdmin}
                              value={b.color}
                              onChange={e => {
                                const newColor = e.target.value;
                                const updated = brands.map(item => item.id === b.id ? { ...item, color: newColor } : item);
                                saveBrandsToCloud(updated);
                                const updatedSch = schedules.map(s => s.brand_id === b.id ? { ...s, color: newColor } : s);
                                saveSchedulesToCloud(updatedSch);
                              }}
                              className="w-8 h-8 rounded-xl border-none cursor-pointer"
                            />
                            <span className="font-bold text-xs">{b.emoji} {b.name}</span>
                          </div>
                          <span className="text-[10px] font-bold font-mono text-slate-500">{b.color}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* FLOATING ACTION BUTTON HP */}
              {isAdmin && (
                <button
                  onClick={() => handleOpenCreate(selectedDate)}
                  className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-r from-maroon to-rose-600 text-white flex items-center justify-center text-3xl shadow-2xl z-40 active:scale-90 transition border-2 border-pink-200"
                >
                  +
                </button>
              )}
            </div>
          )}

          {/* ========================================================= */}
          {/* 🌟 3. MODAL POPUP PIN, CLONE DAY & FORM INPUT JADWAL      */}
          {/* ========================================================= */}

          {/* MODAL SALIN 1 HARI PENUH (CLONE DAY) */}
          {cloneModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <h3 className="font-black text-base text-slate-800">{t.cloneModalTitle}</h3>
                <p className="text-xs text-slate-500">
                  {t.cloneModalDesc} <span className="font-black text-maroon">{selectedDate}</span> ({selectedDaySchedules.length} sesi):
                </p>
                <form onSubmit={handleCloneFullDay} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">{t.cloneTargetLabel}</label>
                    <input
                      type="date"
                      required
                      value={cloneTargetDate}
                      onChange={e => setCloneTargetDate(e.target.value)}
                      className="w-full bg-pink-50/50 border border-pink-300 rounded-2xl px-3.5 py-2.5 text-xs font-bold"
                    />
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setCloneModalOpen(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.cloneConfirmBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL PIN ADMIN */}
          {pinInputModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 text-center space-y-4 border-2 border-pink-200 animate-in zoom-in duration-150">
                <div className="w-12 h-12 rounded-2xl bg-pink-100 text-maroon flex items-center justify-center text-2xl mx-auto font-black shadow-inner">
                  🎀
                </div>
                <div>
                  <h3 className="font-black text-base text-slate-800">{t.adminAccessTitle}</h3>
                  <p className="text-xs text-slate-500 mt-1">{t.adminAccessDesc}</p>
                </div>
                <form onSubmit={handleVerifyPin} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    autoFocus
                    value={enteredPin}
                    onChange={e => { setEnteredPin(e.target.value); setPinError(false); }}
                    placeholder={t.pinPlaceholder}
                    className="w-full text-center text-xl tracking-widest font-mono font-black bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-maroon"
                  />
                  {pinError && <div className="text-rose-600 text-xs font-bold">{t.pinWrong}</div>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setPinInputModal(false)} className="w-1/2 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">
                      {t.cancelBtn}
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-2xl bg-maroon text-white font-black text-xs shadow">
                      {t.unlockBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FORM INPUT JADWAL DENGAN PROTEKSI JAM TERISI (ANTI-TUMPUK) */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
              <div className="bg-white rounded-t-3xl md:rounded-3xl shadow-2xl w-full max-w-md max-h-[92vh] overflow-y-auto border-2 border-pink-200 animate-in slide-in-from-bottom duration-200">
                <div className="bg-gradient-to-r from-maroon to-rose-800 text-white p-4 flex justify-between items-center sticky top-0 z-10">
                  <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                    <span>🎀</span>
                    <span>{selectedSchedule ? t.modalEditTitle : t.modalAddTitle}</span>
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>
                <form onSubmit={handleSave} className="p-5 space-y-3 text-xs">
                  
                  {/* 🍼 PRESET MOM UUNG DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-amber-950 flex items-center gap-1.5 text-[11px]">
                        <span>🍼</span><span>{t.presetMomUung}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-amber-200/70 text-amber-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "05:00", en: "13:00" },
                        { num: 2, st: "11:00", en: "19:00" },
                        { num: 3, st: "16:00", en: "23:59" },
                        { num: 4, st: "00:00", en: "07:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyMomUungPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-amber-300 hover:bg-amber-100 text-amber-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-emerald-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] bg-rose-100 text-rose-700 px-1.5 py-0.2 rounded font-sans font-black">{t.presetBlocked}</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 💧 PRESET AQUAPRESS DENGAN DETEKSI BENTROK OTOMATIS */}
                  <div className="bg-cyan-50 border border-cyan-200 p-3 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-black text-cyan-950 flex items-center gap-1.5 text-[11px]">
                        <span>💧</span><span>{t.presetAquaPress}</span>
                      </span>
                      <span className="text-[9px] font-bold bg-cyan-200/70 text-cyan-900 px-2 py-0.5 rounded-full">Auto-Fill</span>
                    </div>
                    <div className="grid grid-cols-3 gap-1.5 font-bold font-mono text-[10px]">
                      {[
                        { num: 1, st: "08:00", en: "12:00" },
                        { num: 2, st: "12:00", en: "16:00" },
                        { num: 3, st: "16:00", en: "20:00" }
                      ].map(p => {
                        const conflict = getRangeConflictOnFormDate(p.st, p.en);
                        return (
                          <button
                            key={p.num}
                            type="button"
                            disabled={!!conflict}
                            onClick={() => applyAquaPressPreset(p.num, p.st, p.en)}
                            className={`p-2 rounded-xl text-left shadow-xs transition flex flex-col border ${conflict ? 'bg-slate-100 border-slate-300 opacity-50 cursor-not-allowed' : 'bg-white border-cyan-300 hover:bg-cyan-100 text-cyan-950 active:scale-95'}`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black ${conflict ? 'text-slate-500 line-through' : 'text-cyan-800'}`}>Shift {p.num}</span>
                              {conflict && <span className="text-[8px] text-rose-600">🔒</span>}
                            </div>
                            <span className="text-[9px] text-slate-500">{p.st} - {p.en}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 🔒 DAFTAR JAM YANG SUDAH TERISI DI TANGGAL INI */}
                  <div className="bg-pink-50/80 border border-pink-200 rounded-2xl p-2.5 space-y-1.5">
                    <div className="text-[10px] font-black text-maroon">{t.occupiedTimelineTitle}</div>
                    {existingSchedulesOnFormDate.length === 0 ? (
                      <div className="text-[10px] text-emerald-700 font-bold">{t.allFreeTimeline}</div>
                    ) : (
                      <div className="flex flex-wrap gap-1">
                        {existingSchedulesOnFormDate.map(s => (
                          <span key={s.id} className="bg-white border border-rose-200 text-rose-800 font-mono text-[10px] font-bold px-2 py-0.5 rounded-lg shadow-2xs">
                            🔒 {s.start_time}-{s.end_time} ({s.title})
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formTitleLabel}</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      placeholder="Shift Mom Uung / AquaPress / Me Time / Take Konten"
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-maroon focus:outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.catBrand} *</label>
                      <select
                        value={formData.brand_id}
                        onChange={e => {
                          const newBrandId = e.target.value;
                          let newStatus = formData.status;
                          if (newBrandId === 'b_konten') newStatus = 'Konten';
                          else if (newBrandId === 'b_sleep') newStatus = 'Tidur';
                          else if (newBrandId === 'b_lainlain') newStatus = 'Me Time';
                          else if (newBrandId === 'b_pribadi') newStatus = 'OFF';
                          setFormData({ ...formData, brand_id: newBrandId, status: newStatus });
                        }}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        {brands.map(b => (
                          <option key={b.id} value={b.id}>
                            {b.emoji} {b.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.attStatus} *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      >
                        <option value="LIVE">🟢 LIVE</option>
                        <option value="Konten">🎬 Take Konten Video</option>
                        <option value="Tidur">😴 Tidur / Istirahat</option>
                        <option value="Me Time">💅 Me Time</option>
                        <option value="Meeting">💬 Meeting</option>
                        <option value="OFF">☕ OFF (Libur)</option>
                        <option value="Sakit / Medis">🏥 Sakit / Medis</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartDate}</label>
                      <input
                        type="date"
                        required
                        value={formData.date}
                        onChange={e => setFormData({ ...formData, date: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold"
                      />
                    </div>
                    {!selectedSchedule ? (
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">{t.formRepeat}</label>
                        <select
                          value={repeatDays}
                          onChange={e => setRepeatDays(Number(e.target.value))}
                          className="w-full bg-pink-50 border border-pink-300 text-maroon rounded-2xl px-3 py-2.5 font-black"
                        >
                          <option value={1}>{t.rep1}</option>
                          <option value={2}>{t.rep2}</option>
                          <option value={3}>{t.rep3}</option>
                          <option value={5}>{t.rep5}</option>
                          <option value={7}>{t.rep7}</option>
                        </select>
                      </div>
                    ) : (
                      <div className="flex items-end pb-2 text-[10px] text-slate-400 italic">
                        {t.modalEditTitle}
                      </div>
                    )}
                  </div>
                  
                  {/* 🔒 DROPDOWN JAM MULAI & SELESAI YANG OTOMATIS MENGUNCI JAM TERISI */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formStartHour}</label>
                      <select
                        required
                        value={formData.start_time}
                        onChange={e => {
                          const newStart = e.target.value;
                          let newEnd = formData.end_time;
                          if (timeToMinutes(newEnd) <= timeToMinutes(newStart)) {
                            const nextIdx = END_TIME_OPTIONS.findIndex(tm => timeToMinutes(tm) > timeToMinutes(newStart));
                            if (nextIdx !== -1) newEnd = END_TIME_OPTIONS[nextIdx];
                          }
                          setFormData({ ...formData, start_time: newStart, end_time: newEnd });
                        }}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {START_TIME_OPTIONS.map(tm => {
                          const conflict = getStartTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict ? `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})` : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{t.formEndHour}</label>
                      <select
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 font-bold font-mono text-slate-900"
                      >
                        {END_TIME_OPTIONS.map(tm => {
                          const conflict = getEndTimeConflict(tm);
                          return (
                            <option
                              key={tm}
                              value={tm}
                              disabled={!!conflict}
                              className={conflict ? 'text-rose-400 bg-rose-50' : ''}
                            >
                              {conflict
                                ? (conflict.isInvalidOrder ? `${tm}` : `🔒 ${tm} (${t.slotOccupiedLabel} ${conflict.title.slice(0, 12)})`)
                                : tm}
                            </option>
                          );
                        })}
                      </select>
                    </div>
                  </div>

                  {/* PERINGATAN JIKA RENTANG WAKTU MASIH BENTROK */}
                  {currentFormConflict && (
                    <div className="bg-rose-100 border-2 border-rose-400 text-rose-900 p-3 rounded-2xl text-xs font-extrabold flex items-center gap-2 animate-pulse">
                      <span className="text-lg">⛔</span>
                      <div>
                        <div>{t.overlapWarningTitle}</div>
                        <div className="text-[10px] font-bold">
                          {t.overlapWarningDesc} "{currentFormConflict.title}" ({currentFormConflict.start_time} - {currentFormConflict.end_time})
                        </div>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">{t.formNotes}</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 font-medium"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 font-extrabold hover:underline">
                        {t.deleteSchBtn}
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl font-bold">
                        {t.cancelBtn}
                      </button>
                      <button
                        type="submit"
                        disabled={!!currentFormConflict}
                        className={`px-5 py-2.5 rounded-2xl font-black shadow transition ${currentFormConflict ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-maroon to-rose-700 text-white active:scale-95'}`}
                      >
                        {currentFormConflict ? '⛔ Jam Terisi' : `💖 ${t.saveCloudBtn}`}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
