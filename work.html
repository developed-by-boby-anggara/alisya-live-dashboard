    const timeToMinutes = (tStr) => {
      if (!tStr) return 0;
      if (tStr === '23:59') return 24 * 60;
      const [hr, mn] = tStr.split(':').map(Number);
      return hr * 60 + mn;

    const formatSecondsToHMS = (totalSeconds) => {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const hr = Math.floor(sec / 3600);
      const mn = Math.floor((sec % 3600) / 60);
      const sc = sec % 60;
      return `${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')}:${String(sc).padStart(2, '0')}`;

    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end === '23:59' ? [24, 0] : end.split(':').map(Number);
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
      return Math.round((diff / 60) * 10) / 10;
    };

    function WorkApp() {
      const [nowTime, setNowTime] = useState(() => new Date());
      useEffect(() => {
        const timer = setInterval(() => setNowTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const realTodayStr = useMemo(() => {
        return `${nowTime.getFullYear()}-${String(nowTime.getMonth() + 1).padStart(2, '0')}-${String(nowTime.getDate()).padStart(2, '0')}`;
      }, [nowTime]);

      const liveClockString = useMemo(() => {
        return `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}:${String(nowTime.getSeconds()).padStart(2, '0')}`;
      }, [nowTime]);

      const [lang, setLang] = useState(() => localStorage.getItem('alisya_lang') === 'en' ? 'en' : 'id');
      const handleSetLang = (newLang) => {
        setLang(newLang);
        localStorage.setItem('alisya_lang', newLang);
      };
      const t = TRANSLATIONS[lang] || TRANSLATIONS.id;

      const [displayMode, setDisplayMode] = useState(() => window.innerWidth < 1024 ? 'mobile' : 'pc');
      useEffect(() => {
        const onResize = () => setDisplayMode(window.innerWidth < 1024 ? 'mobile' : 'pc');
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      const [activeTab, setActiveTab] = useState('agenda');
      const [selectedDate, setSelectedDate] = useState(realTodayStr);
      const prevRealTodayRef = useRef(realTodayStr);

      const [currentYear, setCurrentYear] = useState(() => new Date().getFullYear());
      const [currentMonth, setCurrentMonth] = useState(() => new Date().getMonth());

      useEffect(() => {
        if (prevRealTodayRef.current !== realTodayStr) {
          prevRealTodayRef.current = realTodayStr;
          setSelectedDate(realTodayStr);
        }
      }, [realTodayStr]);

      useEffect(() => {
        if (selectedDate) {
          const [y, m] = selectedDate.split('-').map(Number);
          if (y && m) { setCurrentYear(y); setCurrentMonth(m - 1); }
        }
      }, [selectedDate]);

      useEffect(() => {
        if (displayMode !== 'mobile') return;
        const timer = setTimeout(() => {
          const el = document.getElementById(`work-cal-day-${selectedDate}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 180);
        return () => clearTimeout(timer);
      }, [selectedDate, currentMonth, activeTab, displayMode]);

      const [schedules, setSchedules] = useState(() => {
        try {
          const cached = localStorage.getItem('alisya_schedules_cache');
          return cached ? JSON.parse(cached) : INITIAL_SCHEDULES;
        } catch (e) { return INITIAL_SCHEDULES; }
      });
      const [brands, setBrands] = useState(REQUIRED_CATEGORIES);
      const [stickyNote, setStickyNote] = useState("Target Minggu Ini: Push GMV Live Mom Uung & AquaPress!");

      const [isAdmin, setIsAdmin] = useState(false);
      const adminPin = "101100";
      const [pinInputModal, setPinInputModal] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState(false);

      const [statPeriod, setStatPeriod] = useState('monthly');
      const [customStatDate, setCustomStatDate] = useState(realTodayStr);
      const [customStatMonth, setCustomStatMonth] = useState(() => new Date().getMonth());
      const [customStatYear, setCustomStatYear] = useState(() => new Date().getFullYear());

      const [searchQuery, setSearchQuery] = useState('');
      const [filterBrand, setFilterBrand] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');

      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSchedule, setSelectedSchedule] = useState(null);
      const [repeatDays, setRepeatDays] = useState(1);
      const [cloneModalOpen, setCloneModalOpen] = useState(false);
      const [cloneTargetDate, setCloneTargetDate] = useState(() => addDaysToDateStr(realTodayStr, 1));
      const [formData, setFormData] = useState({
        id: '', date: realTodayStr, start_time: '10:00', end_time: '12:00',
        title: '', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: '', gmv: '',
        checklist: { shoot: false, edit: false, upload: false }
      });

      const [toast, setToast] = useState('');
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };

      useEffect(() => {
        if (!firebaseDb) return;
        const refSch = firebaseDb.ref('alisya_schedules');
        refSch.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) {
            setSchedules(val);
            try { localStorage.setItem('alisya_schedules_cache', JSON.stringify(val)); } catch (e) {}
          } else {
            refSch.set(INITIAL_SCHEDULES);
          }
        });

        const refBrands = firebaseDb.ref('alisya_brands');
        refBrands.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) setBrands(val);
        });

        const refNote = firebaseDb.ref('alisya_sticky_note');
        refNote.on('value', snap => {
          const val = snap.val();
          if (val) setStickyNote(val);
        });

        return () => { refSch.off(); refBrands.off(); refNote.off(); };
      }, []);

      const saveSchedulesToCloud = (newList) => {
        setSchedules(newList);
        try { localStorage.setItem('alisya_schedules_cache', JSON.stringify(newList)); } catch (e) {}
        if (firebaseDb) firebaseDb.ref('alisya_schedules').set(newList);
      };

      const saveBrandsToCloud = (newBrands) => {
        setBrands(newBrands);
        if (firebaseDb) firebaseDb.ref('alisya_brands').set(newBrands);
      };

      const getHariNama = (dateString) => {
        if (!dateString) return '-';
        const [y, m, d] = dateString.split('-').map(Number);
        return new Intl.DateTimeFormat(t.locale, { weekday: 'long' }).format(new Date(y, m - 1, d));
      };

      const daysInMonth = useMemo(() => new Date(currentYear, currentMonth + 1, 0).getDate(), [currentYear, currentMonth]);
      const firstDayOffset = useMemo(() => new Date(currentYear, currentMonth, 1).getDay(), [currentYear, currentMonth]);
      const monthName = useMemo(() => new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(currentYear, currentMonth, 1)), [currentYear, currentMonth, t.locale]);

      const getSessionTimeState = (item) => {
        if (item.date < realTodayStr) return 'done';
        if (item.date > realTodayStr) return 'upcoming';
        const nowMin = nowTime.getHours() * 60 + nowTime.getMinutes();
        const sMin = timeToMinutes(item.start_time);
        let eMin = timeToMinutes(item.end_time);
        if (eMin <= sMin) eMin = 24 * 60;
        if (nowMin >= eMin) return 'done';
        if (nowMin >= sMin && nowMin < eMin) return 'live';
        return 'upcoming';
      };

      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF' && s.status !== 'SAKIT' && s.status !== 'Sakit / Medis' && s.brand_id !== 'b_sakit')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowTotalSeconds = nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();
        const toSec = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 3600;
          const [hr, mn] = tStr.split(':').map(Number);
          return hr * 3600 + mn * 60;
        };

        let activeItem = null, nextItem = null, completedCount = 0;

        todayList.forEach(item => {
          const sSec = toSec(item.start_time);
          let eSec = toSec(item.end_time);
          if (eSec <= sSec) eSec = 24 * 3600;

          if (nowTotalSeconds >= sSec && nowTotalSeconds < eSec) {
            const remSec = eSec - nowTotalSeconds;
            const totalDurSec = Math.max(1, eSec - sSec);
            const sessionPct = Math.min(100, Math.max(0, (((nowTotalSeconds - sSec) / totalDurSec) * 100).toFixed(1)));
            activeItem = { ...item, remainingSec: remSec, remainingHMS: formatSecondsToHMS(remSec), sessionPct };
          } else if (nowTotalSeconds >= eSec) {
            completedCount++;
          } else if (nowTotalSeconds < sSec && !nextItem) {
            const diffSec = sSec - nowTotalSeconds;
            nextItem = { ...item, startsInSec: diffSec, startsInHMS: formatSecondsToHMS(diffSec), startsInMin: Math.ceil(diffSec / 60) };
          }
        });

        const activeFraction = activeItem ? Number(activeItem.sessionPct) / 100 : 0;
        const progressPct = todayList.length > 0 ? Math.min(100, Math.round(((completedCount + activeFraction) / todayList.length) * 100)) : 0;

        return { activeItem, nextItem, progressPct, totalToday: todayList.length, completedCount };
      }, [schedules, realTodayStr, nowTime]);

      const broadcastMetrics = useMemo(() => {
        let completedLiveHours = 0;
        schedules.forEach(s => {
          if (s.status === 'LIVE') {
            const state = getSessionTimeState(s);
            if (s.date < realTodayStr || (s.date === realTodayStr && state === 'done')) {
              completedLiveHours += calculateDurationHours(s.start_time, s.end_time);
            }
          }
        });
        const totalHours = 480 + Math.round(completedLiveHours);

        let totalPrimeSlots = 0, occupiedPrimeSlots = 0;
        for (let i = 0; i < 7; i++) {
          const dStr = addDaysToDateStr(realTodayStr, i);
          const dayList = schedules.filter(s => s.date === dStr && s.status !== 'OFF');
          TIME_SLOTS.forEach(slot => {
            totalPrimeSlots++;
            const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
            const isBusy = dayList.some(s => {
              const st = timeToMinutes(s.start_time);
              let en = timeToMinutes(s.end_time);
              if (en <= st) en = 24 * 60;
              return st < eM && en > sM;
            });
            if (isBusy) occupiedPrimeSlots++;
          });
        }
        const freeSlots = Math.max(0, totalPrimeSlots - occupiedPrimeSlots);
        let badge = '🟢 Schedule Active';
        if (freeSlots <= 10) badge = '🔒 Fully Booked This Week';
        else if (freeSlots <= 28) badge = '⚡ Limited Slots Remaining';

        return { totalHours, freeSlots, badge };
      }, [schedules, realTodayStr, nowTime]);

      const shortBreakWarnings = useMemo(() => {
        const map = {}, grouped = {};
        schedules.forEach(s => {
          if (s.status === 'Tidur' || s.brand_id === 'b_sleep' || s.status === 'OFF' || s.brand_id === 'b_sakit' || s.status === 'Sakit / Medis') return;
          if (!grouped[s.date]) grouped[s.date] = [];
          grouped[s.date].push(s);
        });
        Object.keys(grouped).forEach(date => {
          const list = grouped[date].sort((a, b) => a.start_time.localeCompare(b.start_time));
          for (let i = 0; i < list.length - 1; i++) {
            const diffMin = timeToMinutes(list[i + 1].start_time) - timeToMinutes(list[i].end_time);
            if (diffMin > 0 && diffMin < 300) { map[date] = true; break; }
          }
        });
        return map;
      }, [schedules]);

      const selectedDaySchedules = useMemo(() => {
        return schedules.filter(s => s.date === selectedDate).sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, selectedDate]);

      const availableSlotsForSelectedDate = useMemo(() => {
        return TIME_SLOTS.filter(slot => {
          const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
          return !selectedDaySchedules.some(s => {
            const st = timeToMinutes(s.start_time);
            let en = timeToMinutes(s.end_time);
            if (en <= st) en = 24 * 60;
            return st < eM && en > sM;
          });
        });
      }, [selectedDaySchedules]);

      // Status Hari (Hanya menghitung s.status === 'OFF' sebagai libur agar tidak salah baca)
      const getDayScheduleDensity = (dateStr, isCompact = false) => {
        const dayShifts = schedules.filter(s => s.date === dateStr);
        if (dayShifts.length === 0) return { text: t.statusFree, cls: 'st-free' };
        if (dayShifts.some(s => s.status === 'OFF')) return { text: t.statusOff, cls: 'st-off' };
        let prodHours = 0;
        dayShifts.forEach(s => {
          if (s.status !== 'Tidur' && s.brand_id !== 'b_sleep') prodHours += calculateDurationHours(s.start_time, s.end_time);
        });
        if (prodHours >= 10) return { text: isCompact ? t.statusFull : t.statusFullPC, cls: 'st-full' };
        if (prodHours >= 6) return { text: t.statusMed, cls: 'st-med' };
        if (prodHours > 0) return { text: t.statusLow, cls: 'st-low' };
        return { text: t.statusFree, cls: 'st-free' };
      };

      const existingSchedulesOnFormDate = useMemo(() => {
        return schedules
          .filter(s => s.date === formData.date && (!selectedSchedule || s.id !== selectedSchedule.id))
          .sort((a, b) => a.start_time.localeCompare(b.start_time));
      }, [schedules, formData.date, selectedSchedule]);

      const checkConflictRange = (startStr, endStr) => {
        const sMin = timeToMinutes(startStr);
        let eMin = timeToMinutes(endStr);
        if (eMin <= sMin) eMin = 24 * 60;
        return existingSchedulesOnFormDate.find(s => {
          const exS = timeToMinutes(s.start_time);
          let exE = timeToMinutes(s.end_time);
          if (exE <= exS) exE = 24 * 60;
          return sMin < exE && eMin > exS;
        });
      };

      const currentFormConflict = useMemo(() => checkConflictRange(formData.start_time, formData.end_time), [formData.start_time, formData.end_time, existingSchedulesOnFormDate]);

      const findFirstFreeSlotOnDate = (dateStr, prefStart = '10:00', prefEnd = '12:00') => {
        const dayList = schedules.filter(s => s.date === dateStr);
        const isFree = (st, en) => {
          const sM = timeToMinutes(st), eM = timeToMinutes(en);
          return !dayList.some(item => {
            const iS = timeToMinutes(item.start_time);
            let iE = timeToMinutes(item.end_time);
            if (iE <= iS) iE = 24 * 60;
            return sM < iE && eM > iS;
          });
        };
        if (isFree(prefStart, prefEnd)) return { start: prefStart, end: prefEnd };
        for (const slot of TIME_SLOTS) {
          if (isFree(slot.start, slot.end)) return { start: slot.start, end: slot.end };
        }
        return { start: prefStart, end: prefEnd };
      };

      const jumpToOffset = (days) => {
        const d = new Date();
        d.setDate(d.getDate() + days);
        const str = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        setSelectedDate(str);
      };

      const shareToWhatsApp = () => {
        const todayItems = selectedDaySchedules;
        const hari = getHariNama(selectedDate);
        let text = `🌸 *${t.radarTitle}* 🌸\n🗓️ ${hari}, ${selectedDate}\n\n`;
        if (todayItems.length === 0) text += `🟢 ${t.noSchedule}\n`;
        else {
          todayItems.forEach((s, idx) => {
            const b = brands.find(br => br.id === s.brand_id);
            text += `${idx + 1}. *${s.start_time} - ${s.end_time}* : ${s.title}\n   🏷️ ${b ? b.name : '-'} | 📌 ${s.status}\n\n`;
          });
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const shareSpreadsheetToWA = () => {
        const monthItems = schedules
          .filter(s => {
            const [y, m] = s.date.split('-').map(Number);
            return y === currentYear && m === (currentMonth + 1);
          })
          .sort((a, b) => a.date.localeCompare(b.date) || a.start_time.localeCompare(b.start_time));
        let text = `🌸 *ALISYA WORK SCHEDULE (${monthName} ${currentYear})* 🌸\n\n`;
        if (monthItems.length === 0) text += `${t.noSchedule}\n`;
        else {
          const grouped = {};
          monthItems.forEach(it => { if (!grouped[it.date]) grouped[it.date] = []; grouped[it.date].push(it); });
          Object.keys(grouped).forEach(dt => {
            text += `📅 *${getHariNama(dt)}, ${dt}*:\n`;
            grouped[dt].forEach(it => { text += ` • ⏰ ${it.start_time}-${it.end_time} | *${it.title}* [${it.status}]\n`; });
            text += `\n`;
          });
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const exportElementAsPNG = async (elementId, filenameLabel) => {
        const el = document.getElementById(elementId);
        if (!el || typeof html2canvas === 'undefined') { notify('⚠️ Sedang memuat modul gambar...'); return; }
        notify('📸 Memproses gambar tabel...');
        try {
          const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#FCE7F3' });
          const link = document.createElement('a');
          link.download = `Alisya_Schedule_${filenameLabel}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          notify('✅ Gambar (.PNG) berhasil diunduh!');
        } catch (err) { notify('⚠️ Gagal mengunduh gambar.'); }
      };

      const exportCSV = () => {
        const headers = ["Day", "Date", "Start", "End", "Title", "Category", "Status", "Notes"];
        const rows = schedules.map(s => [
          `"${getHariNama(s.date)}"`, s.date, s.start_time, s.end_time,
          `"${(s.title || '').replace(/"/g, '""')}"`,
          `"${(brands.find(b => b.id === s.brand_id)?.name || s.brand_id).replace(/"/g, '""')}"`,
          `"${s.status}"`, `"${(s.notes || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `Alisya_Schedule_${currentYear}_${currentMonth + 1}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notify('📥 CSV berhasil diunduh!');
      };

      const handleExportToGoogleCalendar = (e, item) => {
        e.stopPropagation();
        const cleanDate = item.date.replace(/-/g, '');
        const startClean = item.start_time.replace(':', '') + '00';
        const endClean = item.end_time.replace(':', '') + '00';
        let endDate = cleanDate;
        if (timeToMinutes(item.end_time) <= timeToMinutes(item.start_time)) {
          endDate = addDaysToDateStr(item.date, 1).replace(/-/g, '');
        }
        const brandName = brands.find(b => b.id === item.brand_id)?.name || '';
        const title = encodeURIComponent(`[${item.status}] ${item.title} (${brandName})`);
        const details = encodeURIComponent(`Kategori: ${brandName}\nCatatan: ${item.notes || '-'}\n— Alisya Work Schedule`);
        window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${cleanDate}T${startClean}/${endDate}T${endClean}&details=${details}`, '_blank');
      };

      const handleToggleChecklist = (e, itemId, stepKey) => {
        e.stopPropagation();
        if (!isAdmin) { setPinInputModal(true); return; }
        const updated = schedules.map(s => {
          if (s.id === itemId) {
            const cl = s.checklist || { shoot: false, edit: false, upload: false };
            return { ...s, checklist: { ...cl, [stepKey]: !cl[stepKey] } };
          }
          return s;
        });
        saveSchedulesToCloud(updated);
        notify('✅ Progres konten diperbarui!');
      };

      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const targetDate = dateStr || selectedDate;
        const smartSlot = findFirstFreeSlotOnDate(targetDate, slotStart, slotEnd);
        setSelectedSchedule(null);
        setRepeatDays(1);
        setFormData({
          id: 'sch_' + Date.now(), date: targetDate, start_time: smartSlot.start, end_time: smartSlot.end,
          title: '', brand_id: brands[0]?.id || 'b_momuung', status: 'LIVE',
          color: brands[0]?.color || '#B6D7A8', notes: '', gmv: '',
          checklist: { shoot: false, edit: false, upload: false }
        });
        setModalOpen(true);
      };

      const handleOpenEdit = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        setSelectedSchedule(sch);
        setRepeatDays(1);
        setFormData({ ...sch, checklist: sch.checklist || { shoot: false, edit: false, upload: false } });
        setModalOpen(true);
      };

      const handleDuplicate = (sch) => {
        if (!isAdmin) { setPinInputModal(true); return; }
        const freeSlot = findFirstFreeSlotOnDate(sch.date, sch.start_time, sch.end_time);

                      ),
                      h('tbody', null,
                        Array.from({ length: daysInMonth }).map((_, i) => {
                          const day = i + 1;
                          const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                          const dtObj = new Date(currentYear, currentMonth, day);
                          const dayName = new Intl.DateTimeFormat(t.locale, { weekday: 'long' }).format(dtObj);
                          const isToday = dateStr === realTodayStr;
                          const density = getDayScheduleDensity(dateStr, false);

                          return h('tr', { key: day, className: isToday ? 'row-today-glow' : '' },
                            h('td', { className: 'sticky-col-pc' },
                              h('div', { className: 'flex items-center gap-2' },
                                isToday && h('span', { className: 'radar-dot-wrap' }, h('span', { className: 'radar-dot-core' })),
                                h('span', { style: { fontSize: '14px', fontWeight: 900, color: '#4A0424' } }, day),
                                h('span', { style: { fontSize: '11px', fontWeight: 800, color: '#9D174D', textTransform: 'uppercase' } }, dayName)
                              )
                            ),
                            h('td', { style: { textAlign: 'center', verticalAlign: 'middle' } },
                              h('span', { className: `status-pill-hp ${density.cls}`, style: { fontSize: '9px', padding: '4px 8px', borderRadius: '8px' } }, density.text)
                            ),
                            TIME_SLOTS.map(slot => {
                              const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
                              const slotItems = schedules.filter(s => {
                                if (s.date !== dateStr) return false;
                                const st = timeToMinutes(s.start_time);
                                let en = timeToMinutes(s.end_time);
                                if (en <= st) en = 24 * 60;
                                return st < eM && en > sM;
                              });
                              return h('td', {
                                key: slot.label,
                                onClick: () => slotItems.length > 0 ? (isAdmin ? handleOpenEdit(slotItems[0]) : notify(`⏰ ${slotItems[0].start_time}-${slotItems[0].end_time}: ${slotItems[0].title}`)) : handleOpenCreate(dateStr, slot.start, slot.end),
                                style: { cursor: 'pointer' }
                              },
                                slotItems.map(item => h('div', {
                                  key: item.id,
                                  style: {
                                    background: item.color, color: '#0F172A', padding: '4px 6px',
                                    borderRadius: '8px', fontSize: '10px', fontWeight: 900, marginBottom: '3px',
                                    border: '1px solid rgba(0,0,0,0.18)'
                                  }
                                },
                                  h('div', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, item.title),
                                  h('div', { className: 'font-mono', style: { fontSize: '8.5px', opacity: 0.85 } }, `${item.start_time}-${item.end_time}`)
                                ))
                              );
                            })
                          );
                        })
                      )
                    )
                  )
            )
          ),

          // TAB 3: KPI & GRAFIK
          activeTab === 'kpi' && h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
            h('div', { className: 'exec-card flex flex-wrap items-center justify-between gap-2' },
              h('div', { className: 'flex items-center gap-1-5 flex-wrap' },
                ['daily', 'weekly', 'monthly', 'yearly'].map(p => h('button', {
                  key: p, onClick: () => setStatPeriod(p),
                  className: `btn ${statPeriod === p ? 'btn-pink' : 'btn-soft'}`,
                  style: { textTransform: 'capitalize' }
                }, p))
              ),
              (statPeriod === 'daily' || statPeriod === 'weekly') && h('input', {
                type: 'date', value: customStatDate, onChange: e => setCustomStatDate(e.target.value)
              })
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px' } },
              [
                { label: t.totalLive, val: stats.totalLive, sub: `≈ ${stats.totalLiveHours} ${t.hoursLive}`, color: '#059669' },
                { label: t.takeKonten, val: stats.totalKonten, sub: `≈ ${stats.totalKontenHours} ${t.hoursProd}`, color: '#7C3AED' },
                { label: t.sleepTime, val: stats.totalSleep, sub: `≈ ${stats.totalSleepHours} ${t.hoursSleep}`, color: '#2563EB' },
                { label: t.offDay, val: stats.totalOff, sub: 'Days Off', color: '#E11D48' }
              ].map((k, idx) => h('div', { key: idx, className: 'exec-card', style: { background: '#FFFFFF' } },
                h('div', { style: { fontSize: '10.5px', fontWeight: 900, color: '#9D174D' } }, k.label),
                h('div', { style: { fontSize: '28px', fontWeight: 900, color: k.color, marginTop: '4px' } }, k.val),
                h('div', { style: { fontSize: '11.5px', color: '#701A46', marginTop: '4px', fontWeight: 700 } }, k.sub)
              ))
            ),
            h('div', { className: 'exec-card', style: { background: '#FFFFFF' } },
              h('h3', { style: { fontSize: '12.5px', fontWeight: 900, color: '#831843', marginBottom: '10px' } }, `🍩 ${t.propTitle}`),
              h('div', { style: { height: '230px', position: 'relative' } }, h('canvas', { ref: donutCanvas }))
            ),
            h('div', { className: 'exec-card', style: { background: '#FFFFFF' } },
              h('h3', { style: { fontSize: '12.5px', fontWeight: 900, color: '#831843', marginBottom: '10px' } }, `📊 ${t.barTitle}`),
              h('div', { style: { height: '230px', position: 'relative' } }, h('canvas', { ref: barCanvas }))
            )
          ),

          // TAB 4: DAFTAR SEMUA JADWAL
          activeTab === 'list' && h('div', { className: 'exec-card', style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
            h('div', { className: 'flex items-center justify-between flex-wrap gap-2' },
              h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, `📋 ${t.allRegistered} (${filteredSchedules.length})`),
              isAdmin && h('button', { className: 'btn btn-pink', onClick: () => handleOpenCreate(selectedDate) }, t.btnAddSch)
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: displayMode === 'mobile' ? '1fr' : 'repeat(3, 1fr)', gap: '8px' } },
              h('input', { type: 'text', placeholder: t.searchPlaceholder, value: searchQuery, onChange: e => setSearchQuery(e.target.value) }),
              h('select', { value: filterBrand, onChange: e => setFilterBrand(e.target.value) },
                h('option', { value: 'ALL' }, t.allCategories),
                brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
              ),
              h('select', { value: filterStatus, onChange: e => setFilterStatus(e.target.value) },
                h('option', { value: 'ALL' }, t.allStatuses),
                ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF'].map(st => h('option', { key: st, value: st }, st))
              )
            ),
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '4px' } },
              filteredSchedules.map(s => {
                const brand = brands.find(b => b.id === s.brand_id);
                return h('div', {
                  key: s.id,
                  style: {
                    background: '#FFFFFF', border: '1.5px solid #F9A8D4', borderRadius: '14px',
                    padding: '10px 14px', borderLeft: `6px solid ${s.color}`
                  }
                },
                  h('div', { className: 'flex items-center justify-between' },
                    h('span', { style: { fontSize: '11.5px', fontWeight: 900, color: '#9D174D' } }, `${getHariNama(s.date)}, ${s.date}`),
                    h('span', { className: 'font-mono', style: { fontSize: '11.5px', fontWeight: 900, color: '#4A0424', background: '#FCE7F3', padding: '2px 8px', borderRadius: '6px' } }, `${s.start_time} - ${s.end_time}`)
                  ),
                  h('div', { style: { fontSize: '14px', fontWeight: 900, color: '#4A0424', marginTop: '4px' } }, s.title),
                  h('div', { className: 'flex items-center justify-between', style: { marginTop: '4px', fontSize: '11px', color: '#701A46', fontWeight: 700 } },
                    h('span', null, `${brand?.emoji || ''} ${brand?.name || ''} • [${s.status}]`),
                    isAdmin && h('div', { className: 'flex gap-2' },
                      h('button', { className: 'btn btn-soft', style: { padding: '3px 8px', fontSize: '10px' }, onClick: () => handleOpenEdit(s) }, t.editBtn),
                      h('button', { className: 'btn btn-soft', style: { padding: '3px 8px', fontSize: '10px', color: '#E11D48' }, onClick: () => handleDelete(s.id) }, t.deleteBtn)
                    )
                  )
                );
              })
            )
          ),

          // TAB 5: WARNA BRAND
          activeTab === 'colors' && h('div', { className: 'exec-card', style: { maxWidth: '540px', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: '10px' } },
            h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, `🎨 ${t.tabColors}`),
            brands.map(b => h('div', {
              key: b.id, className: 'flex items-center justify-between',
              style: { background: '#FFFFFF', padding: '10px 14px', borderRadius: '14px', border: '1.5px solid #F9A8D4' }
            },
              h('div', { className: 'flex items-center gap-2' },
                h('input', {
                  type: 'color', disabled: !isAdmin, value: b.color,
                  onChange: e => {
                    const newColor = e.target.value;
                    saveBrandsToCloud(brands.map(it => it.id === b.id ? { ...it, color: newColor } : it));
                    saveSchedulesToCloud(schedules.map(s => s.brand_id === b.id ? { ...s, color: newColor } : s));
                  },
                  style: { width: '36px', height: '36px', padding: '2px', cursor: 'pointer' }
                }),
                h('span', { style: { fontSize: '12.5px', fontWeight: 900, color: '#4A0424' } }, `${b.emoji} ${b.name}`)
              ),
              h('span', { className: 'font-mono', style: { fontSize: '11.5px', color: '#9D174D', fontWeight: 800 } }, b.color)
            ))
          )
        ),

        // MODAL PIN ADMIN
        pinInputModal && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { maxWidth: '320px', textAlign: 'center' } },
            h('h3', { style: { fontSize: '15px', fontWeight: 900, color: '#831843', marginBottom: '12px' } }, '🔑 Admin Access'),
            h('form', { onSubmit: handleVerifyPin, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', {
                type: 'password', maxLength: 6, autoFocus: true, value: enteredPin,
                onChange: e => { setEnteredPin(e.target.value); setPinError(false); },
                placeholder: 'Masukkan PIN',
                className: 'font-mono',
                style: { textAlign: 'center', fontSize: '18px', letterSpacing: '0.25em' }
              }),
              pinError && h('div', { style: { color: '#E11D48', fontSize: '11px', fontWeight: 800 } }, 'PIN salah!'),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setPinInputModal(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-pink' }, 'Buka Akses')
              )
            )
          )
        ),

        // MODAL CLONE DAY
        cloneModalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { maxWidth: '360px', display: 'flex', flexDirection: 'column', gap: '12px' } },
            h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, '📋 Salin Jadwal 1 Hari Penuh'),
            h('form', { onSubmit: handleCloneFullDay, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', { type: 'date', required: true, value: cloneTargetDate, onChange: e => setCloneTargetDate(e.target.value) }),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setCloneModalOpen(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-pink' }, 'Salin Sekarang')
              )
            )
          )
        ),

        // MODAL TAMBAH / EDIT JADWAL
        modalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
            h('div', { className: 'flex items-center justify-between', style: { borderBottom: '1.5px solid #F9A8D4', paddingBottom: '8px' } },
              h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, selectedSchedule ? '✏️ Edit Jadwal' : '✨ Tambah Jadwal Baru'),
              h('button', { className: 'btn btn-soft', onClick: () => setModalOpen(false) }, '✕')
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px' } },
              [
                { b: 'b_momuung', name: 'Mom Uung', n: 1, st: '05:00', en: '13:00' },
                { b: 'b_momuung', name: 'Mom Uung', n: 2, st: '11:00', en: '19:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 1, st: '08:00', en: '12:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 2, st: '12:00', en: '16:00' }
              ].map((p, idx) => h('button', {
                key: idx, type: 'button', className: 'btn btn-soft',
                onClick: () => applyPresetShift(p.b, p.name, p.n, p.st, p.en)
              }, `⚡ Shift ${p.n} ${p.name} (${p.st}-${p.en})`))
            ),
            h('form', { onSubmit: handleSave, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', {
                type: 'text', required: true, placeholder: 'Judul Shift / Aktivitas...', value: formData.title,
                onChange: e => setFormData({ ...formData, title: e.target.value })
              }),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('select', { value: formData.brand_id, onChange: e => setFormData({ ...formData, brand_id: e.target.value }) },
                  brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
                ),
                h('select', { value: formData.status, onChange: e => setFormData({ ...formData, status: e.target.value }) },
                  ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF', 'Sakit / Medis'].map(st => h('option', { key: st, value: st }, st))
                )
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('input', { type: 'date', required: true, value: formData.date, onChange: e => setFormData({ ...formData, date: e.target.value }) }),
                !selectedSchedule && h('select', { value: repeatDays, onChange: e => setRepeatDays(Number(e.target.value)) },
                  [1, 2, 3, 5, 7].map(d => h('option', { key: d, value: d }, `Ulangi ${d} Hari`))
                )
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('select', { className: 'font-mono', value: formData.start_time, onChange: e => setFormData({ ...formData, start_time: e.target.value }) },
                  START_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                ),
                h('select', { className: 'font-mono', value: formData.end_time, onChange: e => setFormData({ ...formData, end_time: e.target.value }) },
                  END_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                )
              ),
              currentFormConflict && h('div', { style: { background: '#FFE4E6', border: '1.5px solid #E11D48', color: '#9F1239', padding: '8px', borderRadius: '10px', fontSize: '11px', fontWeight: 800 } },
                `⛔ Jam bentrok dengan "${currentFormConflict.title}" (${currentFormConflict.start_time}-${currentFormConflict.end_time})`
              ),
              h('textarea', {
                rows: 2, placeholder: 'Catatan / Target GMV...', value: formData.notes,
                onChange: e => setFormData({ ...formData, notes: e.target.value })
              }),
              h('div', { className: 'flex items-center justify-between', style: { marginTop: '4px' } },
                selectedSchedule
                  ? h('button', { type: 'button', className: 'btn btn-soft', style: { color: '#E11D48' }, onClick: () => handleDelete(selectedSchedule.id) }, '🗑️ Hapus')
                  : h('span'),
                h('div', { className: 'flex gap-2' },
                  h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setModalOpen(false) }, 'Batal'),
                  h('button', { type: 'submit', disabled: !!currentFormConflict, className: 'btn btn-pink' }, 'Simpan ke Cloud')
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(WorkApp));
  </script>
</body>
</html>
