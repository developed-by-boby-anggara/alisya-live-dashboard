      const getSessionTimeState = (item) => {
        if (item.date < realTodayStr) return 'done';
        if (item.date > realTodayStr) return 'upcoming';
        const nowMin = nowTime.getHours() * 60 + nowTime.getMinutes();
        const sMin = timeToMinutes(item.start_time);
        let eMin = timeToMinutes(item.end_time);
        if (eMin <= sMin) eMin = 24 * 60;
        if (nowMin >= eMin) return 'done';
        if (nowMin >= sMin && nowMin < eMin) return 'live';
        return 'upcoming';
      };

      // Mesin Countdown Real-Time per Detik (Sama Persis dengan index.html)
      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF' && s.status !== 'SAKIT' && s.status !== 'Sakit / Medis' && s.brand_id !== 'b_sakit')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowTotalSeconds = nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();
        const toSec = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 3600;
          const [hr, mn] = tStr.split(':').map(Number);
          return hr * 3600 + mn * 60;
        };

        let activeItem = null, nextItem = null, completedCount = 0;

        todayList.forEach(item => {
          const sSec = toSec(item.start_time);
          let eSec = toSec(item.end_time);
          if (eSec <= sSec) eSec = 24 * 3600;

          if (nowTotalSeconds >= sSec && nowTotalSeconds < eSec) {
            const remSec = eSec - nowTotalSeconds;
            const totalDurSec = Math.max(1, eSec - sSec);
            const sessionPct = Math.min(100, Math.max(0, (((nowTotalSeconds - sSec) / totalDurSec) * 100).toFixed(1)));
            activeItem = { ...item, remainingSec: remSec, remainingHMS: formatSecondsToHMS(remSec), sessionPct };
          } else if (nowTotalSeconds >= eSec) {
            completedCount++;
          } else if (nowTotalSeconds < sSec && !nextItem) {
            const diffSec = sSec - nowTotalSeconds;
            nextItem = { ...item, startsInSec: diffSec, startsInHMS: formatSecondsToHMS(diffSec), startsInMin: Math.ceil(diffSec / 60) };
          }
        });

        const activeFraction = activeItem ? Number(activeItem.sessionPct) / 100 : 0;
        const progressPct = todayList.length > 0 ? Math.min(100, Math.round(((completedCount + activeFraction) / todayList.length) * 100)) : 0;

        return { activeItem, nextItem, progressPct, totalToday: todayList.length, completedCount };

      const broadcastMetrics = useMemo(() => {

            if (s.date < realTodayStr || (s.date === realTodayStr && state === 'done')) {
              completedLiveHours += calculateDurationHours(s.start_time, s.end_time);
            }
          }
        });
        const totalHours = 480 + Math.round(completedLiveHours);

        let totalPrimeSlots = 0, occupiedPrimeSlots = 0;
        for (let i = 0; i < 7; i++) {
          const dStr = addDaysToDateStr(realTodayStr, i);
          const dayList = schedules.filter(s => s.date === dStr && s.status !== 'OFF');
          TIME_SLOTS.forEach(slot => {
            totalPrimeSlots++;
            const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
            const isBusy = dayList.some(s => {
              const st = timeToMinutes(s.start_time);
              let en = timeToMinutes(s.end_time);
              if (en <= st) en = 24 * 60;
              return st < eM && en > sM;
            });
            if (isBusy) occupiedPrimeSlots++;
          });
        }
        const freeSlots = Math.max(0, totalPrimeSlots - occupiedPrimeSlots);
        let badge = '🟢 Schedule Active';
        if (freeSlots <= 10) badge = '🔒 Fully Booked This Week';
        else if (freeSlots <= 28) badge = '⚡ Limited Slots Remaining';

        return { totalHours, freeSlots, badge };
      }, [schedules, realTodayStr, nowTime]);

          grouped[s.date].push(s);

          const list = grouped[date].sort((a, b) => a.start_time.localeCompare(b.start_time));
          for (let i = 0; i < list.length - 1; i++) {
            const diffMin = timeToMinutes(list[i + 1].start_time) - timeToMinutes(list[i].end_time);
            if (diffMin > 0 && diffMin < 300) { map[date] = true; break; }

        if (isFree(prefStart, prefEnd)) return { start: prefStart, end: prefEnd };
        for (const slot of TIME_SLOTS) {

        return schedules.filter(s => {
          const [sY, sM, sD] = s.date.split('-').map(Number);
          const itemDate = new Date(sY, sM - 1, sD);
          if (statPeriod === 'daily') return s.date === customStatDate;
          if (statPeriod === 'weekly') {
            const [selY, selM, selD] = customStatDate.split('-').map(Number);
            const refDate = new Date(selY, selM - 1, selD);
            const startOfWeek = new Date(refDate);
            startOfWeek.setDate(refDate.getDate() - refDate.getDay());
            startOfWeek.setHours(0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);
            return itemDate >= startOfWeek && itemDate <= endOfWeek;
          }
          if (statPeriod === 'monthly') return sY === customStatYear && sM === (customStatMonth + 1);
          if (statPeriod === 'yearly') return sY === customStatYear;
          return true;
        });

        filteredByStatPeriod.forEach(s => {
          const dur = calculateDurationHours(s.start_time, s.end_time);
          if (s.status === 'LIVE') {
            totalLive++; totalLiveHours += dur;
            if (s.gmv) totalGMV += Number(s.gmv) || 0;
          } else if (s.status === 'OFF') totalOff++;
          else if (s.status === 'Meeting') totalMeeting++;
          else if (s.status === 'Tidur') { totalSleep++; totalSleepHours += (dur || 7); }
          else if (s.status === 'Konten' || s.brand_id === 'b_konten') { totalKonten++; totalKontenHours += dur; }
          else if (s.status === 'Me Time' || s.brand_id === 'b_lainlain') totalMeTime++;
        });

        totalLiveHours = Math.round(totalLiveHours * 10) / 10;
        totalSleepHours = Math.round(totalSleepHours * 10) / 10;

                        }
                      },
                        h('div', { style: { position: 'absolute', left: 0, top: 0, bottom: 0, width: '7px', background: item.color } }),
                        h('div', { className: 'flex-col gap-2', style: { flex: 1 } },
                          h('div', { className: 'flex flex-wrap items-center gap-2' },
                            h('span', { className: 'badge badge-neutral font-mono', style: { fontSize: '12px' } }, `⏰ ${item.start_time} - ${item.end_time}`),
                            isCurrentlyLive && h('span', { className: 'badge badge-live font-mono' }, `🟢 LIVE NOW • -${liveTracker.activeItem.remainingHMS}`),
                            !isCurrentlyLive && timeState === 'done' && h('span', { className: 'badge badge-neutral' }, t.badgeFinished),
                            !isCurrentlyLive && timeState === 'upcoming' && h('span', { className: 'badge badge-blue' }, t.badgeUpcoming),
                            h('span', {
                              className: 'badge',
                              style: { background: item.color + '35', color: '#0F172A', borderColor: item.color }
                            }, item.status),
                            h('span', { style: { fontSize: '12px', fontWeight: 700, color: '#475569' } }, `${brand?.emoji || ''} ${brand?.name || ''}`)
                          ),
                          h('div', { style: { fontSize: '16px', fontWeight: 800, color: '#0F172A' } }, item.title),
                          Number(item.gmv) > 0 && h('div', { className: 'badge badge-live font-mono', style: { alignSelf: 'flex-start' } },
                            `💰 GMV: Rp ${Number(item.gmv).toLocaleString('id-ID')}`
                          ),
                          item.notes && h('div', {
                            style: { background: '#F8FAFC', border: '1px solid #E2E8F0', padding: '8px 12px', borderRadius: '10px', fontSize: '12px', color: '#334155' }
                          }, `📌 ${item.notes}`),
                          renderKontenChecklist(item)
                        ),
                        h('div', { className: 'flex-col gap-2 items-end' },
                          h('button', {
                            type: 'button',
                            className: 'btn btn-outline',
                            style: { padding: '5px 10px', fontSize: '11px' },
                            onClick: e => handleExportToGoogleCalendar(e, item)
                          }, '📅 GCal'),
                          isAdmin && h('button', {
                            type: 'button',
                            className: 'btn btn-subtle',
                            style: { padding: '5px 10px', fontSize: '11px' },
                            onClick: e => { e.stopPropagation(); handleDuplicate(item); }
                          }, t.copyBtn)
                        )
                      );
                    })
              )
            )
          ),

          // =================================================================
          // TAB 2: SPREADSHEET CALENDAR
          // =================================================================
          activeTab === 'calendar' && h('div', { className: 'flex-col gap-4' },
            h('div', { className: 'card flex flex-wrap items-center justify-between gap-3' },
              h('div', { className: 'flex items-center gap-2 flex-wrap' },
                h('button', { className: 'btn btn-emerald', onClick: shareSpreadsheetToWA }, `📲 ${t.btnShareRekapWA}`),
                h('button', { className: 'btn btn-primary', onClick: () => exportElementAsPNG('work-spreadsheet-area', `${monthName}_${currentYear}`) }, `📸 ${t.btnDownloadTablePNG}`)
              ),
              h('div', { className: 'flex items-center gap-2 flex-wrap' },
                brands.map(b => h('span', { key: b.id, className: 'badge badge-neutral' },
                  h('span', { style: { width: '10px', height: '10px', borderRadius: '50%', background: b.color, display: 'inline-block' } }),
                  `${b.emoji} ${b.name}`
                ))
              )
            ),
            h('div', { id: 'work-spreadsheet-area', className: 'table-wrap' },
              h('table', null,
                h('thead', null,
                  h('tr', null,
                    h('th', { className: 'sticky-left', style: { minWidth: '170px', background: '#E2E8F0' } }, `💼 ${t.colDateTime}`),
                    h('th', { style: { minWidth: '120px', textAlign: 'center' } }, t.colDayStatus),
                    TIME_SLOTS.map(slot => h('th', { key: slot.label, className: 'font-mono', style: { minWidth: '105px', textAlign: 'center' } }, slot.label))
                  )
                ),
                h('tbody', null,
                  Array.from({ length: daysInMonth }).map((_, i) => {
                    const day = i + 1;
                    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dtObj = new Date(currentYear, currentMonth, day);
                    const dayName = new Intl.DateTimeFormat(t.locale, { weekday: 'short' }).format(dtObj);
                    const isToday = dateStr === realTodayStr;
                    const density = getDayScheduleDensity(dateStr);

                    return h('tr', { key: day, className: isToday ? 'today-row' : '' },
                      h('td', { className: 'sticky-left', style: { fontWeight: 800 } },
                        h('div', { className: 'flex items-center gap-2' },
                          h('span', { style: { fontSize: '14px', width: '22px' } }, day),
                          h('span', { style: { color: '#2563EB', textTransform: 'uppercase' } }, dayName),
                          isToday && h('span', { className: 'badge badge-blue', style: { marginLeft: 'auto', fontSize: '9px' } }, t.todayBadge)
                        )
                      ),
                      h('td', { style: { textAlign: 'center' } },
                        h('span', { className: `badge ${density.cls}` }, density.text)
                      ),
                      TIME_SLOTS.map(slot => {
                        const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
                        const slotItems = schedules.filter(s => {
                          if (s.date !== dateStr) return false;
                          const st = timeToMinutes(s.start_time);
                          let en = timeToMinutes(s.end_time);
                          if (en <= st) en = 24 * 60;
                          return st < eM && en > sM;
                        });
                        return h('td', {
                          key: slot.label,
                          onClick: () => slotItems.length > 0 ? (isAdmin ? handleOpenEdit(slotItems[0]) : notify(`⏰ ${slotItems[0].start_time}-${slotItems[0].end_time}: ${slotItems[0].title}`)) : handleOpenCreate(dateStr, slot.start, slot.end),
                          style: { verticalAlign: 'top', height: '48px', cursor: 'pointer' }
                        },
                          slotItems.map(item => h('div', {
                            key: item.id,
                            style: {
                              background: item.color, color: '#0F172A', padding: '4px 6px',
                              borderRadius: '6px', fontSize: '10px', fontWeight: 800, marginBottom: '3px',
                              border: '1px solid rgba(0,0,0,0.1)'
                            }
                          }, `${item.title} (${item.start_time}-${item.end_time})`))
                        );
                      })
                    );
                  })
                )
              )
            )
          ),

          // =================================================================
          // TAB 3: KPI & GRAFIK KERJA
          // =================================================================
          activeTab === 'kpi' && h('div', { className: 'flex-col gap-4' },
            h('div', { className: 'card flex flex-wrap items-center justify-between gap-3' },
              h('div', { className: 'flex items-center gap-2 flex-wrap' },
                ['daily', 'weekly', 'monthly', 'yearly'].map(p => h('button', {
                  key: p,
                  onClick: () => setStatPeriod(p),
                  className: `btn ${statPeriod === p ? 'btn-primary' : 'btn-subtle'}`,
                  style: { textTransform: 'capitalize' }
                }, p))
              ),
              (statPeriod === 'daily' || statPeriod === 'weekly') && h('input', {
                type: 'date', value: customStatDate, onChange: e => setCustomStatDate(e.target.value)
              })
            ),
            h('div', { className: 'grid-4' },
              [
                { label: t.totalLive, val: stats.totalLive, sub: `${stats.totalLiveHours} ${t.hoursLive}`, color: '#059669' },
                { label: t.takeKonten, val: stats.totalKonten, sub: `${stats.totalKontenHours} ${t.hoursProd}`, color: '#7C3AED' },
                { label: t.sleepTime, val: stats.totalSleep, sub: `${stats.totalSleepHours} ${t.hoursSleep}`, color: '#2563EB' },
                { label: t.offDay, val: stats.totalOff, sub: 'Full Days Off', color: '#DC2626' }
              ].map((k, idx) => h('div', { key: idx, className: 'card' },
                h('div', { style: { fontSize: '11px', fontWeight: 800, color: '#64748B' } }, k.label),
                h('div', { style: { fontSize: '28px', fontWeight: 800, color: k.color, marginTop: '6px' } }, k.val),
                h('div', { style: { fontSize: '12px', color: '#475569', marginTop: '4px', fontWeight: 600 } }, k.sub)
              ))
            ),
            h('div', { className: 'grid-2', style: { gridTemplateColumns: displayMode === 'mobile' ? '1fr' : '1fr 1fr' } },
              h('div', { className: 'card' },
                h('h3', { style: { fontSize: '13px', fontWeight: 800, marginBottom: '12px' } }, t.propTitle),
                h('div', { style: { height: '260px', position: 'relative' } }, h('canvas', { ref: donutCanvas }))
              ),
              h('div', { className: 'card' },
                h('h3', { style: { fontSize: '13px', fontWeight: 800, marginBottom: '12px' } }, t.barTitle),
                h('div', { style: { height: '260px', position: 'relative' } }, h('canvas', { ref: barCanvas }))
              )
            )
          ),

          // =================================================================
          // TAB 4: DAFTAR LENGKAP SEMUA JADWAL
          // =================================================================
          activeTab === 'list' && h('div', { className: 'card flex-col gap-4' },
            h('div', { className: 'flex flex-wrap items-center justify-between gap-2' },
              h('h3', { style: { fontSize: '15px', fontWeight: 800 } }, `📋 ${t.allRegistered} (${filteredSchedules.length})`),
              h('div', { className: 'flex flex-wrap items-center gap-2' },
                h('input', { type: 'text', placeholder: t.searchPlaceholder, value: searchQuery, onChange: e => setSearchQuery(e.target.value) }),
                h('select', { value: filterBrand, onChange: e => setFilterBrand(e.target.value) },
                  h('option', { value: 'ALL' }, t.allCategories),
                  brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
                ),
                h('select', { value: filterStatus, onChange: e => setFilterStatus(e.target.value) },
                  h('option', { value: 'ALL' }, t.allStatuses),
                  ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF'].map(st => h('option', { key: st, value: st }, st))
                ),
                h('input', { type: 'date', value: filterDate, onChange: e => setFilterDate(e.target.value) })
              )
            ),
            h('div', { className: 'table-wrap' },
              h('table', null,
                h('thead', null,
                  h('tr', null,
                    h('th', null, t.colDay),
                    h('th', null, t.colDate),
                    h('th', null, t.colHour),
                    h('th', null, t.colTitle),
                    h('th', null, t.colCategory),
                    h('th', null, t.colStatus),
                    h('th', null, t.colNotes),
                    isAdmin && h('th', null, t.colAction)
                  )
                ),
                h('tbody', null,
                  filteredSchedules.map(s => {
                    const brand = brands.find(b => b.id === s.brand_id);
                    return h('tr', { key: s.id },
                      h('td', { style: { fontWeight: 700 } }, getHariNama(s.date)),
                      h('td', { className: 'font-mono' }, s.date),
                      h('td', { className: 'font-mono', style: { fontWeight: 700, color: '#2563EB' } }, `${s.start_time} - ${s.end_time}`),
                      h('td', { style: { fontWeight: 800 } }, s.title),
                      h('td', null, `${brand?.emoji || ''} ${brand?.name || ''}`),
                      h('td', null, h('span', { className: 'badge', style: { background: s.color } }, s.status)),
                      h('td', { style: { color: '#64748B' } }, s.notes || '-'),
                      isAdmin && h('td', null,
                        h('div', { className: 'flex gap-2' },
                          h('button', { className: 'btn btn-subtle', onClick: () => handleOpenEdit(s) }, t.editBtn),
                          h('button', { className: 'btn btn-outline', style: { color: '#DC2626' }, onClick: () => handleDelete(s.id) }, t.deleteBtn)
                        )
                      )
                    );
                  })
                )
              )
            )
          ),

          // =================================================================
          // TAB 5: WARNA BRAND & KATEGORI
          // =================================================================
          activeTab === 'colors' && h('div', { className: 'card flex-col gap-3', style: { maxWidth: '600px', margin: '0 auto' } },
            h('h3', { style: { fontSize: '15px', fontWeight: 800 } }, `🏷️ ${t.tabColors}`),
            brands.map(b => h('div', { key: b.id, className: 'flex items-center justify-between', style: { padding: '10px 14px', background: '#F8FAFC', borderRadius: '12px', border: '1px solid #E2E8F0' } },
              h('div', { className: 'flex items-center gap-3' },
                h('input', {
                  type: 'color', disabled: !isAdmin, value: b.color,
                  onChange: e => {
                    const newColor = e.target.value;
                    saveBrandsToCloud(brands.map(it => it.id === b.id ? { ...it, color: newColor } : it));
                    saveSchedulesToCloud(schedules.map(s => s.brand_id === b.id ? { ...s, color: newColor } : s));
                  },
                  style: { width: '36px', height: '36px', padding: '2px', cursor: 'pointer' }
                }),
                h('span', { style: { fontWeight: 800, fontSize: '13px' } }, `${b.emoji} ${b.name}`)
              ),
              h('span', { className: 'font-mono', style: { fontSize: '12px', color: '#64748B' } }, b.color)
            ))
          )
        ),

        // MODAL PIN ADMIN
        pinInputModal && h('div', { className: 'modal-backdrop' },
          h('div', { className: 'modal-card', style: { maxWidth: '340px', textAlign: 'center' } },
            h('h3', { style: { fontSize: '16px', fontWeight: 800, marginBottom: '12px' } }, '🔑 Login Admin'),
            h('form', { onSubmit: handleVerifyPin, className: 'flex-col gap-3' },
              h('input', {
                type: 'password', maxLength: 6, autoFocus: true, value: enteredPin,
                onChange: e => { setEnteredPin(e.target.value); setPinError(false); },
                placeholder: 'Masukkan PIN',
                className: 'font-mono',
                style: { textAlign: 'center', fontSize: '18px', letterSpacing: '0.2em' }
              }),
              pinError && h('div', { style: { color: '#DC2626', fontSize: '12px', fontWeight: 700 } }, 'PIN salah!'),
              h('div', { className: 'grid-2' },
                h('button', { type: 'button', className: 'btn btn-subtle', style: { justifyContent: 'center' }, onClick: () => setPinInputModal(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-primary', style: { justifyContent: 'center' } }, 'Buka Akses')
              )
            )
          )
        ),

        // MODAL CLONE DAY
        cloneModalOpen && h('div', { className: 'modal-backdrop' },
          h('div', { className: 'modal-card flex-col gap-3', style: { maxWidth: '380px' } },
            h('h3', { style: { fontSize: '15px', fontWeight: 800 } }, '📋 Salin Semua Jadwal Hari Ini'),
            h('form', { onSubmit: handleCloneFullDay, className: 'flex-col gap-3' },
              h('input', { type: 'date', required: true, value: cloneTargetDate, onChange: e => setCloneTargetDate(e.target.value) }),
              h('div', { className: 'grid-2' },
                h('button', { type: 'button', className: 'btn btn-subtle', style: { justifyContent: 'center' }, onClick: () => setCloneModalOpen(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-primary', style: { justifyContent: 'center' } }, 'Salin Sekarang')
              )
            )
          )
        ),

        // MODAL TAMBAH / EDIT JADWAL
        modalOpen && h('div', { className: 'modal-backdrop' },
          h('div', { className: 'modal-card flex-col gap-3' },
            h('div', { className: 'flex items-center justify-between', style: { borderBottom: '1px solid #E2E8F0', paddingBottom: '10px' } },
              h('h3', { style: { fontSize: '15px', fontWeight: 800 } }, selectedSchedule ? '✏️ Edit Jadwal' : '➕ Tambah Jadwal Baru'),
              h('button', { className: 'btn btn-subtle', onClick: () => setModalOpen(false) }, '✕')
            ),
            h('div', { className: 'grid-2' },
              [
                { b: 'b_momuung', name: 'Mom Uung', n: 1, st: '05:00', en: '13:00' },
                { b: 'b_momuung', name: 'Mom Uung', n: 2, st: '11:00', en: '19:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 1, st: '08:00', en: '12:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 2, st: '12:00', en: '16:00' }
              ].map((p, idx) => h('button', {
                key: idx, type: 'button', className: 'btn btn-outline',
                onClick: () => applyPresetShift(p.b, p.name, p.n, p.st, p.en)
              }, `⚡ Shift ${p.n} ${p.name} (${p.st}-${p.en})`))
            ),
            h('form', { onSubmit: handleSave, className: 'flex-col gap-3' },
              h('input', {
                type: 'text', required: true, placeholder: 'Judul Shift / Aktivitas...', value: formData.title,
                onChange: e => setFormData({ ...formData, title: e.target.value })
              }),
              h('div', { className: 'grid-2' },
                h('select', { value: formData.brand_id, onChange: e => setFormData({ ...formData, brand_id: e.target.value }) },
                  brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
                ),
                h('select', { value: formData.status, onChange: e => setFormData({ ...formData, status: e.target.value }) },
                  ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF', 'Sakit / Medis'].map(st => h('option', { key: st, value: st }, st))
                )
              ),
              h('div', { className: 'grid-2' },
                h('input', { type: 'date', required: true, value: formData.date, onChange: e => setFormData({ ...formData, date: e.target.value }) }),
                !selectedSchedule && h('select', { value: repeatDays, onChange: e => setRepeatDays(Number(e.target.value)) },
                  [1, 2, 3, 5, 7].map(d => h('option', { key: d, value: d }, `Ulangi ${d} Hari`))
                )
              ),
              h('div', { className: 'grid-2' },
                h('select', { className: 'font-mono', value: formData.start_time, onChange: e => setFormData({ ...formData, start_time: e.target.value }) },
                  START_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                ),
                h('select', { className: 'font-mono', value: formData.end_time, onChange: e => setFormData({ ...formData, end_time: e.target.value }) },
                  END_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                )
              ),
              currentFormConflict && h('div', { className: 'badge badge-danger', style: { padding: '8px 12px' } },
                `⛔ Jam bentrok dengan "${currentFormConflict.title}" (${currentFormConflict.start_time}-${currentFormConflict.end_time})`
              ),
              h('textarea', {
                rows: 2, placeholder: 'Catatan / Target GMV...', value: formData.notes,
                onChange: e => setFormData({ ...formData, notes: e.target.value })
              }),
              h('div', { className: 'flex items-center justify-between', style: { marginTop: '6px' } },
                selectedSchedule
                  ? h('button', { type: 'button', className: 'btn btn-outline', style: { color: '#DC2626', borderColor: '#FCA5A5' }, onClick: () => handleDelete(selectedSchedule.id) }, '🗑️ Hapus')
                  : h('span'),
                h('div', { className: 'flex gap-2' },
                  h('button', { type: 'button', className: 'btn btn-subtle', onClick: () => setModalOpen(false) }, 'Batal'),
                  h('button', { type: 'submit', disabled: !!currentFormConflict, className: 'btn btn-primary' }, 'Simpan ke Cloud')
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(WorkApp));
  </script>
</body>
</html>
