  <style>
    :root {
      --bg-pink-main: #FCE7F3;

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-pink-main);
      background-image: radial-gradient(#F9A8D4 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      color: var(--text-dark);
     font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #FCE7F3; }

    .exec-header {
      background: linear-gradient(110deg, #831843 0%, #BE185D 55%, #9D174D 100%);
      border-bottom: 2px solid #F9A8D4;
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 6px 20px rgba(131, 24, 67, 0.25);
      color: #FFFFFF;
    }
    /* 💎 V6.0-PRO: SEAMLESS LIVE COMMAND TICKER & INFINITE LOGO CAROUSEL */
    .exec-ticker {
      background: linear-gradient(90deg, #4C0519 0%, #831843 50%, #4C0519 100%);
      color: #FCE7F3;
      border-bottom: 1.5px solid #F472B6;
      padding: 8px 0;
      overflow: hidden;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.1);
    }
    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      display: flex;
      mask-image: linear-gradient(to right, transparent, #000 2%, #000 98%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 2%, #000 98%, transparent);
    }
    @keyframes seamlessMarquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
    .ticker-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      min-width: 100%;
      gap: 14px;
      padding-right: 14px;
      animation: seamlessMarquee 34s linear infinite;
      will-change: transform;
    }
    .exec-ticker:hover .ticker-group {
      animation-play-state: paused;
    }
    .ticker-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .exec-nav {
      background: linear-gradient(90deg, #500724 0%, #831843 50%, #500724 100%);
      border-bottom: 2px solid #F472B6;
      padding: 9px 14px;
      position: sticky;
      top: 56px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      box-shadow: 0 6px 18px rgba(80, 7, 36, 0.28);
    }
    .wrap-pc { max-width: 1520px; margin: 0 auto; padding: 20px; }
    .wrap-hp { max-width: 540px; margin: 0 auto; padding: 10px; }

    .exec-card {
      background: var(--bg-pink-card);
      border: 2px solid var(--border-soft);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(157, 23, 77, 0.08);
      color: var(--text-dark);
    }
    .radar-card {
      background: linear-gradient(135deg, #9D174D 0%, #BE185D 52%, #831843 100%);
      border: 2px solid #F9A8D4;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(131, 24, 67, 0.28);
      color: #FFFFFF;
    }
/* 🚨 V2.7: Animasi Banner Siaga 15 Menit & Kolom Jam Aktif Spreadsheet */
    /* ✨ LIVE ACTIVE LEGEND BEACON (CAHAYA MEMUTAR + SHIMMER BERKILAU) */
    @property --beam-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes legendBeamSpin {
      0% { --beam-angle: 0deg; }
      100% { --beam-angle: 360deg; }
    }
    @keyframes legendShimmerSweep {
      0% { transform: translateX(-140%) skewX(-20deg); }
      55%, 100% { transform: translateX(240%) skewX(-20deg); }
    }
    @keyframes legendGlowPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35), 0 4px 14px rgba(219, 39, 119, 0.28); }
      50% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.15), 0 6px 22px rgba(16, 185, 129, 0.45); }
    }
    .legend-item-active {
      position: relative;
      overflow: hidden;
      border: 2px solid transparent !important;
      background:
        linear-gradient(#FFFFFF, #FFF0F6) padding-box,
        conic-gradient(from var(--beam-angle), #10B981, #FDE047, #EC4899, #38BDF8, #10B981) border-box !important;
      animation: legendBeamSpin 2.4s linear infinite, legendGlowPulse 1.8s ease-in-out infinite;
      transform: scale(1.03);
      z-index: 2;
    }
    .legend-item-active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.78), transparent);
      animation: legendShimmerSweep 2.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes standbyPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.55), 0 10px 25px rgba(180, 83, 9, 0.35); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0), 0 10px 30px rgba(180, 83, 9, 0.55); }
    }
    .standby-alert-banner {
      background: linear-gradient(135deg, #78350F 0%, #B45309 50%, #991B1B 100%);
      border: 2px solid #FDE047;
      border-radius: 20px;
      padding: 15px 18px;
      color: #FFFFFF;
      animation: standbyPulse 2s infinite;
    }
    .active-time-col-header {
      background: #059669 !important;
      color: #FFFFFF !important;
      border: 2px solid #A7F3D0 !important;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.25);
    }
    .active-time-col-cell {
      background: rgba(16, 185, 129, 0.12) !important;
      border-left: 2px dashed #10B981 !important;
      border-right: 2px dashed #10B981 !important;
    }
    /* 🔔 HIGHLIGHT SUPER-ALERT UNTUK ANTREAN BOOKING WA */
    @keyframes queueBeaconPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7), 0 4px 14px rgba(245, 158, 11, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 7px rgba(225, 29, 72, 0), 0 6px 20px rgba(225, 29, 72, 0.65);
      }
    }
    .nav-pill-alert {
      background: linear-gradient(135deg, #F59E0B 0%, #E11D48 100%) !important;
      color: #FFFFFF !important;
      border: 2px solid #FEF08A !important;
      font-weight: 900 !important;
      animation: queueBeaconPulse 1.5s ease-in-out infinite !important;
      position: relative;
    }
    .pending-top-alert-bar {
      background: linear-gradient(135deg, #991B1B 0%, #D97706 55%, #B45309 100%);
      border: 2px solid #FDE047;
      border-radius: 20px;

      animation: queueBeaconPulse 2s ease-in-out infinite;

    /* Banner Panduan Booking Klien */
    .guide-banner {

    .agenda-grid-pc {

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.96); }

    input, select, textarea {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-dark);
      background: #FFFFFF;
      border: 1.5px solid #F472B6;
      border-radius: 11px;

      outline: none;

    input:focus, select:focus, textarea:focus {

      box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.18);

    select option:disabled {

    .cal-grid-pc {

        if (/Windows/i.test(ua)) osName = 'Windows';

        else if (/iPhone|iPad|iPod/i.test(ua)) osName = 'iOS';
        else if (/Mac OS X/i.test(ua)) osName = 'macOS';
        else if (/Linux/i.test(ua)) osName = 'Linux';

        let browserName = 'Browser';
       if (ua.includes('Edg/')) browserName = 'Edge';
        else if (ua.includes('OPR/') || ua.includes('Opera')) browserName = 'Opera';
        else if (ua.includes('Chrome/')) browserName = 'Chrome';
        else if (ua.includes('Safari/')) browserName = 'Safari';
        else if (ua.includes('Firefox/')) browserName = 'Firefox';

        return {
          deviceType: isMobile ? 'HP / Mobile' : 'PC / Desktop',
          platform: `${osName} • ${browserName}`,
          screenSize: `${window.innerWidth}x${window.innerHeight}`,

      const fetchWithTimeout = async (url, ms = 2000) => {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), ms);
        try {
          const resp = await fetch(url, { signal: ctrl.signal });
          clearTimeout(tid);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return await resp.json();
        } catch (err) {
          clearTimeout(tid);
          throw err;
        }
      };

      const fetchApproxGeo = async () => {
        // Provider 1: ipapi.co
        try {
          const d1 = await fetchWithTimeout('https://ipapi.co/json/', 2000);
          if (d1 && (d1.city || d1.region || d1.country_name)) {
            const loc1 = [d1.city, d1.region, d1.country_name].filter(Boolean).join(', ');
            const isp1 = d1.org ? ` (${d1.org})` : '';
            return { location: loc1 + isp1, ip: d1.ip || '-', provider: 'ipapi' };
          }
        } catch (e) {}

        // Provider 2: ipwho.is (Cadangan 1)
        try {
          const d2 = await fetchWithTimeout('https://ipwho.is/', 2000);
          if (d2 && d2.success !== false && (d2.city || d2.region || d2.country)) {
            const loc2 = [d2.city, d2.region, d2.country].filter(Boolean).join(', ');
            const isp2 = d2.connection && d2.connection.isp ? ` (${d2.connection.isp})` : '';
            return { location: loc2 + isp2, ip: d2.ip || '-', provider: 'ipwhois' };
          }
        } catch (e) {}

        // Provider 3: freeipapi.com (Cadangan 2)
        try {
          const d3 = await fetchWithTimeout('https://freeipapi.com/api/json', 2000);
          if (d3 && (d3.cityName || d3.regionName || d3.countryName)) {
            const loc3 = [d3.cityName, d3.regionName, d3.countryName].filter(Boolean).join(', ');
            return { location: loc3, ip: d3.ipAddress || '-', provider: 'freeipapi' };
          }
        } catch (e) {}

        return { location: 'Lokasi terbatas / terblokir', ip: '-', provider: 'none' };
      };

      const findScheduleCollision = (dateStr, startStr, endStr, excludeId = null, extraItems = []) => {
        if (!dateStr || !startStr || !endStr || startStr === endStr) return null;
        const sMin = timeToMinutes(startStr);
        const rawEnd = timeToMinutes(endStr);
        const crossesMidnight = rawEnd > 0 && rawEnd < sMin;

          const list = [];

            const st = timeToMinutes(s.start_time);
            const re = timeToMinutes(s.end_time);
            const cross = re > 0 && re < st;
            if (s.date === targetDate) {
              list.push({ ...s, effStartMin: st, effEndMin: re <= st ? 1440 : re });
            } else if (s.date === prevDate && cross) {
              list.push({ ...s, effStartMin: 0, effEndMin: re });
            }
          });
          return list;
        };

        const todayItems = getCoveringFromPool(dateStr);
        const hitToday = todayItems.find(ex => {
          if (ex.status === 'OFF') return true;
          return sMin < ex.effEndMin && eMinToday > ex.effStartMin;
        });
        if (hitToday) return { ...hitToday, collisionDate: dateStr };

        if (crossesMidnight) {
          const nextDate = addDaysToDateStr(dateStr, 1);
          const nextItems = getCoveringFromPool(nextDate);
          const hitNext = nextItems.find(ex => {
            if (ex.status === 'OFF') return true;

     // 🤖 V2.12: MESIN PENGIRIM PESAN BOT WA OTOMATIS (100% FULL BACKGROUND)
      const formatWaPhone = (raw) => {
        const digits = String(raw || '').replace(/\D/g, '');
        if (!digits) return '';
        if (digits.startsWith('0')) return '62' + digits.slice(1);
        if (digits.startsWith('8')) return '62' + digits;
        return digits;
      };

      const getFreeRangesForDate = (dStr) => {
        const dayItems = schedules.filter(s => s.date === dStr && s.status !== 'PENDING');
        if (dayItems.some(s => s.status === 'OFF' || s.status === 'SAKIT' || s.status === 'Sakit / Medis' || s.brand_id === 'b_sakit')) {
          return [];
        }
        const winStart = 420; // 07:00
        const winEnd = 1380;  // 23:00
        const toHHMM = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        const busy = dayItems.map(s => {
          const st = timeToMinutes(s.start_time);
          let en = timeToMinutes(s.end_time);
          if (en <= st) en = 1440;
          return { start: Math.max(winStart, st), end: Math.min(winEnd, en) };
        }).filter(b => b.end > b.start).sort((a, b) => a.start - b.start);

        let cursor = winStart;
        const ranges = [];
        busy.forEach(b => {
          if (b.start - cursor >= 60) ranges.push(`${toHHMM(cursor)}–${toHHMM(b.start)} WIB`);
          cursor = Math.max(cursor, b.end);
        });
        if (winEnd - cursor >= 60) ranges.push(`${toHHMM(cursor)}–${toHHMM(winEnd)} WIB`);
        return ranges;
      };

      const sendViaBotWA = async (rawTargetPhone, messageText) => {
        const target = formatWaPhone(rawTargetPhone);
        if (!target) return { ok: false, reason: 'Nomor WA tujuan kosong.' };
        if (!BOT_WEBAPP_URL || BOT_WEBAPP_URL.includes('TEMPEL_URL')) {
          return { ok: false, reason: 'URL Aplikasi Web Bot belum diisi.' };
        }
        try {
          const res = await fetch(BOT_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              secret: BOT_SECRET_KEY,
              target: target,
              message: messageText
            })
          });
          const data = await res.json();
          if (data && data.status === true) {
            return { ok: true, data };
          }
          return { ok: false, reason: (data && data.reason) ? data.reason : 'Bot gagal mengirim pesan.' };
        } catch (err) {
          return { ok: false, reason: err.message || 'Gangguan koneksi ke server bot.' };
        }
      };

        if (uniqueTargets.length === 0) uniqueTargets.push(ADMIN_WA_NUMBER);
        const results = await Promise.all(uniqueTargets.map(num => sendViaBotWA(num, messageText)));
        return {
          ok: results.some(r => r.ok),

          const wakeStart = 420; // 07:00
          const wakeEnd = 1380;  // 23:00
          let busyDayMin = calcOverlap(wakeStart, wakeEnd, bufStart, bufEnd);
          normalized.filter(s => !s.isOffOrSick && !s.isSleep).forEach(w => {
            busyDayMin += calcOverlap(wakeStart, wakeEnd, w.absStart, w.absEnd);
          });
          const restAndMealHours = Math.round((Math.max(0, (wakeEnd - wakeStart) - busyDayMin) / 60) * 10) / 10;

          // 7. Hitung Slot Kosong Presisi (Exact Free Windows >= 60 menit di tanggal tersebut)
          const exactFreeSlots = [];
          if (!offOnDay) {
            const busyIntervals = sameDayItems
              .filter(s => !s.isSleep)
              .map(s => ({ start: Math.max(0, s.absStart), end: Math.min(1440, s.absEnd) }))
              .sort((a, b) => a.start - b.start);

            let cursor = isTodayCheck ? Math.min(1440, Math.ceil(nowMinuteOfDay / 30) * 30) : 0;
            busyIntervals.forEach(b => {
              if (b.start - cursor >= 60) {
                exactFreeSlots.push({ start: minToHHMM(cursor), end: minToHHMM(b.start) });
              }
              cursor = Math.max(cursor, b.end);
            });
            if (1440 - cursor >= 60) {
              exactFreeSlots.push({ start: minToHHMM(cursor), end: '23:59' });
            }
          }

          // 8. Status & Alasan Real-Time Terhubung
          let status = 'ok';
          let statusLabel = '✅ Tersedia';
          let reasonText = '';

          if (isPastDate) {
            status = 'blocked';
            statusLabel = '❌ Tanggal Berlalu';
            reasonText = `Tanggal ${dStr} sudah lewat dari hari ini (${realTodayStr}).`;
          } else if (isPastHourToday) {

            statusLabel = '❌ Jam Sudah Lewat';
            reasonText = `Pukul ${simStartTime} WIB hari ini sudah terlewat (sekarang pukul ${liveClockString.slice(0, 5)} WIB).`;
          } else if (offOnDay || offNextOvernight) {
            status = 'blocked';
            statusLabel = '❌ Tidak Tersedia';
            const tOff = offOnDay || offNextOvernight;
            reasonText = `Tidak bisa diambil karena bertepatan dengan agenda ${tOff.title} [${tOff.status}].`;
          } else if (workConflicts.length > 0) {
            status = 'blocked';
            statusLabel = '❌ Tidak Tersedia';
            const conflictList = workConflicts.map(c => `"${c.title}" (${c.start_time}–${c.end_time} WIB)`).join(', ');
            reasonText = `Tidak bisa diambil karena jam menabrak jadwal ${conflictList}.`;
          } else if (isTooSoonToday) {
            status = 'warning';
            statusLabel = '⚠️ Waktu Terlalu Dekat';
            reasonText = `Sisa waktu dari sekarang (${liveClockString.slice(0, 5)} WIB) kurang dari jeda perjalanan/persiapan ${simTravelMin} menit.`;
          } else if (travelConflicts.length > 0) {
            status = 'warning';
            statusLabel = '⚠️ Jeda Mepet';
            const nearList = travelConflicts.map(tc => `"${tc.title}" (${tc.start_time}–${tc.end_time} WIB)`).join(', ');
            reasonText = `Slot jam kosong, namun jeda perjalanan/persiapan (${simTravelMin} menit) terlalu mepet dengan ${nearList}.`;
          } else if (sleepHours < 5 || restAndMealHours < 2) {
            status = 'warning';
            statusLabel = '⚠️ Istirahat Terbatas';
            if (sleepHours < 5 && workAfter) {
              reasonText = `Slot kosong, namun waktu bobo hanya tersisa ${sleepHours} jam karena jadwal berikutnya "${workAfter.title}" mulai pukul ${workAfter.start_time} WIB.`;
            } else if (sleepHours < 5) {
              reasonText = `Slot kosong, namun mengambil jam ini memotong waktu bobo sehingga hanya tersisa ${sleepHours} jam.`;
            } else {
              reasonText = `Slot kosong, namun total jeda istirahat & makan harian hanya tersisa ${restAndMealHours} jam.`;
            }
          } else {
            reasonText = `Slot tersedia. Tersisa ${restAndMealHours} jam untuk istirahat/makan dan ${sleepHours} jam untuk bobo malam.`;
          }

          const restSubText = (gapBefore !== null || gapAfter !== null)
            ? `${gapBefore !== null ? `Jeda sebelum: ${gapBefore}j` : 'Pagi/siang kosong'} • ${gapAfter !== null ? `Jeda sesudah: ${gapAfter}j` : 'Sore/malam kosong'}`
            : 'Dari jam kosong jadwal harian';

          const sleepSubText = hasExplicitSleep
            ? (sleepCutReq > 0 ? `Terpotong ${Math.round((sleepCutReq / 60) * 10) / 10}j dari jadwal Bobo` : 'Sesuai jadwal Bobo malam')
            : 'Estimasi tidur malam tersedia';

          return {
            date: dStr,
            dayName: getHariNama(dStr),
            status,
            statusLabel,
            reasonText,
            restAndMealHours,
            restSubText,
            sleepHours,

        });

              h('div', { style: { fontSize: '11px', fontWeight: 900, color: '#831843', marginBottom: '6px' } }, `📜 Riwayat Pengingat Terkirim (${reminderHistory.length})`),
              reminderHistory.length === 0
                ? h('div', { style: { fontSize: '11px', color: '#701A46', background: '#FFFFFF', padding: '12px', borderRadius: '10px', border: '1px dashed #F9A8D4', textAlign: 'center' } }, 'Belum ada pengingat yang terkirim.')
                : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '5px', maxHeight: '160px', overflowY: 'auto' } },
                    reminderHistory.map(rh => h('div', {
                      key: rh.key,
                      style: { background: '#FFFFFF', border: '1px solid #F9A8D4', borderRadius: '9px', padding: '6px 10px', fontSize: '10.5px' }
                    },
                      h('div', { style: { fontWeight: 900, color: '#4A0424' } }, `✅ ${rh.title} (${rh.start_time} WIB)`),
                      h('div', { className: 'font-mono', style: { fontSize: '9.5px', color: '#059669' } }, `Terkirim H-${rh.leadMinutes}m • ${rh.sentAtWIB}`)
                    ))
                  )
            )
          )
        ),

        // 🔍 MODAL ZOOM PREVIEW LOGO & DETAIL BRAND COLLABORATION
        zoomedBrandIdx !== null && COLLAB_BRAND_SHOWCASE[zoomedBrandIdx] && (() => {
          const item = COLLAB_BRAND_SHOWCASE[zoomedBrandIdx];
          const total = COLLAB_BRAND_SHOWCASE.length;
          return h('div', {
            className: 'modal-overlay',
            style: { zIndex: 90, backdropFilter: 'blur(6px)' },
            onClick: () => setZoomedBrandIdx(null)
          },
            h('div', {
              className: 'modal-box brand-zoom-card',
              style: { maxWidth: '430px', textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '12px' },
              onClick: e => e.stopPropagation()
            },
              h('div', { className: 'flex items-center justify-between gap-2' },
                h('span', {
                  style: {
                    fontSize: '10px', fontWeight: 900,
                    background: item.isLiveHost ? '#D1FAE5' : '#FCE7F3',
                    color: item.isLiveHost ? '#065F46' : '#9D174D',
                    padding: '4px 10px', borderRadius: '999px',
                    border: `1px solid ${item.isLiveHost ? '#6EE7B7' : '#F472B6'}`
                  }
                }, `${item.roleBadge} • #${zoomedBrandIdx + 1}/${total}`),
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setZoomedBrandIdx(null) }, '✕ Tutup')
              ),
              h('div', {
                style: {
                  background: '#FFFFFF', border: '2.5px solid #F472B6', borderRadius: '20px',
                  padding: '20px', height: '230px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  boxShadow: '0 10px 25px rgba(157, 23, 77, 0.14)'
                }
              },
                h('img', {
                  src: item.src,
                  alt: item.name,
                  style: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', borderRadius: '14px' }
                })
              ),
              h('div', null,
                h('div', { style: { fontSize: '20px', fontWeight: 900, color: '#4A0424' } }, item.name),
                h('div', { style: { fontSize: '11.5px', fontWeight: 800, color: '#DB2777', marginTop: '2px' } }, item.categoryLabel),
                h('p', {
                  style: {
                    marginTop: '8px', background: '#FFFFFF', border: '1px solid #F9A8D4',
                    borderRadius: '12px', padding: '9px 12px', fontSize: '11.5px',
                    color: '#4A0424', lineHeight: 1.45, fontWeight: 600
                  }
                }, item.desc)
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('button', {
                  type: 'button',
                  className: 'btn btn-soft',
                  onClick: () => setZoomedBrandIdx((zoomedBrandIdx - 1 + total) % total)
                }, '◀ Brand Sebelumnya'),
                h('button', {
                  type: 'button',
                  className: 'btn btn-soft',
                  onClick: () => setZoomedBrandIdx((zoomedBrandIdx + 1) % total)
                }, 'Brand Berikutnya ▶')
              )
            )
          );
        })(),

        // MODAL PIN ADMIN
        pinInputModal && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { maxWidth: '320px', textAlign: 'center' } },
            h('h3', { style: { fontSize: '15px', fontWeight: 900, color: '#831843', marginBottom: '12px' } }, '🔑 Admin Access'),
            h('form', { onSubmit: handleVerifyPin, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', {
                type: 'password', maxLength: 6, autoFocus: true, value: enteredPin,
                onChange: e => { setEnteredPin(e.target.value); setPinError(false); },
                placeholder: 'Masukkan PIN',
                className: 'font-mono',
                style: { textAlign: 'center', fontSize: '18px', letterSpacing: '0.25em' }
              }),
              pinError && h('div', { style: { color: '#E11D48', fontSize: '11px', fontWeight: 800 } }, 'PIN salah!'),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setPinInputModal(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-pink' }, 'Buka Akses')
              )
            )
          )
        ),
// ⚡ V2.15: MODAL INPUT CEPAT JADWAL 1 BULAN PENUH (MOM UUNG)
        bulkModalOpen && (() => {
          const bulkDaysCount = new Date(bulkYear, bulkMonth + 1, 0).getDate();
          const parsedTokens = parseBulkShiftTokens(bulkPatternText, bulkDaysCount);
          const countMap = { '1': 0, '2': 0, '3': 0, '4': 0, 'L': 0 };
          parsedTokens.forEach(tk => { if (countMap[tk] !== undefined) countMap[tk]++; });
          const totalShiftWork = countMap['1'] + countMap['2'] + countMap['3'] + countMap['4'];

          return h('div', { className: 'modal-overlay' },
            h('div', { className: 'modal-box', style: { maxWidth: '560px', display: 'flex', flexDirection: 'column', gap: '11px' } },
              h('div', { className: 'flex items-center justify-between', style: { borderBottom: '1.5px solid #F9A8D4', paddingBottom: '9px' } },
                h('div', null,
                  h('span', { style: { fontSize: '10px', fontWeight: 900, color: '#059669', textTransform: 'uppercase' } }, '⚡ BULK IMPORT • 1 KLIK FULL 1 BULAN'),
                  h('h3', { style: { fontSize: '15px', fontWeight: 900, color: '#831843', marginTop: '2px' } }, 'Input Cepat Jadwal Bulanan Mom Uung')
                ),
                h('button', { className: 'btn btn-soft', onClick: () => setBulkModalOpen(false) }, '✕')
              ),

              h('div', { style: { display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: '8px' } },
                h('select', { value: bulkMonth, onChange: e => setBulkMonth(Number(e.target.value)) },
                  Array.from({ length: 12 }).map((_, idx) =>
                    h('option', { key: idx, value: idx }, new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(2026, idx, 1)))
                  )
                ),
                h('select', { className: 'font-mono', value: bulkYear, onChange: e => setBulkYear(Number(e.target.value)) },
                  [2025, 2026, 2027, 2028, 2029, 2030].map(yr => h('option', { key: yr, value: yr }, yr))
                )
              ),

              h('div', null,
                h('label', { style: { display: 'block', fontSize: '11px', fontWeight: 800, color: '#831843', marginBottom: '4px' } },
                  `Tempel baris Excel atau ketik kode Tgl 1–${bulkDaysCount} (1/2/3/4 = Shift, L = Libur):`
                ),
                h('textarea', {
                  rows: 2,
                  className: 'font-mono',
                  placeholder: 'Contoh: 4,4,L,3,3,2,1,L,2,1,4,4,L,3,3,2,1,L,2,1,4,4,L,3,3,2,1,L,2,1,4',
                  value: bulkPatternText,
                  onChange: e => setBulkPatternText(e.target.value),
                  style: { width: '100%', fontSize: '11.5px' }
                })
              ),

              h('div', {
                className: 'flex flex-wrap items-center justify-between gap-1-5',
                style: { background: '#FFFFFF', border: '1.5px solid #F9A8D4', borderRadius: '11px', padding: '7px 10px', fontSize: '10.5px', fontWeight: 800 }
              },
                h('span', { style: { color: '#065F46' } }, `✅ Kerja: ${totalShiftWork} Hari`),
                h('span', { style: { color: '#BE123C' } }, `🔴 Libur: ${countMap['L']}`),
                h('span', { className: 'font-mono', style: { color: '#4A0424' } },
                  `S1:${countMap['1']} | S2:${countMap['2']} | S3:${countMap['3']} | S4:${countMap['4']}`
                )
              ),

              h('div', null,
                h('div', { style: { fontSize: '10px', fontWeight: 800, color: '#9D174D', marginBottom: '5px' } },
                  'Pratinjau Tanggal (Klik kotak mana saja untuk ganti shift):'
                ),
                h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px' } },
                  Array.from({ length: bulkDaysCount }).map((_, idx) => {
                    const code = parsedTokens[idx] || '';
                    const isOff = code === 'L';
                    const p = MOMUUNG_SHIFT_PRESETS[code];
                    return h('button', {
                      key: idx,
                      type: 'button',
                      onClick: () => handleCycleBulkDay(idx, bulkDaysCount),
                      style: {
                        padding: '5px 2px', borderRadius: '8px',
                        background: p ? p.bg : isOff ? '#FFE4E6' : '#FFFFFF',
                        color: p ? p.col : isOff ? '#BE123C' : '#64748B',
                        border: `1.5px solid ${p ? '#22C55E' : isOff ? '#FDA4AF' : '#F9A8D4'}`,
                        display: 'flex', flexDirection: 'column', alignItems: 'center', lineHeight: 1.15
                      }
                    },
                      h('span', { style: { fontSize: '9px', opacity: 0.75, fontWeight: 800 } }, idx + 1),
                      h('span', { className: 'font-mono', style: { fontSize: '11.5px', fontWeight: 900 } }, code || '-')
                    );
                  })
                )
              ),

              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', background: '#FFFFFF', border: '1px solid #F9A8D4', borderRadius: '11px', padding: '8px 10px' } },
                h('label', { className: 'flex items-center gap-1-5', style: { fontSize: '11px', fontWeight: 800, color: '#4A0424', cursor: 'pointer' } },
                  h('input', { type: 'checkbox', checked: bulkReplaceExisting, onChange: e => setBulkReplaceExisting(e.target.checked) }),
                  'Ganti jadwal Mom Uung lama di bulan ini (jadwal AquaPress/brand lain tetap aman)'
                ),
                h('label', { className: 'flex items-center gap-1-5', style: { fontSize: '11px', fontWeight: 800, color: '#9F1239', cursor: 'pointer' } },
                  h('input', { type: 'checkbox', checked: bulkMarkOffAsDayOff, onChange: e => setBulkMarkOffAsDayOff(e.target.checked) }),
                  'Tandai kode "L" sebagai DAY OFF penuh (biarkan tidak dicentang jika hari libur Mom Uung boleh di-booking brand lain)'
                )
              ),
h('div', {
                style: {
                  background: '#FFF7ED', border: '1.5px solid #FDBA74', borderRadius: '11px',
                  padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: '6px'
                }
              },
                h('div', { className: 'flex items-center justify-between', style: { fontSize: '10.5px', fontWeight: 900, color: '#9A3412' } },
                  h('span', null, '🛵 Estimasi Perjalanan Kos (Otomatis Semua Shift)'),
                  bulkTravelMinutes > 0 && h('span', { className: 'font-mono', style: { background: '#FDBA74', color: '#431407', padding: '1px 7px', borderRadius: '999px' } },
                    bulkTravelDirection === 'rt'
                      ? `PP ${bulkTravelMinutes} mnt (${Math.floor(bulkTravelMinutes / 2)}m pergi + ${Math.floor(bulkTravelMinutes / 2)}m pulang)`
                      : `${bulkTravelMinutes} mnt (${bulkTravelDirection === 'go' ? 'Pergi' : 'Pulang'})`
                  )
                ),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                  h('select', {
                    className: 'font-mono',
                    value: bulkTravelMinutes,
                    onChange: e => setBulkTravelMinutes(Number(e.target.value))
                  },
                    TRAVEL_STEP_OPTIONS.map(m => h('option', { key: m, value: m }, m === 0 ? 'Tanpa Perjalanan (0 mnt)' : `🛵 ${m} Menit (${m / 60} jam)`))
                  ),
                  h('select', {
                    value: bulkTravelDirection,
                    onChange: e => setBulkTravelDirection(e.target.value)
                  },
                    h('option', { value: 'rt' }, '🔄 PP (Pergi & Pulang)'),
                    h('option', { value: 'go' }, '➡️ Pergi Saja (OTW)'),
                    h('option', { value: 'back' }, '⬅️ Pulang Saja')
                  )
                )
              ),
              
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1.8fr', gap: '8px', marginTop: '2px' } },
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setBulkPatternText('') }, '🗑️ Bersihkan'),
                h('button', {
                  type: 'button',
                  className: 'btn btn-pink',
                  style: { padding: '10px', fontSize: '12px' },
                  onClick: handleApplyBulkMonth
                }, `⚡ Simpan ${totalShiftWork} Shift ke Cloud`)
              )
            )
          );
        })(),
        // MODAL CLONE DAY
        cloneModalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { maxWidth: '360px', display: 'flex', flexDirection: 'column', gap: '12px' } },
            h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, '📋 Salin Jadwal 1 Hari Penuh'),
            h('form', { onSubmit: handleCloneFullDay, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', { type: 'date', required: true, value: cloneTargetDate, onChange: e => setCloneTargetDate(e.target.value) }),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setCloneModalOpen(false) }, 'Batal'),
                h('button', { type: 'submit', className: 'btn btn-pink' }, 'Salin Sekarang')
              )
            )
          )
        ),

        // MODAL TAMBAH / EDIT JADWAL (ADMIN)
        modalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-box', style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
            h('div', { className: 'flex items-center justify-between', style: { borderBottom: '1.5px solid #F9A8D4', paddingBottom: '8px' } },
              h('h3', { style: { fontSize: '14px', fontWeight: 900, color: '#831843' } }, selectedSchedule ? '✏️ Edit Jadwal' : '✨ Tambah Jadwal Baru'),
              h('button', { className: 'btn btn-soft', onClick: () => setModalOpen(false) }, '✕')
            ),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
              // Grup 1: Preset Shift Mom Uung (Shift 1 - 4)
              h('div', { style: { background: '#F0FDF4', border: '1.5px solid #86EFAC', borderRadius: '12px', padding: '8px' } },
                h('div', { style: { fontSize: '10px', fontWeight: 900, color: '#166534', marginBottom: '5px', textTransform: 'uppercase' } }, '🍼 Preset Shift Mom Uung'),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px' } },
                  [
                   { n: 1, st: '06:00', en: '12:00' },
                  { n: 2, st: '12:00', en: '18:00' },
                  { n: 3, st: '18:00', en: '00:00' },
                  { n: 4, st: '00:00', en: '06:00' }
                  ].map(p => h('button', {
                    key: 'mu_' + p.n, type: 'button', className: 'btn',
                    style: { background: '#DCFCE7', color: '#14532D', borderColor: '#4ADE80', fontSize: '10.5px', padding: '6px 8px' },
                    onClick: () => applyPresetShift('b_momuung', 'Mom Uung', p.n, p.st, p.en)
                  }, `⚡ Shift ${p.n} (${p.st}-${p.en})`))
                )
              )
            ),
            
            h('form', { onSubmit: handleSave, style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('input', {
                type: 'text', required: true, placeholder: 'Judul Shift / Aktivitas...', value: formData.title,
                onChange: e => setFormData({ ...formData, title: e.target.value })
              }),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('select', { value: formData.brand_id, onChange: e => setFormData({ ...formData, brand_id: e.target.value }) },
                  brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
                ),
                h('select', { value: formData.status, onChange: e => setFormData({ ...formData, status: e.target.value }) },
                  ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF', 'Sakit / Medis'].map(st => h('option', { key: st, value: st }, st))
                )
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('input', { type: 'date', required: true, value: formData.date, onChange: e => setFormData({ ...formData, date: e.target.value }) }),
                !selectedSchedule && h('select', { value: repeatDays, onChange: e => setRepeatDays(Number(e.target.value)) },
                  [1, 2, 3, 5, 7].map(d => h('option', { key: d, value: d }, `Ulangi ${d} Hari`))
                )
              ),
h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                h('div', null,
                  h('label', { style: { display: 'block', fontSize: '10px', fontWeight: 800, color: '#831843', marginBottom: '3px' } }, 'Jam Mulai (Terkunci jika terisi)'),
                  h('select', { className: 'font-mono', style: { width: '100%' }, value: formData.start_time, onChange: e => setFormData({ ...formData, start_time: e.target.value }) },
                    START_TIME_OPTIONS.map(tm => {
                      const conflict = getAdminStartConflict(tm);
                      return h('option', {
                        key: tm,
                        value: tm,
                        disabled: !!conflict
                      }, conflict ? `🔒 ${tm} (${conflict.title})` : `🟢 ${tm}`);
                    })
                  )
                ),
                h('div', null,
                  h('label', { style: { display: 'block', fontSize: '10px', fontWeight: 800, color: '#831843', marginBottom: '3px' } }, 'Jam Selesai'),
                  h('select', { className: 'font-mono', style: { width: '100%' }, value: formData.end_time, onChange: e => setFormData({ ...formData, end_time: e.target.value }) },
                    END_TIME_OPTIONS.map(tm => {
                      const conflict = getAdminEndConflict(tm);
                      const isOvernightOpt = timeToMinutes(tm) > 0 && timeToMinutes(tm) < timeToMinutes(formData.start_time);
                      return h('option', {
                        key: tm,
                        value: tm,
                        disabled: !!conflict
                      }, conflict
                        ? (conflict.isOrderError ? `⛔ ${tm}` : `🔒 ${tm} (${conflict.title})`)
                        : (isOvernightOpt ? `🌙 ${tm} (+1 Hari)` : `🟢 ${tm}`));
                    })
                  )
                )
              ),
              h('div', {
                style: {
                  background: '#FFF7ED', border: '1.5px solid #FDBA74', borderRadius: '12px',
                  padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: '6px'
                }
              },
                (() => {
                  const trM = Number(travelMinutes) || 0;
                  const legM = travelDirection === 'rt' ? Math.floor(trM / 2) : trM;
                  const sM = timeToMinutes(formData.start_time);
                  const rE = timeToMinutes(formData.end_time);
                  const showGo = legM > 0 && (travelDirection === 'go' || travelDirection === 'rt');
                  const showBack = legM > 0 && (travelDirection === 'back' || travelDirection === 'rt');

                  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } },
                    h('div', { className: 'flex items-center justify-between flex-wrap gap-1', style: { fontSize: '10.5px', fontWeight: 900, color: '#9A3412' } },
                      h('span', null, '🛵 Estimasi Perjalanan Kos'),
                      trM > 0 && h('span', {
                        className: 'font-mono',
                        style: { background: '#FDBA74', color: '#431407', padding: '2px 8px', borderRadius: '999px', fontSize: '9.5px' }
                      },
                        travelDirection === 'rt'
                          ? `PP ${trM}m (${legM}m pergi • ${legM}m pulang)`
                          : `${trM}m (${travelDirection === 'go' ? 'Pergi' : 'Pulang'})`
                      )
                    ),
                    trM > 0 && h('div', {
                      className: 'font-mono',
                      style: {
                        background: '#FFFFFF', border: '1px dashed #FB923C', borderRadius: '8px',
                        padding: '5px 8px', fontSize: '10px', fontWeight: 800, color: '#7C2D12',
                        display: 'flex', flexWrap: 'wrap', gap: '8px'
                      }
                    },
                      showGo && h('span', null, `➡️ Pergi: ${formatMinutesWrap(sM - legM)}–${formatMinutesWrap(sM)} (${legM}m)`),
                      showBack && h('span', null, `⬅️ Pulang: ${formatMinutesWrap(rE)}–${formatMinutesWrap(rE + legM)} (${legM}m)`)
                    )
                  );
                })(),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                  h('select', {
                    className: 'font-mono',
                    value: travelMinutes,
                    onChange: e => setTravelMinutes(Number(e.target.value))
                  },
                    TRAVEL_STEP_OPTIONS.map(m => h('option', { key: m, value: m }, m === 0 ? 'Tanpa Perjalanan (0 mnt)' : `🛵 ${m} Menit (${m / 60} jam)`))
                  ),
                  h('select', {
                    value: travelDirection,
                    onChange: e => setTravelDirection(e.target.value)
                  },
                    h('option', { value: 'rt' }, '🔄 PP (Pergi & Pulang)'),
                    h('option', { value: 'go' }, '➡️ Pergi Saja (OTW)'),
                    h('option', { value: 'back' }, '⬅️ Pulang Saja')
                  )
                )
              ),
              currentFormConflict && h('div', { style: { background: '#FFE4E6', border: '1.5px solid #E11D48', color: '#9F1239', padding: '8px', borderRadius: '10px', fontSize: '11px', fontWeight: 800 } },
                `⛔ Jam bentrok dengan "${currentFormConflict.title}" (${currentFormConflict.start_time}-${currentFormConflict.end_time})`
              ),
              h('textarea', {
                rows: 2, placeholder: 'Catatan / Target GMV...', value: formData.notes,
                onChange: e => setFormData({ ...formData, notes: e.target.value })
              }),
              h('div', { className: 'flex items-center justify-between', style: { marginTop: '4px' } },
                selectedSchedule
                  ? h('button', { type: 'button', className: 'btn btn-soft', style: { color: '#E11D48' }, onClick: () => handleDelete(selectedSchedule.id) }, '🗑️ Hapus')
                  : h('span'),
                h('div', { className: 'flex gap-2' },
                  h('button', { type: 'button', className: 'btn btn-soft', onClick: () => setModalOpen(false) }, 'Batal'),
                  h('button', { type: 'submit', disabled: !!currentFormConflict, className: 'btn btn-pink' }, 'Simpan ke Cloud')
                )
              )
            )
          )
        )
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(WorkApp));
  </script>
</body>
</html>
