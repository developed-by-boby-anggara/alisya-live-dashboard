      const sc = sec % 60;
      return `${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')}:${String(sc).padStart(2, '0')}`;

    const calculateDurationHours = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end === '23:59' ? [24, 0] : end.split(':').map(Number);
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) diff = Math.max(0, (24 * 60 - (sh * 60 + sm)) + (eh * 60 + em));
      return Math.round((diff / 60) * 10) / 10;

    function WorkApp() {
      const [nowTime, setNowTime] = useState(() => new Date());
      useEffect(() => {
        const timer = setInterval(() => setNowTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const realTodayStr = useMemo(() => {
        return `${nowTime.getFullYear()}-${String(nowTime.getMonth() + 1).padStart(2, '0')}-${String(nowTime.getDate()).padStart(2, '0')}`;
      }, [nowTime]);

      const liveClockString = useMemo(() => {
        return `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}:${String(nowTime.getSeconds()).padStart(2, '0')}`;

      const [lang, setLang] = useState(() => localStorage.getItem('alisya_lang') === 'en' ? 'en' : 'id');
      const handleSetLang = (newLang) => {
        setLang(newLang);
        localStorage.setItem('alisya_lang', newLang);
      };
      const t = TRANSLATIONS[lang] || TRANSLATIONS.id;

      const [displayMode, setDisplayMode] = useState(() => window.innerWidth < 1024 ? 'mobile' : 'pc');
      useEffect(() => {
        const onResize = () => setDisplayMode(window.innerWidth < 1024 ? 'mobile' : 'pc');
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      const [activeTab, setActiveTab] = useState('agenda');
      const [selectedDate, setSelectedDate] = useState(realTodayStr);
      const [currentYear, setCurrentYear] = useState(() => new Date().getFullYear());
      const [currentMonth, setCurrentMonth] = useState(() => new Date().getMonth());

      useEffect(() => {
        if (selectedDate) {
          const [y, m] = selectedDate.split('-').map(Number);
          if (y && m) { setCurrentYear(y); setCurrentMonth(m - 1); }
        }
      }, [selectedDate]);

      const [schedules, setSchedules] = useState(() => {
        try {
          const cached = localStorage.getItem('alisya_schedules_cache');
          return cached ? JSON.parse(cached) : INITIAL_SCHEDULES;
        } catch (e) { return INITIAL_SCHEDULES; }
      });
      const [brands, setBrands] = useState(REQUIRED_CATEGORIES);

      const [customStatMonth, setCustomStatMonth] = useState(() => new Date().getMonth());
      const [customStatYear, setCustomStatYear] = useState(() => new Date().getFullYear());

      const [searchQuery, setSearchQuery] = useState('');
      const [filterBrand, setFilterBrand] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterDate, setFilterDate] = useState('');
      const [filterHour, setFilterHour] = useState('ALL');

      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSchedule, setSelectedSchedule] = useState(null);
      const [repeatDays, setRepeatDays] = useState(1);
      const [cloneModalOpen, setCloneModalOpen] = useState(false);
      const [cloneTargetDate, setCloneTargetDate] = useState(() => addDaysToDateStr(realTodayStr, 1));
      const [formData, setFormData] = useState({
        id: '', date: realTodayStr, start_time: '10:00', end_time: '12:00',
        title: '', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: '', gmv: '',
        checklist: { shoot: false, edit: false, upload: false }
      });

      const [toast, setToast] = useState('');
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3500); };

      // Sinkronisasi Real-Time Firebase (100% Terhubung Otomatis dengan index.html)
      useEffect(() => {
        if (!firebaseDb) return;
        const refSch = firebaseDb.ref('alisya_schedules');
        refSch.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) {
            setSchedules(val);
            try { localStorage.setItem('alisya_schedules_cache', JSON.stringify(val)); } catch (e) {}
          } else {
            refSch.set(INITIAL_SCHEDULES);
          }
        });

        const refBrands = firebaseDb.ref('alisya_brands');
        refBrands.on('value', snap => {
          const val = snap.val();
          if (val && Array.isArray(val)) setBrands(val);
        });

        const refNote = firebaseDb.ref('alisya_sticky_note');
        refNote.on('value', snap => {
          const val = snap.val();
          if (val) setStickyNote(val);
        });

        return () => { refSch.off(); refBrands.off(); refNote.off(); };
      }, []);

      const saveSchedulesToCloud = (newList) => {
        setSchedules(newList);
        try { localStorage.setItem('alisya_schedules_cache', JSON.stringify(newList)); } catch (e) {}
        if (firebaseDb) firebaseDb.ref('alisya_schedules').set(newList);
      };

      const saveBrandsToCloud = (newBrands) => {
        setBrands(newBrands);
        if (firebaseDb) firebaseDb.ref('alisya_brands').set(newBrands);
      };

      const getHariNama = (dateString) => {
        if (!dateString) return '-';
        const [y, m, d] = dateString.split('-').map(Number);
        return new Intl.DateTimeFormat(t.locale, { weekday: 'long' }).format(new Date(y, m - 1, d));
      };

      const daysInMonth = useMemo(() => new Date(currentYear, currentMonth + 1, 0).getDate(), [currentYear, currentMonth]);
      const monthName = useMemo(() => new Intl.DateTimeFormat(t.locale, { month: 'long' }).format(new Date(currentYear, currentMonth, 1)), [currentYear, currentMonth, t.locale]);

      const getSessionTimeState = (item) => {
        if (item.date < realTodayStr) return 'done';
        if (item.date > realTodayStr) return 'upcoming';
        const nowMin = nowTime.getHours() * 60 + nowTime.getMinutes();
        const sMin = timeToMinutes(item.start_time);
        let eMin = timeToMinutes(item.end_time);
        if (eMin <= sMin) eMin = 24 * 60;
        if (nowMin >= eMin) return 'done';
        if (nowMin >= sMin && nowMin < eMin) return 'live';
        return 'upcoming';
      };

      const liveTracker = useMemo(() => {
        const todayList = schedules
          .filter(s => s.date === realTodayStr && s.status !== 'OFF' && s.status !== 'SAKIT' && s.status !== 'Sakit / Medis' && s.brand_id !== 'b_sakit')
          .sort((a, b) => a.start_time.localeCompare(b.start_time));

        const nowTotalSeconds = nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();
        const toSec = (tStr) => {
          if (!tStr) return 0;
          if (tStr === '23:59') return 24 * 3600;
          const [hr, mn] = tStr.split(':').map(Number);
          return hr * 3600 + mn * 60;
        };

        let activeItem = null, nextItem = null, completedCount = 0;

        todayList.forEach(item => {
          const sSec = toSec(item.start_time);
          let eSec = toSec(item.end_time);
          if (eSec <= sSec) eSec = 24 * 3600;

          if (nowTotalSeconds >= sSec && nowTotalSeconds < eSec) {
            const remSec = eSec - nowTotalSeconds;
            const totalDurSec = Math.max(1, eSec - sSec);
            const sessionPct = Math.min(100, Math.max(0, (((nowTotalSeconds - sSec) / totalDurSec) * 100).toFixed(1)));
            activeItem = { ...item, remainingSec: remSec, remainingHMS: formatSecondsToHMS(remSec), sessionPct };
          } else if (nowTotalSeconds >= eSec) {
            completedCount++;
          } else if (nowTotalSeconds < sSec && !nextItem) {
            const diffSec = sSec - nowTotalSeconds;
            nextItem = { ...item, startsInSec: diffSec, startsInHMS: formatSecondsToHMS(diffSec), startsInMin: Math.ceil(diffSec / 60) };
          }
        });

        const activeFraction = activeItem ? Number(activeItem.sessionPct) / 100 : 0;
        const progressPct = todayList.length > 0 ? Math.min(100, Math.round(((completedCount + activeFraction) / todayList.length) * 100)) : 0;

      const broadcastMetrics = useMemo(() => {

              completedLiveHours += calculateDurationHours(s.start_time, s.end_time);

          }

        const totalHours = 480 + Math.round(completedLiveHours);

        let totalPrimeSlots = 0, occupiedPrimeSlots = 0;
        for (let i = 0; i < 7; i++) {
          const dStr = addDaysToDateStr(realTodayStr, i);
          const dayList = schedules.filter(s => s.date === dStr && s.status !== 'OFF');
          TIME_SLOTS.forEach(slot => {
            totalPrimeSlots++;
            const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
            const isBusy = dayList.some(s => {
              const st = timeToMinutes(s.start_time);
              let en = timeToMinutes(s.end_time);
              if (en <= st) en = 24 * 60;
              return st < eM && en > sM;
            });
            if (isBusy) occupiedPrimeSlots++;
          });
        }
        const freeSlots = Math.max(0, totalPrimeSlots - occupiedPrimeSlots);
        let badge = '🟢 Schedule Active & Open';
        if (freeSlots <= 10) badge = '🔒 Fully Booked This Week';

        } else {

          const count = Number(repeatDays) || 1;

            const targetDate = i === 0 ? basePayload.date : addDaysToDateStr(basePayload.date, i);
            const daySchedules = schedules.filter(s => s.date === targetDate);
            const hasConflict = daySchedules.some(ex => {
              const exS = timeToMinutes(ex.start_time);
              let exE = timeToMinutes(ex.end_time);
              if (exE <= exS) exE = 24 * 60;
              return sMin < exE && eMin > exS;
            });
            if (!hasConflict) newItems.push({ ...basePayload, id: 'sch_' + Date.now() + '_' + i, date: targetDate });
          }
          if (newItems.length === 0) { notify('⛔ Jam tersebut sudah terisi!'); return; }
          saveSchedulesToCloud([...schedules, ...newItems]);
          notify(`✅ ${newItems.length} sesi jadwal berhasil disimpan!`);
        }
        setModalOpen(false);

            let exE = timeToMinutes(ex.end_time);

              h('div', { className: 'flex items-center gap-2 flex-wrap' },
                brands.map(b => h('span', { key: b.id, className: 'flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 text-[11px] font-bold text-slate-200' },
                  h('span', { className: 'w-2.5 h-2.5 rounded-full', style: { backgroundColor: b.color } }),
                  `${b.emoji} ${b.name}`
                ))
              )
            ),

            h('div', { id: 'work-spreadsheet-capture', className: 'bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl' },
              h('div', { className: 'overflow-x-auto', style: { maxHeight: '75vh' } },
                h('table', { className: 'w-full border-collapse text-xs select-none' },
                  h('thead', null,
                    h('tr', { className: 'bg-slate-950 text-emerald-400 sticky-header' },
                      h('th', { className: 'sticky-col bg-slate-950 px-3 py-3 text-left font-black border-b border-r border-slate-800 min-w-[160px]' }, `💼 ${t.colDateTime}`),
                      h('th', { className: 'bg-slate-950 px-2 py-3 text-center font-bold border-b border-r border-slate-800 min-w-[115px]' }, t.colDayStatus),
                      TIME_SLOTS.map(slot => h('th', { key: slot.label, className: 'px-2 py-3 text-center font-mono font-bold border-b border-r border-slate-800 min-w-[100px] text-slate-300' }, slot.label))
                    )
                  ),
                  h('tbody', null,
                    Array.from({ length: daysInMonth }).map((_, i) => {
                      const day = i + 1;
                      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                      const dtObj = new Date(currentYear, currentMonth, day);
                      const dayName = new Intl.DateTimeFormat(t.locale, { weekday: 'short' }).format(dtObj);
                      const isToday = dateStr === realTodayStr;
                      const density = getDayScheduleDensity(dateStr);

                      return h('tr', { key: day, className: isToday ? 'today-row-highlight' : 'hover:bg-slate-800/40' },
                        h('td', { className: 'sticky-col bg-slate-900 px-3 py-2 border-r border-b border-slate-800 font-bold whitespace-nowrap' },
                          h('div', { className: 'flex items-center gap-2' },
                            h('span', { className: 'text-sm font-black text-white w-5' }, day),
                            h('span', { className: 'text-xs uppercase text-emerald-400' }, dayName),
                            isToday && h('span', { className: 'bg-emerald-500 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-full ml-auto' }, t.todayBadge)
                          )
                        ),
                        h('td', { className: 'border-r border-b border-slate-800 p-1.5 text-center whitespace-nowrap' },
                          h('span', { className: `px-2 py-0.5 rounded-lg text-[10px] border ${density.badge}` }, density.text)
                        ),
                        TIME_SLOTS.map(slot => {
                          const sM = timeToMinutes(slot.start), eM = timeToMinutes(slot.end);
                          const slotItems = schedules.filter(s => {
                            if (s.date !== dateStr) return false;
                            const st = timeToMinutes(s.start_time);
                            let en = timeToMinutes(s.end_time);
                            if (en <= st) en = 24 * 60;
                            return st < eM && en > sM;
                          });
                          return h('td', {
                            key: slot.label,
                            onClick: () => slotItems.length > 0 ? (isAdmin ? handleOpenEdit(slotItems[0]) : notify(`⏰ ${slotItems[0].start_time}-${slotItems[0].end_time}: ${slotItems[0].title}`)) : handleOpenCreate(dateStr, slot.start, slot.end),
                            className: 'border-r border-b border-slate-800 p-1 align-top h-12 cursor-pointer hover:bg-slate-800/50'
                          },
                            slotItems.map(item => h('div', {
                              key: item.id,
                              className: 'p-1 rounded-lg font-bold text-[10px] text-slate-950 shadow-xs mb-0.5 truncate',
                              style: { backgroundColor: item.color }
                            }, item.title))
                          );
                        })
                      );
                    })
                  )
                )
              )
            )
          ),

          // TAB 3: KPI & GRAFIK KERJA
          activeTab === 'kpi' && h('div', { className: 'space-y-5' },
            h('div', { className: 'bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-3' },
              h('div', { className: 'flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold' },
                ['daily', 'weekly', 'monthly', 'yearly'].map(p => h('button', {
                  key: p, onClick: () => setStatPeriod(p),
                  className: `px-3 py-1.5 rounded-lg capitalize ${statPeriod === p ? 'bg-emerald-500 text-slate-950 font-black' : 'text-slate-400'}`
                }, p))
              ),
              (statPeriod === 'daily' || statPeriod === 'weekly') && h('input', {
                type: 'date', value: customStatDate, onChange: e => setCustomStatDate(e.target.value),
                className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-bold text-white'
              })
            ),
            h('div', { className: 'grid grid-cols-2 md:grid-cols-5 gap-3' },
              [
                { label: t.totalLive, val: stats.totalLive, sub: `${stats.totalLiveHours} ${t.hoursLive}`, cls: 'text-emerald-400' },
                { label: t.takeKonten, val: stats.totalKonten, sub: `${stats.totalKontenHours} ${t.hoursProd}`, cls: 'text-purple-400' },
                { label: t.sleepTime, val: stats.totalSleep, sub: `${stats.totalSleepHours} ${t.hoursSleep}`, cls: 'text-sky-400' },
                { label: t.meTime, val: stats.totalMeTime, sub: 'Personal Sessions', cls: 'text-pink-400' },
                { label: t.offDay, val: stats.totalOff, sub: 'Days Off', cls: 'text-rose-400' }
              ].map((k, idx) => h('div', { key: idx, className: 'bg-slate-900 p-4 rounded-2xl border border-slate-800' },
                h('div', { className: 'text-[10px] font-bold text-slate-400 uppercase' }, k.label),
                h('div', { className: `text-2xl font-black mt-1 ${k.cls}` }, k.val),
                h('div', { className: 'text-[11px] text-slate-400 mt-1 font-semibold' }, k.sub)
              ))
            ),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-5' },
              h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800' },
                h('h3', { className: 'text-xs font-black text-slate-200 uppercase mb-3' }, t.propTitle),
                h('div', { className: 'h-64 relative' }, h('canvas', { ref: donutCanvas }))
              ),
              h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800' },
                h('h3', { className: 'text-xs font-black text-slate-200 uppercase mb-3' }, t.barTitle),
                h('div', { className: 'h-64 relative' }, h('canvas', { ref: barCanvas }))
              )
            )
          ),

          // TAB 4: DATABASE SEMUA JADWAL
          activeTab === 'list' && h('div', { className: 'bg-slate-900 rounded-2xl border border-slate-800 p-4 md:p-6 space-y-4' },
            h('div', { className: 'grid grid-cols-1 md:grid-cols-4 gap-2.5 text-xs' },
              h('input', {
                type: 'text', placeholder: t.searchPlaceholder, value: searchQuery, onChange: e => setSearchQuery(e.target.value),
                className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white'
              }),
              h('select', { value: filterBrand, onChange: e => setFilterBrand(e.target.value), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white' },
                h('option', { value: 'ALL' }, t.allCategories),
                brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))
              ),
              h('select', { value: filterStatus, onChange: e => setFilterStatus(e.target.value), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white' },
                h('option', { value: 'ALL' }, t.allStatuses),
                ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF'].map(st => h('option', { key: st, value: st }, st))
              ),
              h('input', { type: 'date', value: filterDate, onChange: e => setFilterDate(e.target.value), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white' })
            ),
            h('div', { className: 'overflow-x-auto' },
              h('table', { className: 'w-full text-left text-xs' },
                h('thead', { className: 'bg-slate-950 text-emerald-400 uppercase border-b border-slate-800' },
                  h('tr', null,
                    h('th', { className: 'px-3 py-3' }, t.colDay),
                    h('th', { className: 'px-3 py-3' }, t.colDate),
                    h('th', { className: 'px-3 py-3' }, t.colHour),
                    h('th', { className: 'px-3 py-3' }, t.colTitle),
                    h('th', { className: 'px-3 py-3' }, t.colCategory),
                    h('th', { className: 'px-3 py-3' }, t.colStatus),
                    h('th', { className: 'px-3 py-3' }, t.colNotes),
                    isAdmin && h('th', { className: 'px-3 py-3 text-right' }, t.colAction)
                  )
                ),
                h('tbody', { className: 'divide-y divide-slate-800' },
                  filteredSchedules.map(s => {
                    const brand = brands.find(b => b.id === s.brand_id);
                    return h('tr', { key: s.id, className: 'hover:bg-slate-800/40' },
                      h('td', { className: 'px-3 py-2.5 font-bold text-slate-300' }, getHariNama(s.date)),
                      h('td', { className: 'px-3 py-2.5 font-mono text-white' }, s.date),
                      h('td', { className: 'px-3 py-2.5 font-mono text-emerald-400 font-bold' }, `${s.start_time} - ${s.end_time}`),
                      h('td', { className: 'px-3 py-2.5 font-black text-white' }, s.title),
                      h('td', { className: 'px-3 py-2.5 text-slate-300' }, `${brand?.emoji || ''} ${brand?.name || ''}`),
                      h('td', { className: 'px-3 py-2.5' }, h('span', { className: 'px-2 py-0.5 rounded font-bold text-[10px] text-slate-950', style: { backgroundColor: s.color } }, s.status)),
                      h('td', { className: 'px-3 py-2.5 text-slate-400 italic' }, s.notes || '-'),
                      isAdmin && h('td', { className: 'px-3 py-2.5 text-right space-x-2 whitespace-nowrap' },
                        h('button', { onClick: () => handleOpenEdit(s), className: 'text-emerald-400 font-bold hover:underline' }, t.editBtn),
                        h('button', { onClick: () => handleDelete(s.id), className: 'text-rose-400 font-bold hover:underline' }, t.deleteBtn)
                      )
                    );
                  })
                )
              )
            )
          ),

          // TAB 5: KATEGORI & WARNA BRAND
          activeTab === 'colors' && h('div', { className: 'bg-slate-900 rounded-2xl border border-slate-800 p-5 max-w-xl mx-auto space-y-3' },
            h('h3', { className: 'font-black text-sm text-white' }, `🏷️ ${t.tabColors}`),
            brands.map(b => h('div', { key: b.id, className: 'flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800' },
              h('div', { className: 'flex items-center gap-3' },
                h('input', {
                  type: 'color', disabled: !isAdmin, value: b.color,
                  onChange: e => {
                    const newColor = e.target.value;
                    saveBrandsToCloud(brands.map(it => it.id === b.id ? { ...it, color: newColor } : it));
                    saveSchedulesToCloud(schedules.map(s => s.brand_id === b.id ? { ...s, color: newColor } : s));
                  },
                  className: 'w-8 h-8 rounded cursor-pointer bg-transparent'
                }),
                h('span', { className: 'font-bold text-xs text-white' }, `${b.emoji} ${b.name}`)
              ),
              h('span', { className: 'font-mono text-xs text-slate-400' }, b.color)
            ))
          )
        ),

        // MODAL PIN ADMIN
        pinInputModal && h('div', { className: 'fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4' },
          h('div', { className: 'bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl' },
            h('h3', { className: 'font-black text-base text-white' }, '🔑 Admin Access'),
            h('form', { onSubmit: handleVerifyPin, className: 'space-y-3' },
              h('input', {
                type: 'password', maxLength: 6, autoFocus: true, value: enteredPin,
                onChange: e => { setEnteredPin(e.target.value); setPinError(false); },
                placeholder: 'PIN Admin',
                className: 'w-full text-center text-xl tracking-widest font-mono font-black bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-emerald-400'
              }),
              pinError && h('div', { className: 'text-rose-400 text-xs font-bold' }, 'PIN salah!'),
              h('div', { className: 'flex gap-2' },
                h('button', { type: 'button', onClick: () => setPinInputModal(false), className: 'w-1/2 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs' }, 'Batal'),
                h('button', { type: 'submit', className: 'w-1/2 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs' }, 'Buka')
              )
            )
          )
        ),

        // MODAL CLONE DAY
        cloneModalOpen && h('div', { className: 'fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4' },
          h('div', { className: 'bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl' },
            h('h3', { className: 'font-black text-base text-white' }, '📋 Salin Jadwal 1 Hari Penuh'),
            h('form', { onSubmit: handleCloneFullDay, className: 'space-y-3 text-xs' },
              h('input', { type: 'date', required: true, value: cloneTargetDate, onChange: e => setCloneTargetDate(e.target.value), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold' }),
              h('div', { className: 'flex gap-2' },
                h('button', { type: 'button', onClick: () => setCloneModalOpen(false), className: 'w-1/2 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold' }, 'Batal'),
                h('button', { type: 'submit', className: 'w-1/2 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black' }, 'Salin Sekarang')
              )
            )
          )
        ),

        // MODAL TAMBAH / EDIT JADWAL
        modalOpen && h('div', { className: 'fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4' },
          h('div', { className: 'bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-3 text-xs shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-800 pb-2.5' },
              h('h3', { className: 'font-black text-sm text-emerald-400' }, selectedSchedule ? '✏️ Edit Jadwal' : '➕ Tambah Jadwal Baru'),
              h('button', { onClick: () => setModalOpen(false), className: 'text-slate-400 hover:text-white font-bold' }, '✕')
            ),
            h('div', { className: 'grid grid-cols-2 gap-1.5' },
              [
                { b: 'b_momuung', name: 'Mom Uung', n: 1, st: '05:00', en: '13:00' },
                { b: 'b_momuung', name: 'Mom Uung', n: 2, st: '11:00', en: '19:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 1, st: '08:00', en: '12:00' },
                { b: 'b_aquapress', name: 'AquaPress', n: 2, st: '12:00', en: '16:00' }
              ].map((p, idx) => h('button', {
                key: idx, type: 'button', onClick: () => applyPresetShift(p.b, p.name, p.n, p.st, p.en),
                className: 'bg-slate-950 hover:bg-slate-800 border border-slate-700 rounded-xl p-2 text-left'
              }, h('div', { className: 'font-black text-emerald-400 text-[10px]' }, `Shift ${p.n} ${p.name}`), h('div', { className: 'font-mono text-[9px] text-slate-400' }, `${p.st} - ${p.en}`)))
            ),
            h('form', { onSubmit: handleSave, className: 'space-y-3' },
              h('input', {
                type: 'text', required: true, placeholder: 'Nama Shift / Agenda...', value: formData.title,
                onChange: e => setFormData({ ...formData, title: e.target.value }),
                className: 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-bold'
              }),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('select', {
                  value: formData.brand_id, onChange: e => setFormData({ ...formData, brand_id: e.target.value }),
                  className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold'
                }, brands.map(b => h('option', { key: b.id, value: b.id }, `${b.emoji} ${b.name}`))),
                h('select', {
                  value: formData.status, onChange: e => setFormData({ ...formData, status: e.target.value }),
                  className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold'
                }, ['LIVE', 'Konten', 'Meeting', 'Tidur', 'Me Time', 'OFF', 'Sakit / Medis'].map(st => h('option', { key: st, value: st }, st)))
              ),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('input', { type: 'date', required: true, value: formData.date, onChange: e => setFormData({ ...formData, date: e.target.value }), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold' }),
                !selectedSchedule && h('select', { value: repeatDays, onChange: e => setRepeatDays(Number(e.target.value)), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-emerald-400 font-bold' },
                  [1, 2, 3, 5, 7].map(d => h('option', { key: d, value: d }, `Ulangi ${d} Hari`))
                )
              ),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('select', { value: formData.start_time, onChange: e => setFormData({ ...formData, start_time: e.target.value }), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold' },
                  START_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                ),
                h('select', { value: formData.end_time, onChange: e => setFormData({ ...formData, end_time: e.target.value }), className: 'bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold' },
                  END_TIME_OPTIONS.map(tm => h('option', { key: tm, value: tm }, tm))
                )
              ),
              currentFormConflict && h('div', { className: 'bg-rose-950/80 border border-rose-500 text-rose-200 p-2.5 rounded-xl text-[11px] font-bold' },
                `⛔ Jam bentrok dengan "${currentFormConflict.title}" (${currentFormConflict.start_time}-${currentFormConflict.end_time})`
              ),
              h('textarea', {
                rows: 2, placeholder: 'Catatan / Target GMV...', value: formData.notes,
                onChange: e => setFormData({ ...formData, notes: e.target.value }),
                className: 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white'
              }),
              h('div', { className: 'flex justify-between items-center pt-2' },
                selectedSchedule
                  ? h('button', { type: 'button', onClick: () => handleDelete(selectedSchedule.id), className: 'text-rose-400 font-bold hover:underline' }, '🗑️ Hapus')
                  : h('span'),
                h('div', { className: 'flex gap-2' },
                  h('button', { type: 'button', onClick: () => setModalOpen(false), className: 'px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold' }, 'Batal'),
                  h('button', { type: 'submit', disabled: !!currentFormConflict, className: 'px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black disabled:opacity-40' }, 'Simpan ke Cloud')
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(WorkApp));
  </script>
</body>
</html>
